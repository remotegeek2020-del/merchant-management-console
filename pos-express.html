<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS Express</title>
<script src="js/access-guard.js"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  :root{--orange:#ea580c;--orange-d:#9a3412;--muted:#94a3b8;--border:#e2e8f0;--green:#16a34a;--red:#dc2626;}
  *{box-sizing:border-box;}body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#fff7ed;color:#0f172a;}
  .sidebar{position:fixed;top:0;left:0;width:230px;height:100vh;background:linear-gradient(180deg,#7c2d12,#9a3412);display:flex;flex-direction:column;z-index:100;}
  .sb-head{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.12);}
  .sb-brand{color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;}
  .sb-sub{color:#fed7aa;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
  .switcher{margin:12px 14px 4px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden;}
  .switcher a{display:flex;align-items:center;gap:8px;padding:9px 12px;color:#fff;text-decoration:none;font-size:12px;font-weight:700;}
  .switcher a.cur{background:var(--orange);}
  .switcher a:not(.cur):hover{background:rgba(255,255,255,.08);}
  .nav{flex:1;padding:10px 12px;display:flex;flex-direction:column;gap:2px;}
  .nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:rgba(255,255,255,.7);background:none;border:none;cursor:pointer;font-family:inherit;text-align:left;}
  .nav button:hover{background:rgba(255,255,255,.08);color:#fff;}
  .nav button.on{background:var(--orange);color:#fff;}
  .nav .material-icons{font-size:18px;}
  .main{margin-left:230px;min-height:100vh;}
  .topbar{background:#fff;border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px;}
  .topbar h1{font-size:18px;font-weight:800;margin:0;flex:1;}
  .btn{border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn-o{background:var(--orange);color:#fff;}.btn-n{background:#fff;color:#475569;border:1px solid var(--border);}
  .content{padding:22px 24px;max-width:1160px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px;}
  .stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:15px;}
  .stat .n{font-size:26px;font-weight:800;}.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;}
  .card h3{font-size:14px;font-weight:800;margin:0;padding:14px 18px;border-bottom:1px solid var(--border);}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:10px;text-transform:uppercase;color:var(--muted);padding:9px 14px;background:#fff7ed;font-weight:800;}
  td{padding:10px 14px;border-top:1px solid #f8fafc;font-size:13px;}
  tr.click{cursor:pointer;}tr.click:hover td{background:#fff7ed;}
  .pill{font-size:10px;font-weight:800;border-radius:5px;padding:2px 7px;}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .tab{padding:6px 13px;border:1px solid var(--border);background:#fff;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;color:#64748b;}
  .tab.on{background:var(--orange);color:#fff;border-color:var(--orange);}
  .empty{text-align:center;padding:26px;color:var(--muted);font-size:13px;}
  /* Kanban board */
  .kb-wrap{overflow-x:auto;padding-bottom:8px;}
  .kb{display:flex;gap:14px;align-items:flex-start;min-height:60vh;}
  .kb-col{flex:0 0 268px;width:268px;background:#fff;border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;max-height:calc(100vh - 190px);}
  .kb-col.drop{outline:2px dashed var(--orange);outline-offset:-3px;background:#fff7ed;}
  .kb-colhead{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:#fff;border-radius:14px 14px 0 0;}
  .kb-colhead .nm{font-weight:800;font-size:13px;flex:1;}
  .kb-colhead .ct{font-size:11px;font-weight:800;color:var(--muted);background:#f1f5f9;border-radius:20px;padding:2px 9px;}
  .kb-colhead .wf{color:#7c3aed;font-size:16px;}
  .kb-body{padding:10px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:9px;}
  .kb-card{background:#fff;border:1px solid var(--border);border-radius:11px;padding:11px 12px;cursor:grab;box-shadow:0 1px 2px rgba(15,23,42,.04);}
  .kb-card:hover{border-color:var(--orange);}
  .kb-card.drag{opacity:.4;}
  .kb-card .biz{font-weight:800;font-size:13px;margin-bottom:5px;}
  .kb-card .row{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#64748b;margin-top:3px;}
  .kb-card .row .material-icons{font-size:13px;color:#cbd5e1;}
  .kb-card .vol{font-weight:800;color:#16a34a;}
  .kb-empty{color:var(--muted);font-size:12px;text-align:center;padding:16px 6px;border:1px dashed var(--border);border-radius:9px;}
  /* Bell */
  .bell{position:relative;cursor:pointer;color:#64748b;display:flex;align-items:center;}
  .bell .material-icons{font-size:24px;}
  .bell-badge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
  .bell-panel{position:absolute;top:56px;right:24px;width:340px;max-height:60vh;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.18);z-index:200;display:none;}
  .bell-panel h4{margin:0;padding:12px 16px;font-size:13px;font-weight:800;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
  .bell-item{padding:11px 16px;border-bottom:1px solid #f1f5f9;cursor:pointer;}
  .bell-item:hover{background:#fff7ed;}.bell-item.unread{background:#fff7ed;}
  .bell-item .t{font-size:12.5px;font-weight:700;}.bell-item .b{font-size:12px;color:var(--muted);margin-top:2px;}.bell-item .d{font-size:10.5px;color:#cbd5e1;margin-top:3px;}
  /* Tag chips + mentions */
  .ptag{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:99px;font-size:11.5px;font-weight:700;border:1.5px solid var(--border);background:#fff;color:#475569;cursor:pointer;margin:0 6px 6px 0;}
  .ptag.on{background:var(--orange);border-color:var(--orange);color:#fff;}
  .note-mentions{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px;}
  .mchip{font-size:10.5px;font-weight:700;color:#9a3412;background:#ffedd5;border-radius:6px;padding:2px 7px;}
  .pnote{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;text-align:left;}
  .pnote-h{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .pnote-badge{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:5px;}
  .pnote-body{font-size:13px;line-height:1.5;white-space:pre-wrap;}
  .tag-sug{position:absolute;left:0;right:0;top:100%;margin-top:2px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:100000;max-height:200px;overflow:auto;display:none;text-align:left;}
  .tag-sug-item{padding:8px 12px;font-size:13px;cursor:pointer;font-weight:600;color:#334155;}
  .tag-sug-item:hover{background:#fff7ed;}
  /* Form Designer */
  .fd-overlay{position:fixed;inset:0;background:#0f172a;z-index:1000;display:flex;flex-direction:column;}
  .fd-top{background:#1e293b;color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;}
  .fd-top .t{font-weight:800;font-size:15px;flex:1;}
  .fd-body{flex:1;display:flex;overflow:hidden;}
  .fd-left{width:420px;background:#f8fafc;border-right:1px solid var(--border);overflow-y:auto;padding:16px;}
  .fd-right{flex:1;background:#e2e8f0;overflow:auto;display:flex;justify-content:center;}
  .fd-right iframe{width:100%;max-width:1000px;height:100%;border:none;background:#fff;}
  .fd-sec{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#64748b;margin:16px 0 8px;}
  .fd-row{display:block;margin-bottom:10px;}
  .fd-row label{display:block;font-size:11px;font-weight:700;color:#475569;margin-bottom:3px;}
  .fd-row input[type=text],.fd-row input[type=color],.fd-row select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;}
  .fd-row input[type=color]{height:38px;padding:3px;cursor:pointer;}
  .fd-2{display:flex;gap:8px;}.fd-2>div{flex:1;}
  .fd-fld{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;}
  .fd-fld.dragging{opacity:.4;}
  .fd-fld-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .fd-fld-head .grip{cursor:grab;color:#cbd5e1;}
  .fd-fld-head .nm{font-weight:800;font-size:13px;flex:1;}
  .fd-fld-head .k{font-size:10px;color:#94a3b8;font-family:ui-monospace,monospace;}
  .fd-toggle{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#475569;cursor:pointer;}
  .fd-fld .fd-inputs{display:none;}
  .fd-fld.open .fd-inputs{display:block;}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sb-head"><div class="sb-brand"><span class="material-icons">point_of_sale</span> POS Express</div><div class="sb-sub">Sub-Account</div></div>
  <div style="margin:12px 14px 4px;">
    <select onchange="if(this.value)location.href=this.value" style="width:100%;background:rgba(255,255,255,0.14);color:#fff;border:1px solid rgba(255,255,255,0.25);border-radius:9px;padding:9px 10px;font-size:12px;font-weight:800;font-family:inherit;cursor:pointer;">
      <option value="/pos-express" selected style="color:#1e293b;background:#fff;">🧾 POS Express</option>
      <option value="/" style="color:#1e293b;background:#fff;">🏢 PayProTec Portal</option>
    </select>
  </div>
  <nav class="nav" id="nav"></nav>
</div>
<div class="main">
  <div class="topbar"><h1 id="secTitle">Dashboard</h1>
    <div class="bell" onclick="toggleBell(event)"><span class="material-icons">notifications</span><span class="bell-badge" id="bellBadge" style="display:none;">0</span></div>
    <button class="btn btn-n" onclick="load()">Refresh</button>
  </div>
  <div class="bell-panel" id="bellPanel"><h4><span class="material-icons" style="font-size:18px;color:var(--orange);">notifications</span> Notifications</h4><div id="bellList"></div></div>
  <div class="content" id="content"><div class="empty">Loading…</div></div>
</div>
<script>
var TOKEN=localStorage.getItem('pp_session_token')||'';
var LEADS=[], SEC='dashboard', PFILTER='', PIPES=[], CURPIPE='';
var NAV=[['dashboard','Dashboard','space_dashboard'],['opps','Opportunities','trending_up'],['merchants','Merchants','storefront'],['partners','Partners','handshake'],['settings','Settings','settings']];
var OPPVIEW='board', OPPQ='', OPPSORT='recent', OPPMIN=null, OPPMAX=null;
function api(b){ return fetch('/api/pos',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify(b)}).then(function(r){return r.json();}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);}); }
function money(n){ return n?('$'+Number(n).toLocaleString()):'—'; }
function dt(s){ try{ return new Date(s).toLocaleDateString(); }catch(e){ return ''; } }
var STP={new:'#0369a1',reviewing:'#b45309',qualified:'#16a34a',rejected:'#94a3b8',sent:'#7c3aed'};
function stPill(s){ return '<span class="pill" style="background:'+(STP[s]||'#64748b')+';color:#fff;">'+esc(s)+'</span>'; }

function renderNav(){ document.getElementById('nav').innerHTML=NAV.map(function(n){return '<button class="'+(SEC===n[0]?'on':'')+'" onclick="go(\''+n[0]+'\')"><span class="material-icons">'+n[2]+'</span> '+n[1]+'</button>';}).join(''); }
function go(s){ SEC=s; renderNav(); document.getElementById('secTitle').textContent=(NAV.find(function(n){return n[0]===s;})||[])[1]||''; render(); }

async function load(){
  var r=await api({action:'list'});
  if(!r.success){
    var denied=/access denied/i.test(r.message||'');
    document.getElementById('content').innerHTML='<div class="empty" style="color:'+(denied?'#9a3412':'var(--red)')+';padding:60px 20px;">'+(denied?'🔒 You don\'t have access to POS Express.<br><span style="font-size:12px;">Ask an admin to enable it for your account (User Management → POS Express).</span>':esc(r.message||'Failed to load'))+'</div>';
    return;
  }
  LEADS=r.leads||[];
  var pr=await api({action:'pipelines_get'});
  PIPES=(pr&&pr.success&&pr.pipelines)||[];
  if(!CURPIPE || !PIPES.some(function(p){return p.id===CURPIPE;})) CURPIPE=(PIPES[0]&&PIPES[0].id)||'';
  render();
}
function render(){
  var c=document.getElementById('content');
  c.style.maxWidth=(SEC==='opps'&&OPPVIEW==='board')?'none':'1160px';
  if(SEC==='dashboard') c.innerHTML=dashboard();
  else if(SEC==='opps'){ c.innerHTML=oppsView(); renderOppBody(); }
  else if(SEC==='merchants') c.innerHTML=merchantsView();
  else if(SEC==='partners') c.innerHTML=partnersView();
  else if(SEC==='settings'){ c.innerHTML=settingsView(); loadSettings(); }
}
function counts(){
  var c={total:LEADS.length,new:0,reviewing:0,qualified:0,rejected:0,sent:0,public:0,portal:0,week:0};
  var wk=Date.now()-7*864e5;
  LEADS.forEach(function(l){ if(c[l.status]!=null)c[l.status]++; if(l.source==='public')c.public++;else c.portal++; if(new Date(l.created_at).getTime()>=wk)c.week++; });
  return c;
}
function dashboard(){
  var c=counts();
  var recent=LEADS.slice(0,8).map(function(l){return '<tr class="click" onclick="openLead(\''+l.id+'\')"><td><b>'+esc(l.business_name||'—')+'</b></td><td>'+esc(l.partner_name||'—')+'</td><td>'+esc(l.source)+'</td><td>'+stPill(l.status)+'</td><td class="muted">'+dt(l.created_at)+'</td></tr>';}).join('')||'<tr><td colspan="5" class="empty">No submissions yet.</td></tr>';
  return '<div class="stats">'+
    '<div class="stat"><div class="n">'+c.total+'</div><div class="l">Submissions</div></div>'+
    '<div class="stat"><div class="n" style="color:#0369a1;">'+c.new+'</div><div class="l">New</div></div>'+
    '<div class="stat"><div class="n" style="color:#b45309;">'+c.reviewing+'</div><div class="l">Reviewing</div></div>'+
    '<div class="stat"><div class="n" style="color:#16a34a;">'+c.qualified+'</div><div class="l">Qualified</div></div>'+
    '<div class="stat"><div class="n" style="color:#7c3aed;">'+c.sent+'</div><div class="l">Sent (Opps)</div></div>'+
    '<div class="stat"><div class="n" style="color:#ea580c;">'+c.week+'</div><div class="l">This week</div></div>'+
    '</div>'+
    '<div class="card"><h3>By source</h3><div style="padding:14px 18px;font-size:13px;">Public form: <b>'+c.public+'</b> &nbsp;·&nbsp; Partner portal: <b>'+c.portal+'</b></div></div>'+
    '<div class="card"><h3>Recent submissions</h3><table><thead><tr><th>Business</th><th>Partner</th><th>Source</th><th>Status</th><th>Date</th></tr></thead><tbody>'+recent+'</tbody></table></div>';
}
function oppsView(){
  var controls='<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;">'
    +'<div style="position:relative;flex:1;min-width:220px;">'
    +'<span class="material-icons" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:18px;">search</span>'
    +'<input id="oppSearch" value="'+esc(OPPQ)+'" onkeydown="if(event.key===\'Enter\')applyOppSearch()" placeholder="MID, opportunity, business, partner ID or name…" style="width:100%;padding:9px 12px 9px 36px;border:1px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;"></div>'
    +'<input id="oppMin" value="'+(OPPMIN==null?'':OPPMIN)+'" type="number" inputmode="numeric" onkeydown="if(event.key===\'Enter\')applyOppSearch()" placeholder="Min volume $" style="width:130px;padding:9px 12px;border:1px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;">'
    +'<input id="oppMax" value="'+(OPPMAX==null?'':OPPMAX)+'" type="number" inputmode="numeric" onkeydown="if(event.key===\'Enter\')applyOppSearch()" placeholder="Max volume $" style="width:130px;padding:9px 12px;border:1px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;">'
    +'<select onchange="setOppSort(this.value)" style="padding:9px 12px;border:1px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;">'
    +'<option value="recent"'+(OPPSORT==='recent'?' selected':'')+'>Sort: Newest</option>'
    +'<option value="vol"'+(OPPSORT==='vol'?' selected':'')+'>Sort: Monthly volume (high → low)</option></select>'
    +'<button class="btn btn-o" onclick="applyOppSearch()"><span class="material-icons" style="font-size:16px;vertical-align:-3px;">search</span> Search</button>'
    +'<button class="btn btn-n" onclick="clearOppSearch()">Clear</button></div>';
  var toggle='<div class="tabs" style="margin-bottom:14px;">'
    +'<button class="tab '+(OPPVIEW==='board'?'on':'')+'" onclick="setOppView(\'board\')"><span class="material-icons" style="font-size:15px;vertical-align:-3px;">view_kanban</span> Board</button>'
    +'<button class="tab '+(OPPVIEW==='list'?'on':'')+'" onclick="setOppView(\'list\')"><span class="material-icons" style="font-size:15px;vertical-align:-3px;">view_list</span> List</button></div>';
  return controls+'<div id="oppSummary" style="margin-bottom:12px;font-size:13px;color:#475569;"></div>'+toggle+'<div id="oppBody"></div>';
}
function renderOppBody(){
  var fl=getOppLeads();
  var sum=document.getElementById('oppSummary');
  var active=(OPPQ||OPPMIN!=null||OPPMAX!=null);
  if(sum) sum.innerHTML=active?('<b style="color:#0f172a;">'+fl.length+'</b> opportunit'+(fl.length===1?'y':'ies')+' matched'+((OPPMIN!=null||OPPMAX!=null)?' · volume '+(OPPMIN!=null?money(OPPMIN):'$0')+' – '+(OPPMAX!=null?money(OPPMAX):'∞'):'')):'';
  var el=document.getElementById('oppBody'); if(el) el.innerHTML=(OPPVIEW==='board'?kanbanHtml():oppsListHtml());
}
function getOppLeads(){
  var q=(OPPQ||'').trim().toLowerCase();
  var arr=LEADS.filter(function(l){
    var vol=Number(l.monthly_volume)||0;
    if(OPPMIN!=null && vol<OPPMIN) return false;
    if(OPPMAX!=null && vol>OPPMAX) return false;
    if(!q) return true;
    return [l.business_name,l.merchant_legal_name,l.mid,l.agent_id,l.partner_name].some(function(v){ return v&&String(v).toLowerCase().indexOf(q)!==-1; });
  });
  if(OPPSORT==='vol') arr=arr.slice().sort(function(a,b){ return (Number(b.monthly_volume)||0)-(Number(a.monthly_volume)||0); });
  return arr;
}
function setOppView(v){ OPPVIEW=v; render(); }
window.applyOppSearch=function(){
  OPPQ=(document.getElementById('oppSearch')||{}).value||'';
  var mn=(document.getElementById('oppMin')||{}).value; var mx=(document.getElementById('oppMax')||{}).value;
  OPPMIN=(mn===''||mn==null)?null:Number(mn); OPPMAX=(mx===''||mx==null)?null:Number(mx);
  if(OPPMIN!=null&&isNaN(OPPMIN))OPPMIN=null; if(OPPMAX!=null&&isNaN(OPPMAX))OPPMAX=null;
  renderOppBody();
};
window.clearOppSearch=function(){ OPPQ=''; OPPMIN=null; OPPMAX=null; render(); };
function setOppSort(v){ OPPSORT=v; renderOppBody(); }
function oppsListHtml(){
  var tabs=[['','All'],['new','New'],['reviewing','Reviewing'],['qualified','Qualified'],['rejected','Rejected'],['sent','Sent']];
  var base=getOppLeads();
  var list=PFILTER?base.filter(function(l){return l.status===PFILTER;}):base;
  var rows=list.map(function(l){return '<tr class="click" onclick="openLead(\''+l.id+'\')"><td><b>'+esc(l.business_name||'—')+'</b><div class="muted" style="font-size:11px;">'+esc(l.contact_name||'')+'</div></td><td>'+esc(l.partner_name||'—')+' <span class="muted" style="font-size:11px;">'+esc(l.agent_id||'')+'</span></td><td>'+money(l.monthly_volume)+'</td><td>'+esc(l.source)+'</td><td>'+stPill(l.status)+'</td></tr>';}).join('')||'<tr><td colspan="5" class="empty">No leads.</td></tr>';
  return '<div class="tabs">'+tabs.map(function(t){return '<button class="tab '+(PFILTER===t[0]?'on':'')+'" onclick="setPF(\''+t[0]+'\')">'+t[1]+'</button>';}).join('')+'</div>'
    +'<div class="card"><table><thead><tr><th>Business</th><th>Partner</th><th>Volume</th><th>Source</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function merchantsView(){

var _fdDrag=null;
function fdDragBind(el,host){
  el.addEventListener('dragstart',function(){ _fdDrag=el; el.classList.add('dragging'); });
  el.addEventListener('dragend',function(){ el.classList.remove('dragging'); _fdDrag=null; fdCommitOrder(host); });
  el.addEventListener('dragover',function(e){ e.preventDefault(); if(!_fdDrag||_fdDrag===el||_fdDrag.parentNode!==host) return;
    var r=el.getBoundingClientRect(); var after=(e.clientY-r.top)>r.height/2;
    host.insertBefore(_fdDrag, after?el.nextSibling:el);
  });
}

}

var AUTO_SOURCES=[['business_name','Merchant DBA'],['merchant_legal_name','Legal name'],['full_contact_name','Contact full name'],['merchant_first_name','Contact first name'],['merchant_last_name','Contact last name'],['email','Merchant email'],['phone','Merchant phone'],['street_address','Street address'],['city','City'],['state','State'],['zip','Zip'],['business_type','Business type'],['monthly_volume','Monthly volume'],['proposal_type','Proposal type'],['mid','MID'],['notes','Notes'],['agent_id','Agent ID'],['partner_name','Partner name'],['partner_phone','Partner phone'],['partner_email','Partner email'],['source','Source'],['status','Status']];
function autoUid(){ return 'wf'+(AUTO.portal.length+AUTO.highlevel.length)+'_'+(Math.floor((window.performance&&performance.now?performance.now():1)*1000)); }
function optList(arr,sel){ return arr.map(function(o){var v=o[0],l=o[1];return '<option value="'+esc(v)+'"'+(sel===v?' selected':'')+'>'+esc(l)+'</option>';}).join(''); }
function pipeOptions(sel){ var ps=(window._pos&&window._pos.pipelines)||[]; return '<option value="all"'+(sel==='all'||!sel?' selected':'')+'>All pipelines</option>'+ps.map(function(p){return '<option value="'+p.id+'"'+(sel===p.id?' selected':'')+'>'+esc(p.name)+'</option>';}).join(''); }
function stageOptions(sel){ var ps=(window._pos&&window._pos.pipelines)||[]; var h='<option value="">— pick a stage —</option>'; ps.forEach(function(p){ (p.stages||[]).forEach(function(s){ h+='<option value="'+s.id+'"'+(sel===s.id?' selected':'')+'>'+esc(p.name)+' → '+esc(s.name)+'</option>'; }); }); return h; }
function staffOptions(sel){ var st=(window._pos&&window._pos.staff)||[]; return '<option value="">— pick staff —</option>'+st.map(function(u){return '<option value="'+esc(u.userid)+'"'+(sel===u.userid?' selected':'')+'>'+esc(u.name)+'</option>';}).join(''); }
var ASEL='padding:7px 9px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;font-family:inherit;';
function renderAutomations(){
  var pe=document.getElementById('autoPortal'); if(pe) pe.innerHTML=AUTO.portal.map(function(w,i){return wfCard('portal',w,i);}).join('')||'<div class="muted" style="font-size:12px;">No automations yet.</div>';
}
function wfHeader(fam,w,i){
  var trig=(w.trigger&&w.trigger.type)||'lead_submitted';
  var stageSel=(trig==='stage_entered')?'<div style="margin-top:8px;"><label style="font-size:11px;font-weight:700;color:#475569;">Stage</label><br><select style="'+ASEL+'width:100%;" onchange="autoTrigger(\''+fam+'\','+i+',\'stage_id\',this.value)">'+stageOptions(w.trigger&&w.trigger.stage_id)+'</select></div>':'';
  return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">'
    +'<input type="text" value="'+esc(w.name||'')+'" placeholder="Automation name" style="'+ASEL+'flex:1;font-weight:700;" oninput="autoField(\''+fam+'\','+i+',\'name\',this.value)">'
    +'<label class="fd-toggle" style="font-size:12px;"><input type="checkbox" '+(w.enabled!==false?'checked':'')+' onchange="autoField(\''+fam+'\','+i+',\'enabled\',this.checked)"> on</label>'
    +'<span class="material-icons" style="color:var(--red);cursor:pointer;" title="Delete" onclick="autoDelWf(\''+fam+'\','+i+')">delete</span></div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;">'
    +'<div style="flex:1;min-width:180px;"><label style="font-size:11px;font-weight:700;color:#475569;">Trigger</label><br><select style="'+ASEL+'width:100%;" onchange="autoTrigger(\''+fam+'\','+i+',\'type\',this.value)">'+optList(AUTO_TRIGGERS,trig)+'</select></div>'
    +'<div style="flex:1;min-width:180px;"><label style="font-size:11px;font-weight:700;color:#475569;">Applies to</label><br><select style="'+ASEL+'width:100%;" onchange="autoField(\''+fam+'\','+i+',\'pipeline_id\',this.value)">'+pipeOptions(w.pipeline_id)+'</select></div>'
    +'</div>'+stageSel;
}
function wfCard(fam,w,i){
  return '<div class="pipe" style="border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px;background:#fffdf9;">'+wfHeader(fam,w,i)+'<div style="border-top:1px dashed var(--border);margin:12px 0 10px;"></div>'+portalBody(w,i)+'</div>';
}
var GHL_STD=[['firstName','First Name'],['lastName','Last Name'],['name','Full Name'],['email','Email'],['phone','Phone'],['companyName','Company Name'],['address1','Address'],['city','City'],['state','State'],['postalCode','Postal Code'],['country','Country'],['website','Website'],['source','Source']];
function workflowOptions(sel){
  var meta=window._ghlMeta||{}; var ws=meta.workflows||[];
  if(!ws.length){
    var lbl=(!meta._loaded)?'Loading workflows…':(meta.configured===false?'⚠ Add PIT + Location in Connection first':(meta.wf_error?'⚠ Could not load workflows':'No workflows found in this sub-account'));
    return '<option value="'+esc(sel||'')+'">'+lbl+'</option>';
  }
  return '<option value="">— pick a workflow —</option>'+ws.map(function(w){return '<option value="'+esc(w.id)+'"'+(sel===w.id?' selected':'')+'>'+esc(w.name)+(w.status&&w.status!=='published'?' ('+esc(w.status)+')':'')+'</option>';}).join('');
}
function ghlDiag(){
  var meta=window._ghlMeta||{}; if(!meta._loaded||!meta.wf_error) return '';
  return '<div style="background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:8px;padding:8px 10px;font-size:11.5px;margin-top:6px;">HighLevel workflows error: '+esc(meta.wf_error)+'<br><span style="font-weight:600;">Check the Private Integration token has the <b>workflows.readonly</b> scope and the Location ID matches the token\'s sub-account.</span></div>';
}
function targetOptions(sel){
  var meta=window._ghlMeta||{}; var cf=meta.custom_fields||[];
  var h='<option value="">— HighLevel field —</option>';
  h+='<optgroup label="Standard fields">'+GHL_STD.map(function(o){return '<option value="'+o[0]+'"'+(sel===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</optgroup>';
  if(cf.length) h+='<optgroup label="Custom fields">'+cf.map(function(f){var v='cf:'+f.id;return '<option value="'+esc(v)+'"'+(sel===v?' selected':'')+'>'+esc(f.name)+'</option>';}).join('')+'</optgroup>';
  return h;
}
function hlActionBlock(a,i,j){
  var maps=(a.mapping||[]).map(function(m,k){
    return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">'
      +'<select style="'+ASEL+'flex:1;" onchange="autoActMap('+i+','+j+','+k+',\'source\',this.value)"><option value="">— portal field —</option>'+optList(AUTO_SOURCES,m.source)+'</select>'
      +'<span class="material-icons" style="color:#cbd5e1;font-size:16px;">arrow_forward</span>'
      +'<select style="'+ASEL+'flex:1;" onchange="autoActMap('+i+','+j+','+k+',\'target\',this.value)">'+targetOptions(m.target)+'</select>'
      +'<span class="material-icons" style="color:#94a3b8;cursor:pointer;font-size:18px;" onclick="autoActDelMap('+i+','+j+','+k+')">close</span></div>';
  }).join('')||'<div class="muted" style="font-size:12px;margin-bottom:6px;">No fields mapped — add a mapping.</div>';
  return '<div style="background:#f8fafc;border:1px solid var(--border);border-radius:9px;padding:10px;margin-top:6px;">'
    +'<div class="fd-row"><label style="font-size:11px;font-weight:700;color:#475569;">HighLevel workflow</label>'
    +'<select style="'+ASEL+'width:100%;" onchange="autoActWf('+i+','+j+',this)">'+workflowOptions(a.workflow_id)+'</select>'+ghlDiag()+'</div>'
    +'<div style="font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;margin:10px 0 6px;">Map what to send — portal field → HighLevel field / custom field</div>'+maps
    +'<button class="btn btn-n" style="padding:5px 11px;margin-top:4px;" onclick="autoActAddMap('+i+','+j+')">+ Map field</button></div>';
}
function portalBody(w,i){
  var acts=(w.actions||[]).map(function(a,j){
    var t=a.type||'set_status'; var param='';
    if(t==='set_status') param='<select style="'+ASEL+'" onchange="autoActField('+i+','+j+',\'value\',this.value)"><option value="">— status —</option>'+AUTO_STATUSES.map(function(s){return '<option'+(a.value===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select>';
    else if(t==='set_classification') param='<select style="'+ASEL+'" onchange="autoActField('+i+','+j+',\'value\',this.value)"><option value="">— class —</option><option value="good"'+(a.value==='good'?' selected':'')+'>good</option><option value="bad"'+(a.value==='bad'?' selected':'')+'>bad</option></select>';
    else if(t==='move_stage') param='<select style="'+ASEL+'min-width:200px;" onchange="autoActField('+i+','+j+',\'stage_id\',this.value)">'+stageOptions(a.stage_id)+'</select>';
    else if(t==='assign_to') param='<select style="'+ASEL+'min-width:170px;" onchange="autoActField('+i+','+j+',\'value\',this.value)">'+staffOptions(a.value)+'</select>';
    else if(t==='add_note') param='<input type="text" placeholder="Note text" value="'+esc(a.value||'')+'" style="'+ASEL+'flex:1;min-width:180px;" oninput="autoActField('+i+','+j+',\'value\',this.value)">';
    var row='<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">'
      +'<select style="'+ASEL+'min-width:200px;" onchange="autoActField('+i+','+j+',\'type\',this.value)">'+optList(AUTO_PORTAL_ACTIONS,t)+'</select>'
      +param+'<span class="material-icons" style="color:#94a3b8;cursor:pointer;font-size:18px;" onclick="autoDelAction('+i+','+j+')">close</span></div>';
    if(t==='send_to_highlevel') row+=hlActionBlock(a,i,j);
    return '<div style="margin-bottom:10px;">'+row+'</div>';
  }).join('')||'<div class="muted" style="font-size:12px;margin-bottom:6px;">No actions — add one.</div>';
  return '<div style="font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;margin-bottom:6px;">Actions</div>'+acts
    +'<button class="btn btn-n" style="padding:5px 11px;margin-top:4px;" onclick="autoAddAction('+i+')">+ Action</button>';
}
window.autoField=function(fam,i,k,v){ if(AUTO[fam][i]) AUTO[fam][i][k]=v; };
window.autoTrigger=function(fam,i,k,v){ var w=AUTO[fam][i]; if(!w) return; w.trigger=w.trigger||{}; w.trigger[k]=v; if(k==='type') renderAutomations(); };
window.autoAddWf=function(fam){ AUTO[fam].push({id:autoUid(),name:'',enabled:true,pipeline_id:'all',trigger:{type:'lead_submitted'},actions:[]}); renderAutomations(); };
window.autoDelWf=function(fam,i){ AUTO[fam].splice(i,1); renderAutomations(); };
window.autoAddAction=function(i){ var w=AUTO.portal[i]; w.actions=w.actions||[]; w.actions.push({type:'set_status',value:''}); renderAutomations(); };
window.autoDelAction=function(i,j){ AUTO.portal[i].actions.splice(j,1); renderAutomations(); };
window.autoActField=function(i,j,k,v){ var a=AUTO.portal[i].actions[j]; if(!a) return; a[k]=v; if(k==='type'){ if(v==='send_to_highlevel'){ a.mapping=a.mapping||[]; } renderAutomations(); } };
window.autoActWf=function(i,j,selEl){ var a=AUTO.portal[i].actions[j]; if(!a) return; a.workflow_id=selEl.value; a.workflow_name=(selEl.options[selEl.selectedIndex]||{}).text||''; };
window.autoActAddMap=function(i,j){ var a=AUTO.portal[i].actions[j]; a.mapping=a.mapping||[]; a.mapping.push({source:'',target:''}); renderAutomations(); };
window.autoActDelMap=function(i,j,k){ AUTO.portal[i].actions[j].mapping.splice(k,1); renderAutomations(); };
window.autoActMap=function(i,j,k,key,v){ var m=AUTO.portal[i].actions[j].mapping[k]; if(m) m[key]=v; };
window.saveAutomations=async function(btn){
  btn.disabled=true; var t=btn.textContent; btn.textContent='Saving…';
  var payload={portal:AUTO.portal,highlevel:[]};
  var r=await api({action:'automations_set',automations:payload});
  btn.disabled=false; btn.textContent=t;
  if(r&&r.success){ if(window._pos) window._pos.automations={portal:AUTO.portal.slice(),highlevel:[]}; Swal.fire({icon:'success',title:'Automations saved',timer:1100,showConfirmButton:false}); }
  else Swal.fire('Error',(r&&r.message)||'Could not save','error');
};
function pipelineEditor(p){
  var vis=(p.partner_visible!==false);
  return '<div class="pipe" data-pid="'+p.id+'" style="border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:14px;background:#fffdf9;">'
    +'<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">'
    +'<input class="pipe-name" value="'+esc(p.name)+'" style="font-weight:700;flex:1;'+IN+'">'
    +'<button class="btn btn-o" onclick="savePipeline(this)">Save</button>'
    +'<span class="material-icons" style="color:var(--red);cursor:pointer;" title="Delete pipeline" onclick="delPipeline(this)">delete</span></div>'
    +'<label class="fd-toggle" style="font-size:12px;margin-bottom:10px;color:#334155;font-weight:700;"><input type="checkbox" class="pipe-vis" '+(vis?'checked':'')+' onchange="togglePipeVisible(this)"> <span class="material-icons" style="font-size:15px;vertical-align:-3px;color:#16a34a;">visibility</span> Visible to partners (shows this pipeline’s stages on the partner portal)</label>'
    +'<div class="stages">'+((p.stages||[]).map(stageRow).join(''))+'</div>'
    +'<button class="btn btn-n" style="margin-top:6px;padding:5px 11px;" onclick="addStage(this)">+ Stage</button></div>';
}
window.togglePipeVisible=async function(cb){
  var pipe=cb.closest('.pipe'); var pid=pipe.getAttribute('data-pid'); var name=pipe.querySelector('.pipe-name').value.trim()||'Pipeline';
  var r=await api({action:'save_pipeline',id:pid,name:name,partner_visible:cb.checked});
  if(r&&r.success){ Swal.fire({icon:'success',title:cb.checked?'Visible to partners':'Hidden from partners',timer:900,showConfirmButton:false}); if(window._pos&&window._pos.pipelines){ var pp=window._pos.pipelines.find(function(x){return x.id===pid;}); if(pp) pp.partner_visible=cb.checked; } }
  else { cb.checked=!cb.checked; Swal.fire('Error',(r&&r.message)||'Could not save','error'); }
};
function stageRow(s){
  return '<div class="stage" data-sid="'+(s&&s.id?s.id:'')+'" style="display:flex;gap:8px;margin-bottom:6px;align-items:center;">'
    +'<span class="material-icons" style="color:#cbd5e1;font-size:18px;cursor:grab;">drag_indicator</span>'
    +'<input class="st-name" placeholder="Stage name" value="'+esc(s?s.name:'')+'" style="flex:0 0 32%;'+IN+'">'
    +'<input class="st-wf" placeholder="Workflow trigger URL (optional)" value="'+esc(s&&s.workflow_url?s.workflow_url:'')+'" style="flex:1;'+IN+'font-size:12px;">'
    +'<span class="material-icons" style="color:#94a3b8;cursor:pointer;" title="Remove stage" onclick="this.closest(\'.stage\').remove()">close</span></div>';
}
window.addStage=function(btn){ btn.closest('.pipe').querySelector('.stages').insertAdjacentHTML('beforeend', stageRow(null)); };
window.addPipeline=async function(){ var n=await Swal.fire({title:'New pipeline',input:'text',inputPlaceholder:'Pipeline name',showCancelButton:true,confirmButtonColor:'#ea580c'}); if(!n.isConfirmed||!n.value) return; var r=await api({action:'save_pipeline',name:n.value}); if(r.success) loadSettings(); };
window.delPipeline=async function(btn){ var pid=btn.closest('.pipe').getAttribute('data-pid'); var c=await Swal.fire({icon:'warning',title:'Delete pipeline?',text:'Its stages will be removed.',showCancelButton:true,confirmButtonColor:'#dc2626'}); if(!c.isConfirmed) return; await api({action:'delete_pipeline',id:pid}); loadSettings(); };
window.savePipeline=async function(btn){
  var pipe=btn.closest('.pipe'); var pid=pipe.getAttribute('data-pid'); var name=pipe.querySelector('.pipe-name').value.trim();
  var visCb=pipe.querySelector('.pipe-vis');
  if(name) await api({action:'save_pipeline',id:pid,name:name,partner_visible:visCb?visCb.checked:true});
  var stages=Array.prototype.map.call(pipe.querySelectorAll('.stage'),function(row){ return { id:row.getAttribute('data-sid')||undefined, name:row.querySelector('.st-name').value.trim(), workflow_url:row.querySelector('.st-wf').value.trim() }; }).filter(function(s){return s.name;});
  var r=await api({action:'save_stages',pipeline_id:pid,stages:stages});
  if(r.success){ Swal.fire({icon:'success',title:'Saved',timer:900,showConfirmButton:false}); loadSettings(); } else Swal.fire('Error',r.message||'','error');
};
window.saveConn=async function(btn){
  var m=document.getElementById('connmsg'); btn.disabled=true; m.style.color='#64748b'; m.textContent='Saving…';
  var typed=document.getElementById('pit').value.trim();
  var r=await api({action:'set_pos_key',key:typed,location_id:document.getElementById('loc').value.trim(),webhook_url:document.getElementById('wh').value.trim()});
  btn.disabled=false;
  if(r&&r.success){
    m.style.color='#16a34a';
    m.textContent='Saved ✓ — key '+(r.key_set?(r.key_masked+' · '+r.key_len+' chars'):'not set')+(typed?(r.key_saved?' (new token stored)':' (⚠ token NOT stored)'):' (kept existing)');
    // refresh stored view + reload workflows with the new token
    if(window._pos){ window._pos.key_set=r.key_set; window._pos.key_masked=r.key_masked; window._pos.key_len=r.key_len; }
    window._ghlMeta=null; loadSettings();
  } else { m.style.color='#dc2626'; m.textContent=(r&&r.message)||'Failed'; }
};
window.testConn=async function(btn){
  var m=document.getElementById('connmsg'); btn.disabled=true; m.style.color='#64748b'; m.textContent='Testing HighLevel…';
  var r=await api({action:'ghl_meta'});
  btn.disabled=false;
  if(r&&r.success&&!r.wf_error){ m.style.color='#16a34a'; m.textContent='✓ Connected — '+((r.workflows||[]).length)+' workflows, '+((r.custom_fields||[]).length)+' custom fields'; window._ghlMeta=r; window._ghlMeta._loaded=true; }
  else { m.style.color='#dc2626'; m.textContent='✗ '+((r&&(r.wf_error||r.message))||'Failed')+(r&&r.configured===false?' (set key + location first)':''); }
};

async function openLead(id){
  var l=LEADS.find(function(x){return x.id===id;}); if(!l) return;
  var addr=[l.street_address,(l.city||'')+(l.state?', '+l.state:''),l.zip].filter(Boolean).join(', ');
  var info=[['Partner',(l.partner_name||'—')+' ('+(l.agent_id||'no agent id')+')'],['Partner phone',l.partner_phone],['Partner email',l.partner_email],
    ['Current merchant?',l.is_current_merchant?('Yes'+(l.mid?' · MID '+l.mid:'')):'No'],
    ['Business (DBA)',l.business_name],['Legal name',l.merchant_legal_name],['Business type',l.business_type],
    ['Address',addr],['Merchant contact',[l.merchant_first_name,l.merchant_last_name].filter(Boolean).join(' ')||l.contact_name],['Merchant phone',l.phone],['Merchant email',l.email],
    ['Monthly volume',money(l.monthly_volume)],['Proposal type',l.proposal_type],['SMS updates',l.sms_opt_in?'Yes':'No'],['Notes',l.notes]]
    .filter(function(x){return x[1];}).map(function(x){return '<div style="display:flex;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px solid #f1f5f9;"><span style="width:140px;color:#94a3b8;font-weight:700;flex:none;">'+x[0]+'</span><span>'+esc(x[1])+'</span></div>';}).join('');
  if(l.statement_url) info+='<div style="padding:8px 0;"><a href="'+esc(l.statement_url)+'" target="_blank" style="color:#ea580c;font-weight:700;font-size:13px;">📄 View processing statement</a></div>';
  var canSend=l.status!=='sent';
  var res=await Swal.fire({title:esc(l.business_name||'Lead'),width:640,
    html:'<div style="text-align:left;">'+(l.agent_valid?'':'<div style="background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:10px;">⚠️ Agent ID “'+esc(l.agent_id||'')+'” did not match a partner. Verify before sending.</div>')+info+
      '<label style="display:block;font-size:12px;font-weight:700;margin:12px 0 4px;">Classification</label><select id="pl-class" class="swal2-input" style="margin:0;width:100%;"><option value="">— unclassified —</option><option value="good"'+(l.classification==='good'?' selected':'')+'>Good lead</option><option value="bad"'+(l.classification==='bad'?' selected':'')+'>Bad lead</option></select>'+
      '<label style="display:block;font-size:12px;font-weight:700;margin:12px 0 4px;">Status</label><select id="pl-status" class="swal2-input" style="margin:0;width:100%;">'+['new','reviewing','qualified','rejected','sent'].map(function(s){return '<option value="'+s+'"'+(l.status===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select>'+
      '<label style="display:block;font-size:12px;font-weight:700;margin:12px 0 4px;">Review notes <span style="color:#94a3b8;font-weight:600;">(internal — not shown to partner)</span></label><textarea id="pl-notes" class="swal2-textarea" style="margin:0;width:100%;">'+esc(l.review_notes||'')+'</textarea>'+
      '<div style="margin-top:16px;border-top:1px solid #e2e8f0;padding-top:12px;">'+
        '<label style="display:block;font-size:12px;font-weight:700;margin:0 0 4px;">Conversation with partner</label>'+
        '<div style="font-size:12px;color:#0f766e;background:#f0fdfa;border:1px solid #99f6e4;border-radius:8px;padding:7px 10px;margin-bottom:10px;">💬 Shared with the partner — they can see and reply here.</div>'+
        '<div id="posNotesList" style="font-size:13px;color:#94a3b8;">Loading…</div>'+
        '<div style="position:relative;"><textarea id="posNoteInput" class="swal2-textarea" style="margin:8px 0 0;width:100%;" placeholder="Message the partner… type @ to tag"></textarea><div class="tag-sug" id="posTagSug"></div></div>'+
        '<div style="font-size:11px;color:#94a3b8;margin:6px 0 8px;">Type <b>@</b> to tag a teammate or the partner — they’ll be notified.</div>'+
        '<button id="posNoteAdd" class="btn btn-n" style="padding:8px 14px;"><span class="material-icons" style="font-size:16px;vertical-align:-3px;">send</span> Add note</button>'+
      '</div></div>',
    showCancelButton:true,confirmButtonText:'Save',confirmButtonColor:'#ea580c',
    footer:'<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">'
      +(canSend?'<button id="pl-send" class="btn btn-o" style="background:#7c3aed;">✅ Mark good &amp; send to POS Express</button>':'<span style="color:#7c3aed;font-weight:700;">Already sent to POS Express</span>')
      +(CAN_SETTINGS?'<button id="pl-test" class="btn btn-n">🧪 Test send to HighLevel</button>':'')+'</div>',
    didOpen:function(){
      var sb=document.getElementById('pl-send'); if(sb) sb.addEventListener('click',async function(){ sb.disabled=true; sb.textContent='Sending…'; var s=await api({action:'send_to_ghl',id:l.id}); if(s.success){ Swal.close(); Swal.fire({icon:'success',title:'Sent to POS Express',timer:1300,showConfirmButton:false}); load(); } else { Swal.showValidationMessage(s.message||'Send failed'); sb.disabled=false; sb.textContent='✅ Mark good & send to POS Express'; } });
      var tb=document.getElementById('pl-test'); if(tb) tb.addEventListener('click',function(){ testHlSend(l.id); });
      _staffMentions.length=0; loadStaffNotes(l.id); loadStaffTaggable(l.id);
      setupMention('posNoteInput','posTagSug',function(){return _staffTaggable;},_staffMentions);
      var na=document.getElementById('posNoteAdd'); if(na) na.addEventListener('click',function(){ addStaffNote(l.id); });
    },
    preConfirm:function(){ return {classification:document.getElementById('pl-class').value,status:document.getElementById('pl-status').value,review_notes:document.getElementById('pl-notes').value}; }
  });
  if(res.isConfirmed&&res.value){ await api({action:'update',id:l.id,classification:res.value.classification||null,status:res.value.status,review_notes:res.value.review_notes}); load(); }
}
/* ── Staff shared notes + @-mention tagging ── */
var _staffTaggable=[], _staffMentions=[];
async function loadStaffTaggable(id){ var r=await api({action:'pos_taggable',lead_id:id}); _staffTaggable=(r&&r.success&&r.people)||[]; }
// Reusable @-mention typeahead: type "@" then a name to pick who to tag.
function setupMention(taId,sugId,getPeople,mentions){
  var ta=document.getElementById(taId), sug=document.getElementById(sugId); if(!ta||!sug) return;
  function hide(){ sug.style.display='none'; }
  ta.addEventListener('input',function(){
    var pos=ta.selectionStart, before=ta.value.slice(0,pos);
    var m=before.match(/(^|\s)@([^@\n]*)$/);
    if(!m){ hide(); return; }
    var q=m[2].toLowerCase();
    var people=(getPeople()||[]).filter(function(p){return p.name.toLowerCase().indexOf(q)!==-1;}).slice(0,8);
    if(!people.length){ hide(); return; }
    sug.innerHTML=people.map(function(p){return '<div class="tag-sug-item" data-type="'+p.type+'" data-id="'+esc(p.id)+'" data-name="'+esc(p.name)+'">＠ '+esc(p.name)+(p.type==='partner'?' · partner':'')+'</div>';}).join('');
    sug.style.display='block';
  });
  sug.addEventListener('mousedown',function(e){
    var it=e.target.closest('.tag-sug-item'); if(!it) return; e.preventDefault();
    var name=it.getAttribute('data-name'), id=it.getAttribute('data-id'), type=it.getAttribute('data-type');
    var pos=ta.selectionStart, before=ta.value.slice(0,pos), after=ta.value.slice(pos);
    before=before.replace(/(^|\s)@([^@\n]*)$/,function(_m,pre){return pre+'@'+name+' ';});
    ta.value=before+after;
    if(!mentions.some(function(x){return x.id===id&&x.type===type;})) mentions.push({type:type,id:id,name:name});
    hide(); ta.focus(); try{ ta.selectionStart=ta.selectionEnd=before.length; }catch(x){}
  });
  ta.addEventListener('blur',function(){ setTimeout(hide,150); });
}
async function loadStaffNotes(id){ var r=await api({action:'lead_notes_get',lead_id:id}); renderStaffNotes((r&&r.success&&r.notes)||[]); }
function renderStaffNotes(notes){
  var el=document.getElementById('posNotesList'); if(!el) return;
  if(!notes.length){ el.innerHTML='<div style="color:#94a3b8;font-size:13px;">No messages yet. Start the conversation below.</div>'; return; }
  el.innerHTML=notes.map(function(n){
    var staff=n.author_type==='staff';
    var badge='<span class="pnote-badge" style="background:'+(staff?'#ffedd5;color:#9a3412':'#ccfbf1;color:#0f766e')+';">'+(staff?'Staff':'Partner')+'</span>';
    var mentions=(n.mentions&&n.mentions.length)?'<div class="note-mentions">'+n.mentions.map(function(m){return '<span class="mchip">＠ '+esc(m.name||'')+'</span>';}).join('')+'</div>':'';
    return '<div class="pnote"><div class="pnote-h">'+badge+'<span style="font-size:11px;color:#94a3b8;">'+esc(n.author_name||'')+' · '+dt(n.created_at)+'</span></div><div class="pnote-body">'+esc(n.body)+'</div>'+mentions+'</div>';
  }).join('');
}
async function addStaffNote(id){
  var ta=document.getElementById('posNoteInput'); var body=(ta.value||'').trim(); if(!body) return;
  var btn=document.getElementById('posNoteAdd'); btn.disabled=true; btn.textContent='Saving…';
  var r=await api({action:'lead_note_add',lead_id:id,body:body,mentions:_staffMentions});
  btn.disabled=false; btn.innerHTML='<span class="material-icons" style="font-size:16px;vertical-align:-3px;">send</span> Add note';
  if(r&&r.success){ ta.value=''; _staffMentions.length=0; renderStaffNotes(r.notes||[]); } else Swal.showValidationMessage((r&&r.message)||'Could not add note');
}
/* ── Bell notifications (staff) ── */
function toggleBell(e){ if(e) e.stopPropagation(); var p=document.getElementById('bellPanel'); p.style.display=(p.style.display==='block')?'none':'block'; if(p.style.display==='block') loadBell(); }
document.addEventListener('click',function(e){ var p=document.getElementById('bellPanel'); if(p&&p.style.display==='block'&&!p.contains(e.target)&&!e.target.closest('.bell')) p.style.display='none'; });
async function loadBell(){
  var r=await api({action:'pos_notifications'});
  var ns=(r&&r.success&&r.notifications)||[]; var unread=(r&&r.unread)||0;
  var b=document.getElementById('bellBadge'); if(unread>0){ b.style.display='flex'; b.textContent=unread>9?'9+':unread; } else b.style.display='none';
  var list=document.getElementById('bellList');
  list.innerHTML = ns.length ? ns.map(function(n){
    return '<div class="bell-item'+(n.is_read?'':' unread')+'" onclick="openNotif(\''+n.id+'\',\''+esc(n.reference_id||'')+'\')"><div class="t">'+esc(n.title||'')+'</div><div class="b">'+esc(n.body||'')+'</div><div class="d">'+dt(n.created_at)+'</div></div>';
  }).join('') : '<div style="padding:20px;text-align:center;color:#94a3b8;font-size:13px;">No notifications yet.</div>';
}
window.openNotif=async function(nid, refId){
  await api({action:'pos_notifications_read',id:nid});
  document.getElementById('bellPanel').style.display='none'; loadBell();
  if(refId){ if(!LEADS.some(function(l){return l.id===refId;})) await load(); openLead(refId); }
};
async function testHlSend(leadId){
  var la=await api({action:'hl_actions_list'});
  var acts=(la&&la.success&&la.actions)||[];
  if(!acts.length){ Swal.fire({icon:'info',title:'No Send-to-HighLevel action',text:'Add a "Send to HighLevel workflow" action in Settings → Portal Automations first.'}); return; }
  var chosen=acts[0];
  if(acts.length>1){
    var opts={}; acts.forEach(function(a,i){ opts[i]=a.wf_name+' → '+(a.workflow_name||'(no workflow)')+' ('+a.map_count+' fields)'; });
    var pick=await Swal.fire({title:'Which Send-to-HighLevel action?',input:'select',inputOptions:opts,inputPlaceholder:'Choose…',showCancelButton:true,confirmButtonColor:'#ea580c'});
    if(!pick.isConfirmed) return; chosen=acts[+pick.value];
  }
  Swal.fire({title:'Sending test to HighLevel…',didOpen:function(){Swal.showLoading();},allowOutsideClick:false});
  var r=await api({action:'test_hl_send',id:leadId,wf_id:chosen.wf_id,act_index:chosen.act_index});
  if(!r||!r.success){ Swal.fire('Error',(r&&r.message)||'Test failed','error'); return; }
  var x=r.result||{};
  var rows=[];
  rows.push(['Mode',x.mode||'—']);
  if(x.mode==='api'){
    rows.push(['Fields sent',String(x.fields_sent||0)]);
    rows.push(['Contact upsert',x.contact_id?('✓ '+x.contact_id):('✗ HTTP '+(x.upsert_status||'?')+(x.upsert_error?' — '+x.upsert_error:''))]);
    rows.push(['Workflow enroll',x.enrolled?'✓ enrolled':(x.enroll_error||('HTTP '+(x.enroll_status||'?')))]);
  } else if(x.mode==='webhook'){ rows.push(['Webhook',x.ok?'✓ HTTP '+x.upsert_status:'✗ HTTP '+x.upsert_status]); }
  else { rows.push(['Result',x.upsert_error||'Not sent']); }
  var html='<div style="text-align:left;font-size:13px;">'+rows.map(function(rw){return '<div style="display:flex;gap:8px;padding:4px 0;border-bottom:1px solid #f1f5f9;"><span style="width:120px;color:#94a3b8;font-weight:700;flex:none;">'+rw[0]+'</span><span>'+esc(rw[1])+'</span></div>';}).join('')+'</div>';
  Swal.fire({icon:x.ok?'success':'warning',title:x.ok?'Test send succeeded':'Test send — check details',html:html});
  load();
}
var CAN_SETTINGS=(localStorage.getItem('pp_role')||'').toLowerCase().indexOf('super')!==-1 || localStorage.getItem('pp_access_pos_settings')==='true';
if(!CAN_SETTINGS){ NAV=NAV.filter(function(n){return n[0]!=='settings';}); if(SEC==='settings') SEC='dashboard'; }
renderNav(); load(); loadBell();
setInterval(loadBell, 15000);
window.addEventListener('focus', loadBell);
</script>
