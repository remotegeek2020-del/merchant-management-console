<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/api/favicon" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courses & Webinars | Marketing</title>
<script>(function(){const u=localStorage.getItem('pp_userid'),v=localStorage.getItem('pp_verified');if(!u||v!=='true')window.location.href='/?reason=unauthorized';})();</script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  *{box-sizing:border-box;}body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#f8fafc;color:#0f172a;}
  :root{--pri:#2563eb;--pri-d:#1d4ed8;--border:#e2e8f0;--muted:#94a3b8;--red:#dc2626;--green:#16a34a;}
  .top{background:#fff;border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;}
  .top h1{font-size:18px;font-weight:800;margin:0;flex:1;}
  .top a.back{color:var(--muted);text-decoration:none;font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px;}
  .wrap{max-width:1000px;margin:0 auto;padding:24px;}
  .btn{border:none;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
  .btn-p{background:var(--pri);color:#fff;}.btn-p:hover{background:var(--pri-d);}
  .btn-n{background:#fff;color:#475569;border:1px solid var(--border);}
  .course{background:#fff;border:1px solid var(--border);border-radius:14px;margin-bottom:16px;overflow:hidden;}
  .course-head{padding:16px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);}
  .course-head .t{font-weight:800;font-size:15px;flex:1;}
  .badge{font-size:10px;font-weight:800;border-radius:6px;padding:3px 8px;text-transform:uppercase;letter-spacing:.4px;}
  .b-auto{background:#dcfce7;color:#166534;}.b-manual{background:#fef3c7;color:#b45309;}
  .b-draft{background:#f1f5f9;color:#64748b;}.b-live{background:#dbeafe;color:#1d4ed8;}
  .course-body{padding:14px 18px;}
  .vid{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:13px;}
  .vid .prov{font-size:10px;font-weight:800;color:#64748b;background:#f1f5f9;border-radius:5px;padding:2px 7px;text-transform:uppercase;}
  .vid .g{flex:1;}
  .cthumb{width:52px;height:34px;border-radius:7px;overflow:hidden;background:#f1f5f9;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cthumb img{width:100%;height:100%;object-fit:cover;}
  .vthumb{width:64px;height:38px;border-radius:7px;overflow:hidden;background:#0f172a;position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .vthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .vthumb .play{color:#fff;font-size:22px;position:relative;z-index:1;opacity:.9;text-shadow:0 1px 4px rgba(0,0,0,.5);}
  .icon{cursor:pointer;color:var(--muted);}.icon:hover{color:var(--pri);}
  label{display:block;font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 5px;}
  input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;background:#f8fafc;outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--pri);background:#fff;}
  .muted{color:var(--muted);}.empty{text-align:center;padding:40px;color:var(--muted);}
  .row{display:flex;gap:10px;}.row>div{flex:1;}
  .vstats{display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:middle;}
  .vstat{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#475569;background:#f1f5f9;border-radius:5px;padding:2px 6px;}
  .vstat.clk{cursor:pointer;}.vstat.clk:hover{background:#e2e8f0;}
  .cbell{position:relative;display:inline-flex;cursor:pointer;}
  .cbadge{position:absolute;top:-6px;right:-8px;background:#dc2626;color:#fff;font-size:9px;font-weight:800;line-height:1;padding:2px 4px;border-radius:9px;min-width:14px;text-align:center;}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="/marketing"><span class="material-icons" style="font-size:18px;">arrow_back</span> Marketing</a>
  <h1>🎓 Courses &amp; Webinars</h1>
  <a class="btn btn-n" href="/marketing-settings" style="text-decoration:none;"><span class="material-icons" style="font-size:16px;">settings</span> Settings</a>
  <button class="btn btn-n" onclick="refreshYtStats(this)"><span class="material-icons" style="font-size:16px;">insights</span> Refresh YouTube stats</button>
  <button class="btn btn-p" onclick="editCourse()"><span class="material-icons" style="font-size:17px;">add</span> New course</button>
</div>
<div class="wrap" id="wrap"><div class="empty">Loading…</div></div>
<script>
var TOKEN=localStorage.getItem('pp_session_token')||'';
function api(b){ return fetch('/api/courses',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify(b)}).then(function(r){return r.json();}); }
function yapi(b){ return fetch('/api/youtube-oauth',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify(b)}).then(function(r){return r.json();}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);}); }
var COURSES=[];
function fmtNum(n){ n=Number(n)||0; if(n>=1e6) return (n/1e6).toFixed(n>=1e7?0:1)+'M'; if(n>=1e3) return (n/1e3).toFixed(n>=1e4?0:1)+'K'; return String(n); }
function vidStats(v){
  var parts=[];
  // Portal plays — clickable to see WHO watched (matched to HighLevel).
  parts.push('<span class="vstat clk" onclick="showViewers(\''+v.id+'\',\''+esc((v.title||'').replace(/\\/g,"\\\\").replace(/\x27/g,"\\\x27"))+'\')" title="'+((Number(v.portal_views)||0))+' portal plays · '+((Number(v.portal_viewers)||0))+' unique partners — click to see who"><span class="material-icons" style="font-size:13px;">groups</span> '+fmtNum(v.portal_views)+' portal</span>');
  if(v.yt_view_count!=null) parts.push('<span class="vstat clk" onclick="showYtAnalytics(\''+v.id+'\')" title="YouTube stats — click for watch time, traffic sources & more"><span class="material-icons" style="font-size:13px;">smart_display</span> '+fmtNum(v.yt_view_count)+' YT</span>');
  if(v.yt_portal_views!=null) parts.push('<span class="vstat clk" style="background:#eef2ff;color:#4338ca;" onclick="showYtAnalytics(\''+v.id+'\')" title="YouTube views embedded on our portal (YouTube Analytics) — click for detail"><span class="material-icons" style="font-size:13px;">verified</span> '+fmtNum(v.yt_portal_views)+' YT-portal</span>');
  if(v.qr_scans) parts.push('<span class="vstat" style="background:#ecfdf5;color:#047857;" title="QR code scans"><span class="material-icons" style="font-size:13px;">qr_code_scanner</span> '+fmtNum(v.qr_scans)+' scans</span>');
  return '<span class="vstats">'+parts.join('')+'</span>';
}
var TRAFFIC_LABELS={EMBEDDED:'Embedded players',YT_SEARCH:'YouTube search',RELATED_VIDEO:'Suggested videos',NO_LINK_OTHER:'Direct / unknown',NO_LINK_EMBEDDED:'External app embed',EXT_URL:'External websites',SUBSCRIBER:'Browse / feed',PLAYLIST:'Playlists',NOTIFICATION:'Notifications',YT_CHANNEL:'Channel page',YT_OTHER_PAGE:'Other YouTube',ADVERTISING:'Ads',PROMOTED:'Promoted',ANNOTATION:'Cards / annotations',END_SCREEN:'End screens',SHORTS:'Shorts feed',HASHTAGS:'Hashtags',SOUND_PAGE:'Sound page',LIVE_REDIRECT:'Live redirect',CAMPAIGN_CARD:'Campaign cards'};
function fmtDur(sec){ sec=Math.round(Number(sec)||0); var m=Math.floor(sec/60), s=sec%60; return m+':'+(s<10?'0':'')+s; }
function fmtWatch(min){ min=Number(min)||0; if(min>=60){ var h=Math.floor(min/60); return h.toLocaleString()+'h '+Math.round(min%60)+'m'; } return Math.round(min)+' min'; }
function tile(label,val,sub){ return '<div style="flex:1;min-width:120px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;"><div style="font-size:20px;font-weight:800;">'+val+'</div><div style="font-size:11px;color:#64748b;font-weight:700;margin-top:2px;">'+label+'</div>'+(sub?'<div style="font-size:10.5px;color:#94a3b8;margin-top:1px;">'+sub+'</div>':'')+'</div>'; }
window.showYtAnalytics=async function(videoId){
  Swal.fire({title:'Loading analytics…',didOpen:function(){Swal.showLoading();},allowOutsideClick:false});
  var r=await api({action:'video_analytics',video_id:videoId});
  if(!r||!r.success){ Swal.fire('Error',(r&&r.message)||'Could not load analytics','error'); return; }
  var c=r.cached||{}, a=r.analytics, p=r.portal||{};
  // Row of headline tiles: prefer live Analytics figures, fall back to cached.
  var tiles=''
    +tile('YouTube views',fmtNum(a?a.views:c.views||0))
    +tile('Likes',fmtNum(a?a.likes:(c.likes!=null?c.likes:0)))
    +tile('Comments',fmtNum(a?a.comments:(c.comments!=null?c.comments:0)))
    +tile('Portal plays',fmtNum(p.views||0),(p.unique_viewers||0)+' unique');
  var deep='';
  if(r.connected && a){
    deep+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">'
      +tile('Watch time',fmtWatch(a.minutesWatched))
      +tile('Avg. view',fmtDur(a.avgDuration),'min:sec')
      +tile('Shares',fmtNum(a.shares))
      +tile('Subs gained',fmtNum(a.subscribersGained))
      +'</div>';
    var ts=(a.trafficSources||[]).filter(function(x){return x.views>0;});
    var tot=ts.reduce(function(s,x){return s+x.views;},0)||1;
    if(ts.length){
      deep+='<div style="text-align:left;margin-top:14px;"><div style="font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;margin-bottom:6px;">Where views came from</div>';
      ts.slice(0,8).forEach(function(x){
        var pct=Math.round(x.views/tot*100);
        var isPortal=(x.type==='EMBEDDED');
        deep+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12.5px;">'
          +'<div style="width:130px;color:#334155;'+(isPortal?'font-weight:800;':'')+'">'+esc(TRAFFIC_LABELS[x.type]||x.type)+(isPortal?' 📍':'')+'</div>'
          +'<div style="flex:1;background:#eef2f7;border-radius:6px;height:14px;overflow:hidden;"><div style="height:100%;width:'+pct+'%;background:'+(isPortal?'#4338ca':'#2563eb')+';"></div></div>'
          +'<div style="width:88px;text-align:right;color:#64748b;">'+fmtNum(x.views)+' · '+pct+'%</div></div>';
      });
      deep+='<div class="muted" style="font-size:11px;margin-top:4px;">📍 “Embedded players” includes your portal.</div></div>';
    }
    var co=(a.countries||[]).filter(function(x){return x.views>0;});
    if(co.length){
      deep+='<div style="text-align:left;margin-top:12px;"><div style="font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;margin-bottom:4px;">Top countries</div><div style="font-size:12.5px;color:#334155;">'+co.map(function(x){return esc(x.country)+' ('+fmtNum(x.views)+')';}).join(' · ')+'</div></div>';
    }
    deep+='<div class="muted" style="font-size:11px;margin-top:12px;">YouTube Analytics data lags 2–3 days and is aggregate — YouTube never shows who watched.</div>';
  } else if(!r.connected){
    deep+='<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:11px 13px;margin-top:12px;font-size:12.5px;color:#92400e;text-align:left;">Connect <b>YouTube Analytics</b> in <a href="/marketing-settings" style="color:#b45309;font-weight:700;">Settings</a> to see watch time, average view duration, and traffic sources (incl. how much came from your portal).</div>';
  } else {
    deep+='<div class="muted" style="font-size:12px;margin-top:12px;">No YouTube Analytics rows yet for this video (needs a couple days of data).</div>';
  }
  Swal.fire({title:esc(r.title||'YouTube analytics'),width:640,
    html:'<div style="display:flex;gap:8px;flex-wrap:wrap;">'+tiles+'</div>'+deep,
    confirmButtonText:'Done',confirmButtonColor:'#2563eb'});
};
window.showViewers=async function(videoId,title){
  Swal.fire({title:'Loading viewers…',didOpen:function(){Swal.showLoading();},allowOutsideClick:false});
  var r=await api({action:'video_viewers',video_id:videoId});
  if(!r||!r.success){ Swal.fire('Error',(r&&r.message)||'Could not load viewers','error'); return; }
  var vw=r.viewers||[];
  function hlLink(v){ return v.hl_contact_id?('<a href="https://app.mypayprotec.com/contacts/detail/'+esc(v.hl_contact_id)+'" target="_blank" title="Open in HighLevel" style="color:#0369a1;text-decoration:none;"><span class="material-icons" style="font-size:15px;vertical-align:middle;">open_in_new</span></a>'):'<span class="muted" style="font-size:11px;" title="No HighLevel contact linked">—</span>'; }
  var rows=vw.length?vw.map(function(v){
    return '<tr>'
      +'<td style="padding:7px 6px;border-bottom:1px solid #f1f5f9;"><b>'+esc(v.name)+'</b>'+(v.email?'<div class="muted" style="font-size:11.5px;">'+esc(v.email)+'</div>':'')+(v.phone?'<div class="muted" style="font-size:11.5px;">'+esc(v.phone)+'</div>':'')+'</td>'
      +'<td style="padding:7px 6px;border-bottom:1px solid #f1f5f9;text-align:center;font-weight:800;">'+v.views+'</td>'
      +'<td style="padding:7px 6px;border-bottom:1px solid #f1f5f9;font-size:12px;color:#64748b;white-space:nowrap;">'+(v.last_viewed?new Date(v.last_viewed).toLocaleString():'—')+'</td>'
      +'<td style="padding:7px 6px;border-bottom:1px solid #f1f5f9;text-align:center;">'+hlLink(v)+'</td>'
      +'</tr>';
  }).join(''):'<tr><td colspan="4" style="padding:20px;text-align:center;color:#94a3b8;">No portal views yet.</td></tr>';
  Swal.fire({title:esc(title||'Viewers'),width:640,
    html:'<div style="text-align:left;">'
      +'<div class="muted" style="font-size:12.5px;margin-bottom:8px;">'+r.total_views+' plays · '+r.unique_viewers+' unique partners · names &amp; contact from HighLevel</div>'
      +'<div style="max-height:52vh;overflow:auto;border:1px solid #e2e8f0;border-radius:10px;">'
      +'<table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr style="background:#f8fafc;position:sticky;top:0;">'
      +'<th style="text-align:left;padding:8px 6px;font-size:11px;color:#64748b;text-transform:uppercase;">Partner</th>'
      +'<th style="padding:8px 6px;font-size:11px;color:#64748b;text-transform:uppercase;">Plays</th>'
      +'<th style="text-align:left;padding:8px 6px;font-size:11px;color:#64748b;text-transform:uppercase;">Last viewed</th>'
      +'<th style="padding:8px 6px;font-size:11px;color:#64748b;text-transform:uppercase;">HighLevel</th>'
      +'</tr></thead><tbody>'+rows+'</tbody></table></div></div>',
    confirmButtonText:'Done',confirmButtonColor:'#2563eb'});
};
function vidThumb(v){
  var img=v.thumbnail_url||'';
  if(!img && v.url){ var m=String(v.url).match(/(?:v=|youtu\.be\/|\/embed\/|\/shorts\/|\/live\/)([\w-]{6,})/); if(m) img='https://img.youtube.com/vi/'+m[1]+'/mqdefault.jpg'; }
  return img?'<img src="'+esc(img)+'" onerror="this.style.display=\'none\'">':'';
}
async function load(){
  var r=await api({action:'courses_admin_list'});
  if(!r.success){ document.getElementById('wrap').innerHTML='<div class="empty" style="color:#9a3412;">'+esc(r.message||'Failed to load')+'</div>'; return; }
  COURSES=r.courses||[];
  render();
}
function render(){
  var w=document.getElementById('wrap');
  if(!COURSES.length){ w.innerHTML='<div class="empty">No courses yet. Create one to organize your webinars.</div>'; return; }
  w.innerHTML=COURSES.map(function(c){
    var vids=(c.videos||[]).map(function(v){
      var drip='';
      if(v.available_on) drip='<span class="badge b-manual" title="Releases on this date">📅 '+esc(v.available_on)+'</span>';
      else if(v.drip_days>0) drip='<span class="badge b-manual" title="Days after a partner unlocks the course">⏳ +'+v.drip_days+'d</span>';
      return '<div class="vid"><div class="vthumb">'+vidThumb(v)+'<span class="material-icons play">play_circle</span></div>'
        +'<span class="g"><b>'+esc(v.title)+'</b><div style="margin-top:3px;"><span class="prov" style="display:inline-block;">'+esc(v.provider)+'</span> '+vidStats(v)+'</div></span>'+drip
        +((v.source==='youtube'||/youtu\.?be|youtube\.com/i.test(v.url||''))?'<span class="cbell" title="YouTube comments'+(v.open_comments?' — '+v.open_comments+' new/unanswered':'')+'" onclick="showComments(\''+v.id+'\')"><span class="material-icons icon">forum</span>'+(v.open_comments?'<span class="cbadge">'+(v.open_comments>99?'99+':v.open_comments)+'</span>':'')+'</span>':'')
        +'<span class="material-icons icon" title="QR code'+(v.qr_scans?' — '+v.qr_scans+' scans':'')+'" onclick="openQr(\''+c.id+'\',\''+v.id+'\')">qr_code_2</span>'
        +'<span class="material-icons icon" title="Edit" onclick="editVideo(\''+c.id+'\',\''+v.id+'\')">edit</span>'
        +'<span class="material-icons icon" style="color:#dc2626;" title="Delete" onclick="delVideo(\''+v.id+'\')">delete</span></div>';
    }).join('')||'<div class="muted" style="font-size:12.5px;padding:8px 0;">No videos yet.</div>';
    var accessBtn=(c.unlock_mode==='manual')?'<button class="btn btn-n" onclick="manageAccess(\''+c.id+'\')"><span class="material-icons" style="font-size:15px;">lock_open</span> Access ('+(c.access_count||0)+')</button>':'';
    return '<div class="course"><div class="course-head">'
      +'<div class="cthumb">'+(c.thumbnail_url?'<img src="'+esc(c.thumbnail_url)+'" onerror="this.style.display=\'none\'">':'<span class="material-icons" style="color:#cbd5e1;">image</span>')+'</div>'
      +'<span class="t">'+esc(c.title)+'</span>'
      +'<span class="badge '+(c.is_published?'b-live':'b-draft')+'">'+(c.is_published?'Published':'Draft')+'</span>'
      +'<span class="badge '+(c.unlock_mode==='auto'?'b-auto':'b-manual')+'">'+(c.unlock_mode==='auto'?'Auto-unlock':'Manual unlock')+'</span>'
      +(c.yt_channel_id?'<button class="btn btn-n" style="padding:6px 11px;" title="Sync YouTube lives now (past, live & upcoming)" onclick="syncCourse(\''+c.id+'\',this)"><span class="material-icons" style="font-size:15px;">sync</span> Sync lives</button>':'')
      +'<span class="material-icons icon" title="Edit course" onclick="editCourse(\''+c.id+'\')">edit</span>'
      +'<span class="material-icons icon" style="color:#dc2626;" title="Delete course" onclick="delCourse(\''+c.id+'\')">delete</span></div>'
      +'<div class="course-body">'+(c.description?'<div class="muted" style="font-size:13px;margin-bottom:10px;">'+esc(c.description)+'</div>':'')
      +vids
      +(c.yt_channel_id?'<div class="muted" style="font-size:12px;margin-top:10px;">📺 Auto-syncing lives from YouTube'+(c.yt_sync_enabled?'':' <b>(paused)</b>')+(c.yt_last_sync?' · last synced '+new Date(c.yt_last_sync).toLocaleString():'')+'</div>':'')
      +'<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;"><button class="btn btn-n" onclick="editVideo(\''+c.id+'\')"><span class="material-icons" style="font-size:15px;">add</span> Add video</button>'
      +(c.yt_channel_id?'<button class="btn btn-n" onclick="syncCourse(\''+c.id+'\',this)"><span class="material-icons" style="font-size:15px;">sync</span> Sync lives now</button>':'')
      +accessBtn+'</div>'
      +'</div></div>';
  }).join('');
}
window.editCourse=async function(id){
  var c=id?COURSES.find(function(x){return x.id===id;}):{title:'',description:'',unlock_mode:'manual',is_published:false};
  var res=await Swal.fire({title:id?'Edit course':'New course',width:560,
    html:'<div style="text-align:left;">'
      +'<label>Course title</label><input id="c-title" class="swal2-input" style="margin:0;width:100%;" value="'+esc(c.title||'')+'">'
      +'<label>Description</label><textarea id="c-desc" class="swal2-textarea" style="margin:0;width:100%;">'+esc(c.description||'')+'</textarea>'
      +'<label>Thumbnail image URL (optional)</label><input id="c-thumb" class="swal2-input" style="margin:0;width:100%;" placeholder="https://…/cover.jpg" value="'+esc(c.thumbnail_url||'')+'">'
      +'<label>Unlock mode</label><select id="c-mode" class="swal2-input" style="margin:0;width:100%;"><option value="manual"'+(c.unlock_mode!=='auto'?' selected':'')+'>Manual — only partners I grant access</option><option value="auto"'+(c.unlock_mode==='auto'?' selected':'')+'>Automatic — every partner sees it</option></select>'
      +'<label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;margin-top:14px;font-size:13px;cursor:pointer;"><input type="checkbox" id="c-pub" style="width:auto;" '+(c.is_published?'checked':'')+'> Published (visible to partners)</label>'
      +'<div style="border-top:1px solid #e2e8f0;margin-top:14px;padding-top:10px;">'
      +'<label>📺 Auto-sync YouTube lives <span style="color:#94a3b8;font-weight:400;text-transform:none;">(optional)</span></label>'
      +'<input id="c-ytch" class="swal2-input" style="margin:0;width:100%;" placeholder="Channel URL, @handle, or channel ID (UC…)" value="'+esc(c.yt_channel_id||'')+'">'
      +'<div style="font-size:11.5px;color:#94a3b8;margin-top:4px;">Pulls this channel\'s live broadcasts (past + in-progress) into the course automatically — title, description, date &amp; thumbnail. Checked hourly.</div>'

      });
    },
    preConfirm:function(){ var t=document.getElementById('v-title').value.trim(),u=document.getElementById('v-url').value.trim(); if(!t){Swal.showValidationMessage('Title required');return false;} if(!u){Swal.showValidationMessage('Embed URL required');return false;} return {title:t,provider:document.getElementById('v-prov').value,url:u,thumbnail_url:document.getElementById('v-thumb').value.trim(),description:document.getElementById('v-desc').value,available_on:document.getElementById('v-avail').value||null,drip_days:document.getElementById('v-drip').value||0,ai_context:document.getElementById('v-aictx').value.trim(),ai_goal:document.getElementById('v-aigoal').value,ai_cta_link:document.getElementById('v-ailink').value.trim(),ai_cta_label:document.getElementById('v-ailabel').value.trim(),ai_cta_ref:document.getElementById('v-airef').value}; }
  });
  if(!res.isConfirmed) return;
  var r=await api(Object.assign({action:'save_video',id:vid||undefined,course_id:courseId},res.value));
  if(r.success) load(); else Swal.fire('Error',r.message||'','error');
};
window.delVideo=async function(id){ var c=await Swal.fire({icon:'warning',title:'Delete video?',showCancelButton:true,confirmButtonColor:'#dc2626'}); if(!c.isConfirmed) return; await api({action:'delete_video',id:id}); load(); };
window.manageAccess=async function(courseId){
  var course=COURSES.find(function(c){return c.id===courseId;});
  function panel(list){
    return '<div style="text-align:left;">'
      +'<div style="font-size:12px;color:#64748b;margin-bottom:8px;">Search a partner by name or email to grant access.</div>'
      +'<input id="ac-search" class="swal2-input" style="margin:0;width:100%;" placeholder="Search partner…" oninput="acSearch(\''+courseId+'\')">'
      +'<div id="ac-results" style="margin:6px 0;"></div>'
      +'<div style="font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;margin:10px 0 6px;">Has access ('+list.length+')</div>'
      +'<div id="ac-list">'+(list.length?list.map(function(a){return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:13px;"><span style="flex:1;"><b>'+esc(a.name)+'</b> <span class="muted">'+esc(a.email)+'</span></span><span class="material-icons icon" style="color:#dc2626;" onclick="acRevoke(\''+courseId+'\',\''+a.person_id+'\')">remove_circle</span></div>';}).join(''):'<div class="muted" style="font-size:12.5px;">No partners yet.</div>')+'</div></div>';
  }
  var r=await api({action:'course_access_list',course_id:courseId});
  await Swal.fire({title:'Access — '+esc(course.title),width:560,html:panel((r&&r.access)||[]),showConfirmButton:true,confirmButtonText:'Done',confirmButtonColor:'#2563eb'});
};
window.acSearch=function(courseId){
  var q=document.getElementById('ac-search').value.trim();
  var box=document.getElementById('ac-results'); if(q.length<2){box.innerHTML='';return;}
  api({action:'partner_search',q:q}).then(function(r){
    var ps=(r&&r.partners)||[];
    box.innerHTML=ps.length?ps.map(function(p){return '<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid #f1f5f9;border-radius:8px;margin-bottom:4px;font-size:13px;cursor:pointer;" onclick="acGrant(\''+courseId+'\',\''+p.id+'\')"><span style="flex:1;"><b>'+esc(p.name)+'</b> <span class="muted">'+esc(p.email)+'</span></span><span class="material-icons" style="color:#16a34a;">add_circle</span></div>';}).join(''):'<div class="muted" style="font-size:12px;padding:4px;">No matches.</div>';
  });
};
window.acGrant=async function(courseId,pid){ await api({action:'grant_access',course_id:courseId,person_id:pid}); load(); manageAccess(courseId); };
window.acRevoke=async function(courseId,pid){ await api({action:'revoke_access',course_id:courseId,person_id:pid}); load(); manageAccess(courseId); };
// OAuth return toast (Google redirects back to /marketing-courses?yt=…).
(function(){
  var p=new URLSearchParams(location.search), yt=p.get('yt');
  if(yt==='connected'){ Swal.fire({icon:'success',title:'YouTube channel connected',text:'Click "YouTube Analytics" → Save & refresh to pull portal-attributed views.',confirmButtonColor:'#2563eb'}); }
  else if(yt==='error'){ Swal.fire('Connection failed',p.get('msg')||'Could not connect the channel.','error'); }
  if(yt){ history.replaceState({}, '', location.pathname); }
})();
load();
</script>
