<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Portal | Marketing</title>
<link rel="icon" href="/api/favicon" />
<script>(function(){const u=localStorage.getItem('pp_userid'),v=localStorage.getItem('pp_verified');if(!u||v!=='true')window.location.href='/?reason=unauthorized';})();</script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  *{box-sizing:border-box;}body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#f8fafc;color:#0f172a;}
  :root{--pri:#2563eb;--pri-d:#1d4ed8;--border:#e2e8f0;--muted:#94a3b8;--green:#16a34a;}
  .top{background:#fff;border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;}
  .top h1{font-size:18px;font-weight:800;margin:0;flex:1;}
  .top a.back{color:var(--muted);text-decoration:none;font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px;}
  .wrap{max-width:1000px;margin:0 auto;padding:24px;}
  .btn{border:none;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
  .btn-p{background:var(--pri);color:#fff;}.btn-p:hover{background:var(--pri-d);}
  .btn-n{background:#fff;color:#475569;border:1px solid var(--border);}
  .tabs{display:flex;gap:8px;margin-bottom:16px;}
  .tab{border:1px solid var(--border);background:#fff;border-radius:9px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;color:#475569;font-family:inherit;}
  .tab.on{background:var(--pri);color:#fff;border-color:var(--pri);}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;margin-bottom:12px;padding:14px 16px;}
  .q-row{display:flex;align-items:center;gap:12px;}
  .q-type{font-size:10px;font-weight:800;color:#4338ca;background:#eef2ff;border-radius:6px;padding:2px 8px;text-transform:uppercase;}
  .req{font-size:10px;font-weight:800;color:#b45309;background:#fef3c7;border-radius:6px;padding:2px 7px;}
  .icon{cursor:pointer;color:var(--muted);}.icon:hover{color:var(--pri);}
  .muted{color:var(--muted);}.empty{text-align:center;padding:44px;color:var(--muted);}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
  .stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
  .stat .n{font-size:1.5rem;font-weight:800;}.stat .l{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  th{background:#f8fafc;padding:9px 12px;text-align:left;font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase;}
  td{padding:9px 12px;border-bottom:1px solid #f1f5f9;font-size:13px;}
  tr.lead-row{cursor:pointer;}tr.lead-row:hover{background:#f8fafc;}
  .pill{font-size:10px;font-weight:800;border-radius:20px;padding:2px 8px;}
  .pill.done{background:#dcfce7;color:#166534;}.pill.pend{background:#fef3c7;color:#b45309;}.pill.conv{background:#dbeafe;color:#1d4ed8;}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="/marketing"><span class="material-icons" style="font-size:18px;">arrow_back</span> Marketing</a>
  <h1>🚪 Lead Portal</h1>
</div>
<div class="wrap" id="wrap"><div class="empty">Loading…</div></div>
<script>
var TOKEN=localStorage.getItem('pp_session_token')||'', UID=localStorage.getItem('pp_userid')||'';
function api(b){ return fetch('/api/lead-portal',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify(Object.assign({staff_userid:UID},b))}).then(function(r){return r.json();}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);}); }
var TYPES=[['short_text','Short text'],['long_text','Paragraph'],['multiple_choice','Multiple choice (pick one)'],['checkboxes','Checkboxes (pick many)'],['dropdown','Dropdown'],['yes_no','Yes / No'],['number','Number']];
var tab='survey';

function shell(){
  document.getElementById('wrap').innerHTML=
    '<div class="tabs"><button class="tab" id="t-survey" onclick="setTab(\'survey\')">Onboarding Survey</button><button class="tab" id="t-leads" onclick="setTab(\'leads\')">Leads</button><button class="tab" id="t-settings" onclick="setTab(\'settings\')">Settings</button></div>'
    +'<div id="panel"></div>';
  setTab(tab);
}
window.setTab=function(t){ tab=t; ['survey','leads','settings'].forEach(function(x){ var el=document.getElementById('t-'+x); if(el) el.className='tab'+(t===x?' on':''); }); (t==='survey'?loadSurvey:(t==='leads'?loadLeads:loadSettings))(); };

async function loadSettings(){
  var p=document.getElementById('panel'); p.innerHTML='<div class="empty">Loading…</div>';
  var r=await api({action:'get_lead_settings'});
  if(!r.success){ p.innerHTML='<div class="empty" style="color:#9a3412;">'+esc(r.message||'Failed')+'</div>'; return; }
  if(!r.configured){ p.innerHTML='<div class="card"><b>Book-a-Call calendar</b><div class="muted" style="font-size:13px;margin-top:6px;">No HighLevel sub-account is configured (GHL_LOCATION_ID). Add it in Secret Dungeon → API Manager first.</div></div>'; return; }
  var cals=r.calendars||[];
  p.innerHTML='<div class="card" style="max-width:560px;">'
    +'<b style="font-size:15px;">Book-a-Call calendar</b>'
    +'<div class="muted" style="font-size:13px;margin:6px 0 14px;">Connected HighLevel sub-account: <b>'+esc(r.location_name||'PayProTec Partners')+'</b>. Choose the calendar leads use to book their become-a-partner call.</div>'
    +'<label style="font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;">Calendar</label>'
    +'<select id="cal-sel" style="width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;margin-top:5px;">'
      +'<option value="">— Select a calendar —</option>'
      +cals.map(function(c){return '<option value="'+esc(c.id)+'"'+(r.calendar_id===c.id?' selected':'')+'>'+esc(c.name)+'</option>';}).join('')
    +'</select>'
    +(cals.length?'':'<div class="muted" style="font-size:12px;margin-top:6px;">No calendars found in this sub-account.</div>')
    +'<div style="border-top:1px solid var(--border);margin:16px 0;"></div>'
    +'<b style="font-size:15px;">Import from HighLevel</b>'
    +'<div class="muted" style="font-size:13px;margin:6px 0 10px;">Contacts in HighLevel that carry this <b>tag</b> (e.g. from your Facebook / LinkedIn / Google ad forms) can be imported as prospect accounts from the Leads tab.</div>'
    +'<label style="font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;">Lead-gen tag</label>'
    +'<input id="imp-tag" value="'+esc(r.import_tag||'')+'" placeholder="e.g. lead portal" style="width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;margin-top:5px;">'
    +'<label style="display:flex;align-items:flex-start;gap:10px;margin-top:14px;padding:11px 13px;background:#f0fdfa;border:1px solid #99f6e4;border-radius:10px;cursor:pointer;">'
      +'<input type="checkbox" id="imp-invite" '+(r.auto_invite?'checked':'')+' style="width:16px;height:16px;margin-top:1px;accent-color:#0d9488;">'
      +'<span style="font-size:13px;"><b>Email an account-setup invite when importing</b><div class="muted" style="font-size:12px;margin-top:2px;">When ON, each <b>new</b> prospect pulled in from HighLevel gets an email to set a password &amp; access the portal. Leave OFF to just sync them silently and invite later.</div></span>'
    +'</label>'
    +'<div style="margin-top:14px;"><button class="btn btn-p" onclick="saveCal(this)"><span class="material-icons" style="font-size:16px;">save</span> Save</button></div>'
    +'</div>'
    // ── Webhook card ──
    +'<div class="card" style="max-width:640px;margin-top:16px;">'
    +'<b style="font-size:15px;">HighLevel Workflow Webhook</b>'
    +'<div class="muted" style="font-size:13px;margin:6px 0 12px;">Add this as a <b>Webhook</b> action in a HighLevel workflow to push contacts into the Lead Portal automatically. Pick the mode with the <code>invite</code> parameter.</div>'
    +(r.webhook_secret_set
        ? '<div style="background:#dcfce7;color:#166534;font-size:12px;font-weight:700;border-radius:8px;padding:8px 11px;margin-bottom:10px;">✓ Webhook secret is configured.</div>'
        : '<div style="background:#fef3c7;color:#92400e;font-size:12px;font-weight:700;border-radius:8px;padding:8px 11px;margin-bottom:10px;">⚠ Set <code>LEAD_WEBHOOK_SECRET</code> in Vercel env vars, then use it below in place of <code>YOUR_SECRET</code>.</div>')
    +'<label style="font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;">Create prospect only</label>'
    +'<div style="display:flex;gap:6px;margin:5px 0 12px;"><input id="wh1" readonly value="'+esc(location.origin)+'/api/lead-webhook?secret=YOUR_SECRET&invite=false" style="flex:1;padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-size:12px;font-family:monospace;background:#f8fafc;" onclick="this.select()"><button class="btn btn-n" onclick="copyVal(\'wh1\',this)">Copy</button></div>'
    +'<label style="font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;">Create prospect + send setup invite</label>'
    +'<div style="display:flex;gap:6px;margin:5px 0 6px;"><input id="wh2" readonly value="'+esc(location.origin)+'/api/lead-webhook?secret=YOUR_SECRET&invite=true" style="flex:1;padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-size:12px;font-family:monospace;background:#f8fafc;" onclick="this.select()"><button class="btn btn-n" onclick="copyVal(\'wh2\',this)">Copy</button></div>'
    +'<div class="muted" style="font-size:11.5px;margin-top:8px;">In the HighLevel webhook action set method <b>POST</b>. The contact\'s email is required; name &amp; phone are pulled if present. Already-active accounts are never re-invited.</div>'
    +'</div>'
    // ── Lead Portal content card (testimonials + estimator rate) ──
    +'<div class="card" style="max-width:640px;margin-top:16px;">'
    +'<b style="font-size:15px;">Lead Portal content</b>'
    +'<div class="muted" style="font-size:13px;margin:6px 0 12px;">Shown to prospects on the <b>Why Partner?</b> tab.</div>'
    +'<label style="font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;">Income estimator rate</label>'
    +'<div style="display:flex;align-items:center;gap:8px;margin-top:5px;"><input id="est-rate" type="number" step="0.01" value="'+((Number(r.estimator_rate||0.004)*100).toFixed(2))+'" style="width:120px;padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;"> <span class="muted" style="font-size:12.5px;">% of monthly processing volume (illustrative). e.g. 0.40</span></div>'
    +'<div style="font-weight:800;font-size:12px;text-transform:uppercase;color:#64748b;margin:16px 0 6px;">Testimonials</div>'
    +'<div id="testi-list"></div>'
    +'<button type="button" class="btn btn-n" onclick="testiAdd()" style="margin-top:4px;"><span class="material-icons" style="font-size:15px;">add</span> Add testimonial</button>'
    +'<div style="margin-top:14px;"><button class="btn btn-p" onclick="saveContent(this)"><span class="material-icons" style="font-size:16px;">save</span> Save content</button></div>'
    +'</div>';
  (r.testimonials||[]).forEach(function(t){ testiAdd(t.quote,t.name,t.company); });
}
window.copyVal=function(id,btn){ var el=document.getElementById(id); el.select(); try{ navigator.clipboard.writeText(el.value); }catch(e){ document.execCommand('copy'); } var t=btn.textContent; btn.textContent='Copied'; setTimeout(function(){btn.textContent=t;},1200); };
window.testiAdd=function(quote,name,company){
  var l=document.getElementById('testi-list'); if(!l) return;
  var d=document.createElement('div'); d.style.cssText='border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:8px;';
  d.innerHTML='<textarea class="t-quote" placeholder="Quote…" style="width:100%;min-height:52px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;font-family:inherit;font-size:13px;">'+esc(quote||'')+'</textarea>'
    +'<div style="display:flex;gap:6px;margin-top:6px;"><input class="t-name" placeholder="Name" value="'+esc(name||'')+'" style="flex:1;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:inherit;"><input class="t-company" placeholder="Company (optional)" value="'+esc(company||'')+'" style="flex:1;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:inherit;"><button type="button" class="material-icons" title="Remove" style="border:none;background:none;color:#dc2626;cursor:pointer;font-size:18px;" onclick="this.closest(\'div\').parentNode.removeChild(this.closest(\'div\'))">close</button></div>';
  l.appendChild(d);
};
window.saveContent=async function(btn){
  var rows=Array.prototype.slice.call(document.querySelectorAll('#testi-list > div'));
  var testimonials=rows.map(function(row){ return {quote:(row.querySelector('.t-quote').value||'').trim(),name:(row.querySelector('.t-name').value||'').trim(),company:(row.querySelector('.t-company').value||'').trim()}; }).filter(function(t){return t.quote;});
  var rate=parseFloat(document.getElementById('est-rate').value)/100;
  btn.disabled=true;
  var r=await api({action:'save_lead_settings',testimonials:testimonials,estimator_rate:rate});
  btn.disabled=false;
  if(r&&r.success) Swal.fire({icon:'success',title:'Saved',timer:1100,showConfirmButton:false});
  else Swal.fire('Error',(r&&r.message)||'Could not save','error');
};
window.saveCal=async function(btn){
  var sel=document.getElementById('cal-sel'); var cid=sel.value; var cname=cid?sel.options[sel.selectedIndex].text:'';
  var tagEl=document.getElementById('imp-tag'); var tag=tagEl?tagEl.value.trim():undefined;
  var invEl=document.getElementById('imp-invite'); var autoInvite=invEl?invEl.checked:undefined;
  btn.disabled=true;
  var r=await api({action:'save_lead_settings',calendar_id:cid,calendar_name:cname,import_tag:tag,auto_invite:autoInvite});
  btn.disabled=false;
  if(r&&r.success) Swal.fire({icon:'success',title:'Saved',timer:1100,showConfirmButton:false});
  else Swal.fire('Error',(r&&r.message)||'Could not save','error');
};

// ── Onboarding survey builder ──
async function loadSurvey(){
  var p=document.getElementById('panel'); p.innerHTML='<div class="empty">Loading…</div>';
  var r=await api({action:'list_questions'});
  if(!r.success){ p.innerHTML='<div class="empty" style="color:#9a3412;">'+esc(r.message||'Failed')+'</div>'; return; }
  var qs=r.questions||[];
  var typeLabel={}; TYPES.forEach(function(t){typeLabel[t[0]]=t[1];});
  p.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><div class="muted" style="font-size:13px;">These questions are asked to every new lead right after they sign up, before they reach their home screen.</div><button class="btn btn-p" onclick="editQ()"><span class="material-icons" style="font-size:16px;">add</span> Add question</button></div>'
    +(qs.length?qs.map(function(q,i){
      return '<div class="card"><div class="q-row"><span class="muted" style="font-weight:800;width:22px;">'+(i+1)+'</span>'
        +'<div style="flex:1;"><div style="font-weight:700;font-size:14px;">'+esc(q.question)+(q.required?' <span class="req">Required</span>':'')+(q.is_active?'':' <span class="req" style="background:#f1f5f9;color:#64748b;">Hidden</span>')+'</div>'
        +'<div style="margin-top:4px;"><span class="q-type">'+esc(typeLabel[q.type]||q.type)+'</span>'+((q.options&&q.options.length)?' <span class="muted" style="font-size:11.5px;">'+q.options.map(esc).join(' · ')+'</span>':'')+'</div>'
        +(q.help_text?'<div class="muted" style="font-size:11.5px;margin-top:2px;">'+esc(q.help_text)+'</div>':'')+'</div>'
        +'<span class="material-icons icon" title="Move up" onclick="moveQ('+i+',-1)">arrow_upward</span>'
        +'<span class="material-icons icon" title="Move down" onclick="moveQ('+i+',1)">arrow_downward</span>'
        +'<span class="material-icons icon" title="Edit" onclick="editQ(\''+q.id+'\')">edit</span>'
        +'<span class="material-icons icon" style="color:#dc2626;" title="Delete" onclick="delQ(\''+q.id+'\')">delete</span>'
        +'</div></div>';
    }).join(''):'<div class="empty">No questions yet. Add your first onboarding question.</div>');
  window._qs=qs;
}
window.editQ=async function(id){
  var q=id?(window._qs||[]).find(function(x){return x.id===id;}):{question:'',type:'short_text',options:[],required:false,is_active:true};
  var res=await Swal.fire({title:id?'Edit question':'Add question',width:560,html:
    '<div style="text-align:left;">'
    +'<label style="font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;">Question</label><input id="q-text" class="swal2-input" style="margin:0;width:100%;" value="'+esc(q.question||'')+'">'
    +'<label style="font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;margin-top:10px;display:block;">Help text (optional)</label><input id="q-help" class="swal2-input" style="margin:0;width:100%;" value="'+esc(q.help_text||'')+'">'
    +'<label style="font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;margin-top:10px;display:block;">Answer type</label><select id="q-type" class="swal2-input" style="margin:0;width:100%;" onchange="onQType(this.value)">'+TYPES.map(function(t){return '<option value="'+t[0]+'"'+(q.type===t[0]?' selected':'')+'>'+t[1]+'</option>';}).join('')+'</select>'
    +'<div id="q-optwrap" style="display:'+((['multiple_choice','checkboxes','dropdown'].indexOf(q.type)>-1)?'block':'none')+';"><label style="font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;margin-top:10px;display:block;">Options</label><div id="q-optlist"></div><button type="button" onclick="optAdd()" style="margin-top:4px;border:1px dashed #cbd5e1;background:#f8fafc;color:#2563eb;border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;"><span class="material-icons" style="font-size:15px;">add</span> Add option</button></div>'
    +'<label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;cursor:pointer;"><input type="checkbox" id="q-req" style="width:auto;" '+(q.required?'checked':'')+'> Required</label>'
    +'<label style="display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;cursor:pointer;"><input type="checkbox" id="q-active" style="width:auto;" '+(q.is_active!==false?'checked':'')+'> Active (shown to leads)</label>'
    +'</div>',
    showCancelButton:true,confirmButtonText:'Save',confirmButtonColor:'#2563eb',
    didOpen:function(){ var opts=(q.options||[]); if(opts.length){ opts.forEach(function(o){optAdd(o);}); } else if(['multiple_choice','checkboxes','dropdown'].indexOf(q.type)>-1){ optAdd(); optAdd(); } },
    preConfirm:function(){ var t=document.getElementById('q-text').value.trim(); if(!t){Swal.showValidationMessage('Question required');return false;} var type=document.getElementById('q-type').value; var opts=Array.prototype.map.call(document.querySelectorAll('#q-optlist .opt-inp'),function(e){return e.value.trim();}).filter(Boolean); if(['multiple_choice','checkboxes','dropdown'].indexOf(type)>-1 && opts.length<2){Swal.showValidationMessage('Add at least 2 options');return false;} return {question:t,help_text:document.getElementById('q-help').value.trim(),type:type,options:opts,required:document.getElementById('q-req').checked,is_active:document.getElementById('q-active').checked}; }});
  if(!res.isConfirmed) return;
  var r=await api(Object.assign({action:'save_question',id:id||undefined},res.value));
  if(r.success) loadSurvey(); else Swal.fire('Error',r.message||'','error');
};
window.optAdd=function(v){
  var l=document.getElementById('q-optlist'); if(!l) return;
  var d=document.createElement('div'); d.style.cssText='display:flex;gap:6px;margin-bottom:6px;align-items:center;';
  d.innerHTML='<span class="material-icons" style="color:#cbd5e1;font-size:18px;">radio_button_unchecked</span><input class="opt-inp" style="flex:1;padding:9px 11px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:inherit;" placeholder="Option text"><button type="button" class="material-icons" title="Remove" style="border:none;background:none;color:#dc2626;cursor:pointer;font-size:18px;" onclick="this.parentNode.remove()">close</button>';
  l.appendChild(d);
  if(typeof v==='string'){ d.querySelector('input').value=v; } else { d.querySelector('input').focus(); }
};
window.onQType=function(t){
  var choice=['multiple_choice','checkboxes','dropdown'].indexOf(t)>-1;
  var w=document.getElementById('q-optwrap'); if(w) w.style.display=choice?'block':'none';
  if(choice && !document.querySelectorAll('#q-optlist .opt-inp').length){ optAdd(); optAdd(); }
};
window.delQ=async function(id){ var c=await Swal.fire({icon:'warning',title:'Delete question?',showCancelButton:true,confirmButtonColor:'#dc2626'}); if(!c.isConfirmed) return; await api({action:'delete_question',id:id}); loadSurvey(); };
window.moveQ=async function(i,dir){ var qs=window._qs||[]; var j=i+dir; if(j<0||j>=qs.length) return; var ids=qs.map(function(q){return q.id;}); var tmp=ids[i]; ids[i]=ids[j]; ids[j]=tmp; await api({action:'reorder_questions',ids:ids}); loadSurvey(); };

// ── Leads ──
var REPS=[];
function repName(uid){ var r=REPS.find(function(x){return x.userid===uid;}); return r?r.name:''; }
async function loadReps(){ if(REPS.length) return; try{ var r=await api({action:'list_reps'}); REPS=(r&&r.reps)||[]; }catch(e){} }
async function loadLeads(){
  var p=document.getElementById('panel'); p.innerHTML='<div class="empty">Loading…</div>';
  await loadReps();
  var r=await api({action:'list_leads'});
  if(!r.success){ p.innerHTML='<div class="empty" style="color:#9a3412;">'+esc(r.message||'Failed')+'</div>'; return; }
  var s=r.stats||{}, leads=r.leads||[];
  var rows=leads.length?leads.map(function(l){
    var ob=l.status==='converted'?'<span class="pill conv">Converted</span>':(l.onboarding_completed?'<span class="pill done">Onboarded</span>':'<span class="pill pend">Pending</span>');
    var rep=l.assigned_rep?esc(repName(l.assigned_rep)||'Assigned'):'<span class="muted">—</span>';
    return '<tr class="lead-row" onclick="leadDetail(\''+l.id+'\')"><td><b>'+esc(l.full_name||'—')+'</b></td><td class="muted">'+esc(l.email||'')+'</td><td class="muted">'+esc(l.phone||'')+'</td><td>'+ob+'</td><td>'+rep+'</td><td class="muted">'+esc(l.source||'')+'</td><td class="muted" style="white-space:nowrap;">'+(l.created_at?new Date(l.created_at).toLocaleDateString():'')+'</td></tr>';
  }).join(''):'<tr><td colspan="7" class="empty">No leads have signed up yet.</td></tr>';
  p.innerHTML='<div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;flex-wrap:wrap;">'
    +'<button class="btn btn-n" onclick="addFromGhl()"><span class="material-icons" style="font-size:16px;">person_add</span> Add from HighLevel</button>'
    +'<button class="btn btn-p" onclick="importGhl(this)"><span class="material-icons" style="font-size:16px;">cloud_download</span> Sync from HighLevel</button></div>'
    +'<div class="statgrid">'
    +'<div class="stat"><div class="n">'+(s.total||0)+'</div><div class="l">Total leads</div></div>'
    +'<div class="stat"><div class="n" style="color:var(--green);">'+(s.onboarded||0)+'</div><div class="l">Onboarded</div></div>'
    +'<div class="stat"><div class="n" style="color:#b45309;">'+(s.pending||0)+'</div><div class="l">Pending onboarding</div></div>'
    +'<div class="stat"><div class="n" style="color:var(--pri);">'+(s.converted||0)+'</div><div class="l">Converted to partner</div></div>'
    +'</div>'
    +'<table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Onboarding</th><th>Assigned rep</th><th>Source</th><th>Signed up</th></tr></thead><tbody>'+rows+'</tbody></table>';
}
var _aglPicked=null, _aglTimer=null;
window.aglPick=function(i){
  var c=(window._aglResults||[])[i]; if(!c) return; _aglPicked=c;
  var box=document.getElementById('agl-results'); if(box) box.style.display='none';
  document.getElementById('agl-q').value=c.name||c.email||c.id;
  var sel=document.getElementById('agl-selected');
  sel.style.display='block';
  sel.innerHTML='<div style="display:flex;align-items:center;gap:8px;"><span class="material-icons" style="color:#16a34a;font-size:18px;">check_circle</span><div><div style="font-weight:800;">'+esc(c.name||'(no name)')+'</div><div class="muted" style="font-size:11.5px;">'+esc(c.email||'')+(c.company?' · '+esc(c.company):'')+(c.phone?' · '+esc(c.phone):'')+'</div></div><span class="material-icons" style="margin-left:auto;color:#94a3b8;cursor:pointer;" onclick="aglClear()">close</span></div>';
};
window.aglClear=function(){ _aglPicked=null; var s=document.getElementById('agl-selected'); if(s){s.style.display='none';s.innerHTML='';} };
window.addFromGhl=async function(){
  _aglPicked=null;
  var res=await Swal.fire({title:'Add prospect from HighLevel',width:500,html:'<div style="text-align:left;">'
    +'<label style="font-size:12px;font-weight:700;color:#475569;">Search HighLevel</label>'
    +'<input id="agl-q" class="swal2-input" style="margin:6px 0 0;width:100%;" placeholder="Name, email, business, or contact ID…" autocomplete="off">'
    +'<div id="agl-results" style="display:none;border:1px solid #e2e8f0;border-radius:9px;margin-top:4px;max-height:230px;overflow:auto;"></div>'
    +'<div id="agl-selected" style="display:none;margin-top:8px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:9px;padding:9px 11px;font-size:13px;"></div>'
    +'<div class="muted" style="font-size:11.5px;margin-top:6px;">Pick a contact, or just type an email to add one that isn\'t in HighLevel yet.</div>'
    +'<label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;cursor:pointer;"><input type="checkbox" id="agl-invite" style="width:auto;"> Also send account-setup invite</label>'
    +'</div>',
    showCancelButton:true,confirmButtonText:'Add prospect',confirmButtonColor:'#2563eb',
    didOpen:function(){
      var q=document.getElementById('agl-q'); var box=document.getElementById('agl-results');
      q.addEventListener('input',function(){
        _aglPicked=null; var s=document.getElementById('agl-selected'); if(s){s.style.display='none';}
        var term=q.value.trim();
        if(_aglTimer) clearTimeout(_aglTimer);
        if(term.length<2){ box.style.display='none'; return; }
        _aglTimer=setTimeout(function(){
          box.style.display='block'; box.innerHTML='<div class="muted" style="padding:9px 11px;font-size:12px;">Searching…</div>';
          api({action:'ghl_contact_search',query:term}).then(function(r){
            var list=(r&&r.contacts)||[]; window._aglResults=list;
            if(!list.length){ box.innerHTML='<div class="muted" style="padding:9px 11px;font-size:12px;">No matches. Type a full email to add manually.</div>'; return; }
            box.innerHTML=list.map(function(c,i){ return '<div onclick="aglPick('+i+')" style="padding:9px 11px;cursor:pointer;border-bottom:1px solid #f1f5f9;font-size:13px;"><div style="font-weight:700;">'+esc(c.name||'(no name)')+'</div><div class="muted" style="font-size:11.5px;">'+esc(c.email||'')+(c.company?' · '+esc(c.company):'')+(c.phone?' · '+esc(c.phone):'')+'</div></div>'; }).join('');
          }).catch(function(){ box.innerHTML='<div class="muted" style="padding:9px 11px;font-size:12px;color:#b45309;">Search failed.</div>'; });
        },300);
      });
    },
    preConfirm:function(){
      if(_aglPicked && _aglPicked.email) return {contact:_aglPicked,invite:document.getElementById('agl-invite').checked};
      var typed=(document.getElementById('agl-q').value||'').trim();
      if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(typed)) return {email:typed,invite:document.getElementById('agl-invite').checked};
      if(_aglPicked && !_aglPicked.email){ Swal.showValidationMessage('That contact has no email — can\'t create a portal account.'); return false; }
      Swal.showValidationMessage('Pick a contact or type a valid email'); return false;
    }});
  if(!res.isConfirmed) return;
  Swal.fire({title:'Adding…',didOpen:function(){Swal.showLoading();},allowOutsideClick:false});
  var r=await api(Object.assign({action:'create_lead_from_ghl'},res.value));
  if(!r||!r.success){ Swal.fire('Error',(r&&r.message)||'Could not add','error'); return; }
  await Swal.fire({icon:'success',title:r.created?'Prospect added':'Prospect updated',html:(r.ghl_found?'Matched a HighLevel contact.':'No HighLevel match — created from the email.')+(r.invited?'<br>✉️ Setup invite sent.':''),confirmButtonColor:'#2563eb'});
  loadLeads();
};
window.importGhl=async function(btn){
  btn.disabled=true; var orig=btn.innerHTML; btn.innerHTML='<span class="material-icons" style="font-size:16px;">sync</span> Syncing…';
  var r=await api({action:'import_ghl_leads'});
  btn.disabled=false; btn.innerHTML=orig;
  if(!r||!r.success){ Swal.fire('Sync note',(r&&r.message)||'Could not sync from HighLevel.','warning'); return; }
  var d=r.diag||{};
  var foundNone=((r.created||0)+(r.updated||0)+(r.skipped||0))===0;
  var diagLine='<div style="color:#94a3b8;font-size:12px;margin-top:6px;">Tag: <b>'+esc(r.tag||'')+'</b> · matched '+(r.total||0)+' contact(s) · method: '+esc(d.method||'—')+' · scanned '+(d.scanned||0)+(d.error?' · <span style="color:#b45309;">'+esc(d.error)+'</span>':'')+'</div>';
  if(foundNone){
    await Swal.fire({icon:'info',title:'No contacts matched',html:'No HighLevel contacts were found with the tag <b>'+esc(r.tag||'')+'</b>.'
      +'<div style="text-align:left;font-size:12.5px;color:#475569;margin-top:10px;line-height:1.6;">Check that:<br>• the tag is spelled exactly as in HighLevel (case doesn\'t matter)<br>• the contact actually has that tag in the <b>PayProTec Partners</b> sub-account (GHL_LOCATION_ID)<br>• the API token has Contacts read permission</div>'+diagLine,confirmButtonColor:'#2563eb'});
    return;
  }
  await Swal.fire({icon:'success',title:'Sync complete',html:'<b>'+(r.created||0)+'</b> new · <b>'+(r.updated||0)+'</b> enriched'+(r.skipped?' · '+r.skipped+' unchanged':'')+(r.auto_invite?' · <b>'+(r.invited||0)+'</b> invited ✉️':'')+diagLine,confirmButtonColor:'#2563eb'});
  loadLeads();
};
window.leadDetail=async function(id){
  Swal.fire({title:'Loading…',didOpen:function(){Swal.showLoading();},allowOutsideClick:false});
  await loadReps();
  var r=await api({action:'lead_detail',lead_id:id});
  if(!r.success){ Swal.fire('Error',r.message||'','error'); return; }
  var l=r.lead, ans=r.answers||[], ghl=r.ghl, appts=r.appointments||[], ghlLink=r.ghl_link||'', activated=!!r.activated;
  function fmtA(a){ return Array.isArray(a.answer)?a.answer.map(esc).join(', '):esc(a.answer); }
  function fmtDt(s){ try{ return new Date(s).toLocaleString(); }catch(e){ return esc(s||''); } }
  // Assign-rep dropdown
  var repOpts='<option value="">— Unassigned —</option>'+REPS.map(function(rp){return '<option value="'+esc(rp.userid)+'"'+(l.assigned_rep===rp.userid?' selected':'')+'>'+esc(rp.name)+(rp.job_level?' · '+esc(rp.job_level):'')+'</option>';}).join('');
  // HighLevel block
  var ghlBlock='';
  if(ghl){ ghlBlock='<div style="font-weight:800;font-size:12px;text-transform:uppercase;color:#64748b;margin:14px 0 6px;">HighLevel</div>'
    +'<div style="font-size:13px;">Contact: <b>'+esc(ghl.name||'—')+'</b>'+(ghl.source?' · source: '+esc(ghl.source):'')+'</div>'
    +((ghl.tags&&ghl.tags.length)?'<div class="muted" style="font-size:11.5px;margin-top:3px;">Tags: '+ghl.tags.map(esc).join(', ')+'</div>':''); }
  else { ghlBlock='<div class="muted" style="font-size:12px;margin-top:12px;">No matching HighLevel contact found by email.</div>'; }
  // Appointments
  var apptBlock='<div style="font-weight:800;font-size:12px;text-transform:uppercase;color:#64748b;margin:14px 0 6px;">Appointments</div>'
    +(appts.length?appts.map(function(a){return '<div style="border-bottom:1px solid #f1f5f9;padding:7px 0;font-size:13px;"><div style="font-weight:700;">'+esc(a.title||'Appointment')+(a.status?' <span class="muted" style="font-weight:400;">('+esc(a.status)+')</span>':'')+'</div><div class="muted" style="font-size:11.5px;">'+fmtDt(a.start)+(a.calendar?' · '+esc(a.calendar):'')+'</div></div>';}).join(''):'<div class="muted" style="font-size:12.5px;">No appointments found in HighLevel.</div>');
  Swal.fire({title:esc(l.full_name||'Lead'),width:600,html:'<div style="text-align:left;">'
    +'<div class="muted" style="font-size:12.5px;">'+esc(l.email||'')+(l.phone?' · '+esc(l.phone):'')+'</div>'
    +'<div style="margin-top:6px;font-size:12px;">Status: <b>'+esc(l.status)+'</b> · Onboarding: <b>'+(l.onboarding_completed?'complete':'pending')+'</b> · Signed up '+(l.created_at?new Date(l.created_at).toLocaleString():'')+'</div>'
    +(ghlLink?'<div style="margin-top:10px;"><a href="'+esc(ghlLink)+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;background:#0f172a;color:#fff;text-decoration:none;padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:700;"><span class="material-icons" style="font-size:16px;">open_in_new</span> Open in HighLevel (PayProTec Partners)</a></div>':'')
    +'<div style="font-weight:800;font-size:12px;text-transform:uppercase;color:#64748b;margin:14px 0 6px;">Assigned rep</div>'
    +'<select id="ld-rep" onchange="assignRep(\''+l.id+'\',this.value)" style="width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;">'+repOpts+'</select>'
    +'<div id="ld-rep-note" class="muted" style="font-size:11.5px;margin-top:4px;"></div>'
    +ghlBlock
    +apptBlock
    +'<div style="font-weight:800;font-size:12px;text-transform:uppercase;color:#64748b;margin:14px 0 6px;">Onboarding answers</div>'
    +(ans.length?ans.map(function(a){return '<div style="border-bottom:1px solid #f1f5f9;padding:7px 0;font-size:13px;"><div class="muted" style="font-size:11.5px;">'+esc(a.question)+'</div><div style="font-weight:600;">'+fmtA(a)+'</div></div>';}).join(''):'<div class="muted" style="font-size:12.5px;">No answers yet.</div>')
    +'<div style="border-top:1px solid #f1f5f9;margin-top:16px;padding-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">'
      +(activated
          ? '<span style="display:inline-flex;align-items:center;gap:6px;background:#dcfce7;color:#166534;border-radius:9px;padding:9px 14px;font-size:12.5px;font-weight:700;"><span class="material-icons" style="font-size:16px;">verified_user</span> Active portal account</span>'
          : '<button onclick="sendInvite(\''+l.id+'\')" style="display:inline-flex;align-items:center;gap:6px;background:#f0fdfa;color:#0f766e;border:1px solid #99f6e4;border-radius:9px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;"><span class="material-icons" style="font-size:16px;">mail</span> Send account-setup invite</button>')
      +(canDeleteLead()?'<button onclick="deleteLead(\''+l.id+'\',\''+esc((l.full_name||l.email||"this prospect").replace(/\x27/g,""))+'\')" style="display:inline-flex;align-items:center;gap:6px;background:#fee2e2;color:#991b1b;border:1px solid #fecaca;border-radius:9px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;"><span class="material-icons" style="font-size:16px;">person_remove</span> Delete & revoke access</button>':'')
    +'</div>'
    +'</div>',confirmButtonText:'Close',confirmButtonColor:'#64748b'});
};
function canDeleteLead(){ var r=(localStorage.getItem('pp_role')||'').toLowerCase(); return localStorage.getItem('pp_access_delete_leads')==='true' || r.indexOf('super')>-1 || r==='admin' || r==='operations admin'; }
window.sendInvite=async function(id){
  var c=await Swal.fire({icon:'question',title:'Send setup invite?',text:'Emails this prospect a link to set a password and access the portal.',showCancelButton:true,confirmButtonText:'Send invite',confirmButtonColor:'#0d9488'});
  if(!c.isConfirmed) return;
  var r=await api({action:'send_lead_invite',lead_id:id});
  if(r&&r.success&&r.sent) Swal.fire({icon:'success',title:'Invite sent',timer:1300,showConfirmButton:false});
  else Swal.fire('Note',(r&&r.success)?'Saved, but email could not be sent (check Postmark config).':((r&&r.message)||'Could not send'),'warning');
};
window.deleteLead=async function(id,name){
  var c=await Swal.fire({icon:'warning',title:'Delete prospect?',html:'This permanently deletes <b>'+esc(name)+'</b> and revokes their Lead Portal access. This cannot be undone.',showCancelButton:true,confirmButtonText:'Delete',confirmButtonColor:'#dc2626'});
  if(!c.isConfirmed) return;
  var r=await api({action:'delete_lead',lead_id:id});
  if(r&&r.success){ Swal.fire({icon:'success',title:'Deleted',timer:1200,showConfirmButton:false}); loadLeads(); }
  else Swal.fire('Error',(r&&r.message)||'Could not delete','error');
};
window.assignRep=async function(leadId,uid){
  var note=document.getElementById('ld-rep-note'); if(note) note.textContent='Saving…';
  var r=await api({action:'set_lead_rep',lead_id:leadId,rep_userid:uid||null});
  if(note) note.textContent=(r&&r.success)?'✓ Saved':'Could not save';
};

(async function(){
  var chk=await api({action:'can_access'});
  if(chk&&chk.success){ shell(); }
  else { document.getElementById('wrap').innerHTML='<div class="card"><div class="empty"><span class="material-icons" style="font-size:48px;color:#cbd5e1;">lock</span><div style="font-weight:800;margin-top:8px;">You don\'t have Lead Portal access</div><div class="muted" style="margin-top:4px;">Ask an admin to enable the “Lead Portal” permission in User Management.</div></div></div>'; }
})();
</script>
</body>
</html>
