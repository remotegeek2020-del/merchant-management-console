<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prospects | PayProTec</title>
<link rel="icon" href="/api/favicon" />
<script src="js/access-guard.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;}
  :root{--navy:#002d5a;--blue:#0f4c81;--teal:#0d9488;--teal-dark:#0f766e;--teal-bg:#f0fdfa;--border:#e6ebf2;--muted:#94a3b8;--secondary:#475569;--surface:#eef2f7;--shadow:0 1px 3px rgba(16,42,76,.06);--shadow-md:0 8px 24px rgba(16,42,76,.08);}
  body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:var(--surface);color:#0a1628;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1120px;margin:0 auto;padding:18px;}
  /* Header (hero) */
  .modern-header{background:linear-gradient(135deg,#001e3c 0%,#0f3460 60%,#0d9488 150%);border-radius:16px;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;box-shadow:var(--shadow-md);color:#fff;}
  .h-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .backbtn{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:8px 12px;font-size:12px;font-weight:800;color:#fff;cursor:pointer;font-family:inherit;text-decoration:none;}
  .backbtn:hover{background:rgba(255,255,255,.24);}
  .h-title h1{font-size:1.5rem;font-weight:800;margin:0;letter-spacing:-.3px;}
  .h-title p{margin:2px 0 0;font-size:12.5px;opacity:.85;}
  .search-wrap{position:relative;min-width:250px;flex:1;max-width:340px;}
  .search-wrap .material-icons{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:19px;}
  .search-wrap input{width:100%;padding:11px 12px 11px 38px;border:none;border-radius:11px;font-size:13.5px;font-family:inherit;outline:none;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);}
  /* Stats */
  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0;}
  @media(max-width:680px){.statgrid{grid-template-columns:1fr 1fr;}}
  .stat{background:#fff;border:1px solid var(--border);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:13px;}
  .stat .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;}
  .stat .n{font-size:1.6rem;font-weight:800;line-height:1;}
  .stat .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:4px;}
  /* Table card */
  .card{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;}
  .card-h{padding:14px 18px;border-bottom:1px solid var(--border);font-size:13px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{background:#f8fafc;padding:11px 18px;text-align:left;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody tr{border-bottom:1px solid #f1f5f9;cursor:pointer;transition:background .12s;}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:#f6fbfa;}
  tbody td{padding:12px 18px;vertical-align:middle;}
  .who{display:flex;align-items:center;gap:12px;min-width:0;}
  .av{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;}
  .who .nm{font-weight:700;line-height:1.2;}
  .who .em{font-size:12px;color:var(--muted);margin-top:1px;}
  .pill{font-size:10px;font-weight:800;padding:3px 10px;border-radius:99px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;}
  .pill.done{background:#dcfce7;color:#166534;}.pill.pend{background:#fef3c7;color:#92400e;}.pill.conv{background:#ede9fe;color:#6d28d9;}
  .repchip{display:inline-flex;align-items:center;gap:6px;background:var(--teal-bg);border:1px solid #99f6e4;color:var(--teal-dark);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;}
  .muted{color:var(--muted);}
  .empty{padding:44px;text-align:center;color:var(--muted);}
  .empty .material-icons{font-size:44px;opacity:.35;display:block;margin-bottom:8px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  /* Detail modal */
  .pv-hd{display:flex;align-items:center;gap:14px;text-align:left;margin-bottom:4px;}
  .pv-hd .av{width:52px;height:52px;font-size:18px;}
  .pv-hd .nm{font-size:17px;font-weight:800;color:var(--navy);}
  .pv-sec{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:16px 0 8px;text-align:left;}
  .pv-line{text-align:left;font-size:13px;color:var(--secondary);}
  .pv-appt{display:flex;gap:11px;align-items:center;text-align:left;border:1px solid var(--border);border-radius:11px;padding:10px 12px;margin-bottom:7px;}
  .pv-appt .ai{width:36px;height:36px;border-radius:9px;background:var(--teal-bg);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;flex:none;}
  .pv-ans{text-align:left;border-bottom:1px solid #f1f5f9;padding:8px 0;font-size:13px;}
  .pv-sel{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:11px;font-size:13.5px;font-family:inherit;background:#fff;}
  .pv-hl{display:inline-flex;align-items:center;gap:6px;background:#0f172a;color:#fff;text-decoration:none;padding:9px 15px;border-radius:10px;font-size:12.5px;font-weight:700;}
  /* Graduation modal */
  .grad-overlay{position:fixed;inset:0;background:rgba(2,10,25,.6);backdrop-filter:blur(2px);z-index:1000;display:none;align-items:center;justify-content:center;padding:18px;}
  .grad-card{background:#fff;border-radius:18px;width:100%;max-width:560px;max-height:94vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.3);}
  .grad-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 22px;background:linear-gradient(135deg,#001e3c,#0f3460 60%,#0d9488 150%);color:#fff;}
  .grad-title{font-size:16px;font-weight:800;}
  .grad-head .muted{color:rgba(255,255,255,.85)!important;}
  .grad-body{padding:18px 22px;overflow-y:auto;}
  .grad-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--border);}
  .gl{display:block;font-size:11px;font-weight:800;color:var(--secondary);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 5px;}
  .gl:first-child{margin-top:0;}
  .gi{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:13.5px;font-family:inherit;outline:none;}
  .gi:focus{border-color:var(--teal);}
  .gchk{display:flex;align-items:center;gap:9px;cursor:pointer;margin-top:14px;padding:10px 13px;background:#f0f7ff;border:1px solid #bfdbfe;border-radius:10px;font-size:13px;font-weight:700;color:#004990;}
  .grad-sugg{position:absolute;left:0;right:0;top:100%;background:#fff;border:1.5px solid var(--border);border-radius:10px;z-index:20;max-height:210px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.12);margin-top:3px;}
  .grad-sugg .row{padding:10px 13px;cursor:pointer;border-bottom:1px solid #f1f5f9;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .grad-sugg .row:hover{background:#f6fbfa;}
  .grad-sec{font-size:11px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;margin:18px 0 8px;}
  .gbtn{background:var(--blue);color:#fff;border:none;border-radius:9px;padding:0 16px;height:42px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .grad-idlist{margin-top:12px;display:flex;flex-direction:column;gap:6px;min-height:56px;padding:10px;background:#fff;border:1px dashed #cbd5e1;border-radius:10px;}
  .gidrow{display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:13px;}
  .gidrow .rm{margin-left:auto;color:#dc2626;cursor:pointer;font-size:18px;}
  .gbtn-ghost{background:#fff;border:1px solid var(--border);color:var(--secondary);border-radius:10px;padding:11px 18px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;}
  .gbtn-go{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,#0d9488,#0f766e);color:#fff;border:none;border-radius:10px;padding:11px 20px;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit;}
  .grad-rep{background:#f0fdfa;border:1px solid #99f6e4;border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--teal-dark);margin-top:10px;font-family:'DM Mono',ui-monospace,monospace;word-break:break-all;}
</style>
</head>
<body>
<div class="wrap">
  <div class="modern-header">
    <div class="h-left">
      <a class="backbtn" href="/partners-dashboard"><span class="material-icons" style="font-size:15px;">arrow_back</span> BACK</a>
      <div class="h-title"><h1>Prospects</h1><p>Potential partners from the Lead Portal</p></div>
    </div>
    <div class="search-wrap">
      <span class="material-icons">search</span>
      <input id="q" placeholder="Search by name or email…" oninput="renderProspects()">
    </div>
  </div>

  <div class="statgrid">
    <div class="stat"><div class="ic" style="background:#dbeafe;color:#0369a1;"><span class="material-icons">groups</span></div><div><div class="n" id="s-total">—</div><div class="l">Total prospects</div></div></div>
    <div class="stat"><div class="ic" style="background:#dcfce7;color:#166534;"><span class="material-icons">how_to_reg</span></div><div><div class="n" id="s-onb" style="color:#16a34a;">—</div><div class="l">Onboarded</div></div></div>
    <div class="stat"><div class="ic" style="background:#fef3c7;color:#b45309;"><span class="material-icons">schedule</span></div><div><div class="n" id="s-pend" style="color:#b45309;">—</div><div class="l">Pending</div></div></div>
    <div class="stat"><div class="ic" style="background:#ede9fe;color:#6d28d9;"><span class="material-icons">workspace_premium</span></div><div><div class="n" id="s-conv" style="color:#6d28d9;">—</div><div class="l">Converted</div></div></div>
  </div>

  <div class="card">
    <div class="card-h"><span class="material-icons" style="font-size:16px;color:var(--teal);">person_search</span> All prospects <span id="cnt" class="muted" style="font-weight:700;"></span></div>
    <div id="list"><div class="empty"><span class="material-icons" style="animation:spin 1s linear infinite;">sync</span> Loading…</div></div>
  </div>
</div>

<!-- Graduation modal (reverse onboarding, on this screen) -->
<div class="grad-overlay" id="gradModal" onclick="if(event.target===this)closeGraduate()">
  <div class="grad-card">
    <div class="grad-head">
      <div><div class="grad-title">🎓 Graduate → Partner</div><div class="muted" id="gWho" style="font-size:12.5px;"></div></div>
      <span class="material-icons" style="cursor:pointer;" onclick="closeGraduate()">close</span>
    </div>
    <div class="grad-body">
      <label class="gl">Partner Activation Date</label>
      <input type="date" id="gActivation" class="gi">
      <label class="gl">Company / Firm</label>
      <div style="position:relative;">
        <input type="text" id="gCompany" class="gi" placeholder="Search a company, type to create, or leave blank for Independent" autocomplete="off" oninput="gCompanyInput()" onfocus="gCompanyInput()" onblur="setTimeout(function(){var b=document.getElementById('gCompanyBox');if(b)b.style.display='none';},180)">
        <div id="gCompanyBox" class="grad-sugg" style="display:none;"></div>
      </div>
      <div id="gCompanySel" style="display:none;margin-top:7px;font-size:12.5px;font-weight:700;color:var(--teal-dark);"></div>
      <label class="gchk"><input type="checkbox" id="gBranded" style="width:16px;height:16px;accent-color:#004990;"> 🏷️ Branded Partner</label>

      <div class="grad-sec">Partner IDs</div>
      <div style="background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:12px;">
        <div style="position:relative;">
          <input type="text" id="gIdInput" class="gi" placeholder="Search unassigned IDs or enter a new ID…" autocomplete="off" oninput="gIdSearch()">
          <div id="gIdResults" class="grad-sugg" style="display:none;"></div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:8px;">
          <input type="number" id="gRev" class="gi" placeholder="Rev share (number only)" style="flex:1;" inputmode="numeric">
          <label style="display:flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:#64748b;white-space:nowrap;"><input type="checkbox" id="gPrime" onchange="if(this.checked&&!document.getElementById('gRev').value)document.getElementById('gRev').value='50';"> PRIME ⭐</label>
          <button class="gbtn" onclick="gAddId()">ADD</button>
        </div>
      </div>
      <div id="gIdList" class="grad-idlist"><div class="muted" style="font-size:11.5px;text-align:center;padding:14px 0;">No IDs added yet</div></div>
      <div id="gRepPreview"></div>
    </div>
    <div class="grad-foot">
      <button class="gbtn-ghost" onclick="closeGraduate()">Cancel</button>
      <button class="gbtn-go" id="gSubmit" onclick="submitGraduation()"><span class="material-icons" style="font-size:18px;">military_tech</span> Complete Graduation</button>
    </div>
  </div>
</div>

<script>window.NAV_SHORTCUT_PAGE='leads';</script>
<script>
var PROSPECTS=[], REPS=[], REPMAP={};
function lpApi(b){ return fetch('/api/lead-portal',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(localStorage.getItem('pp_session_token')||'')},body:JSON.stringify(b)}).then(function(r){return r.json();}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);}); }
function initials(n){ return String(n||'?').trim().split(/\s+/).map(function(w){return w[0];}).join('').toUpperCase().slice(0,2)||'?'; }
var AVC=['#0369a1','#0d9488','#7c3aed','#b45309','#be185d','#166534','#0f4c81','#9333ea'];
function avColor(s){ var h=0; s=String(s||''); for(var i=0;i<s.length;i++) h=s.charCodeAt(i)+((h<<5)-h); return AVC[Math.abs(h)%AVC.length]; }
function repName(uid){ return REPMAP[uid]||''; }
async function load(){
  try{ var rr=await lpApi({action:'list_reps'}); REPS=(rr.reps||[]); REPS.forEach(function(r){ REPMAP[r.userid]=r.name; }); }catch(e){}
  var r=await lpApi({action:'list_leads'});
  if(!r.success){ document.getElementById('list').innerHTML='<div class="empty" style="color:#b45309;">'+esc(r.message||'Failed to load')+'</div>'; return; }
  PROSPECTS=r.leads||[];
  var s=r.stats||{};
  document.getElementById('s-total').textContent=s.total!=null?s.total:PROSPECTS.length;
  document.getElementById('s-onb').textContent=s.onboarded||0;
  document.getElementById('s-pend').textContent=s.pending||0;
  document.getElementById('s-conv').textContent=s.converted||0;
  renderProspects();
}
function statusPill(l){ return l.status==='converted'?'<span class="pill conv">Converted</span>':(l.onboarding_completed?'<span class="pill done">Onboarded</span>':'<span class="pill pend">Pending</span>'); }
window.renderProspects=function(){
  var q=(document.getElementById('q').value||'').toLowerCase();
  var list=PROSPECTS.filter(function(l){ return !q||(l.full_name||'').toLowerCase().indexOf(q)>-1||(l.email||'').toLowerCase().indexOf(q)>-1; });
  document.getElementById('cnt').textContent='· '+list.length;
  if(!list.length){ document.getElementById('list').innerHTML='<div class="empty"><span class="material-icons">person_off</span>No prospects'+(q?' match your search':' yet')+'.</div>'; return; }
  document.getElementById('list').innerHTML='<div style="overflow-x:auto;"><table><thead><tr><th>Prospect</th><th>Status</th><th>Assigned rep</th><th>Signed up</th></tr></thead><tbody>'
    +list.map(function(l){
      var nm=l.full_name||'—';
      var rep=l.assigned_rep?'<span class="repchip"><span class="material-icons" style="font-size:13px;">support_agent</span>'+esc(repName(l.assigned_rep)||'Assigned')+'</span>':'<span class="muted">—</span>';
      return '<tr onclick="viewProspect(\''+l.id+'\')">'
        +'<td><div class="who"><div class="av" style="background:'+avColor(l.email||nm)+';">'+esc(initials(nm))+'</div><div><div class="nm">'+esc(nm)+'</div><div class="em">'+esc(l.email||'')+'</div></div></div></td>'
        +'<td>'+statusPill(l)+'</td>'
        +'<td>'+rep+'</td>'
        +'<td class="muted" style="white-space:nowrap;">'+(l.created_at?new Date(l.created_at).toLocaleDateString():'')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
};
window.viewProspect=async function(id){
  Swal.fire({title:'Loading…',didOpen:function(){Swal.showLoading();},allowOutsideClick:false});
  var r=await lpApi({action:'lead_detail',lead_id:id});
  if(!r.success){ Swal.fire('Error',r.message||'','error'); return; }
  var l=r.lead, ans=r.answers||[], ghl=r.ghl, appts=r.appointments||[], rep=r.rep, ghlLink=r.ghl_link||'';
  function dt(s){ try{ return new Date(s).toLocaleString(); }catch(e){ return esc(s||''); } }
  function fmtA(a){ return Array.isArray(a.answer)?a.answer.map(esc).join(', '):esc(a.answer); }
  var nm=l.full_name||'Prospect';
  var repOpts='<option value="">— Unassigned —</option>'+REPS.map(function(rp){return '<option value="'+esc(rp.userid)+'"'+(l.assigned_rep===rp.userid?' selected':'')+'>'+esc(rp.name)+(rp.job_level?' · '+esc(rp.job_level):'')+'</option>';}).join('');
  var html='<div>'
    +'<div class="pv-hd"><div class="av" style="background:'+avColor(l.email||nm)+';">'+esc(initials(nm))+'</div><div style="min-width:0;"><div class="nm">'+esc(nm)+'</div><div class="pv-line muted" style="font-size:12.5px;">'+esc(l.email||'')+(l.phone?' · '+esc(l.phone):'')+'</div><div style="margin-top:5px;">'+statusPill(l)+'</div></div></div>'
    +(l.status==='converted'
        ? '<div style="text-align:left;margin-top:12px;"><span class="pill conv"><span class="material-icons" style="font-size:13px;">verified</span> Already a partner</span></div>'
        : '<div style="margin-top:14px;"><button onclick="graduateProspect(\''+l.id+'\')" style="width:100%;background:linear-gradient(135deg,#0d9488,#0f766e);color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 16px rgba(13,148,136,.32);"><span class="material-icons" style="font-size:20px;">military_tech</span> Graduate — Become a Partner</button></div>')
    +(ghlLink?'<div style="text-align:left;margin-top:12px;"><a class="pv-hl" href="'+esc(ghlLink)+'" target="_blank" rel="noopener"><span class="material-icons" style="font-size:16px;">open_in_new</span> Open in HighLevel</a></div>':'')
    +'<div class="pv-sec">Assigned rep</div>'
    +'<select id="ld-rep" class="pv-sel" onchange="assignRep(\''+l.id+'\',this.value)">'+repOpts+'</select>'
    +'<div id="ld-rep-note" class="pv-line muted" style="font-size:11.5px;margin-top:5px;"></div>'
    +'<div class="pv-sec">Appointments</div>'
    +(appts.length?appts.map(function(a){return '<div class="pv-appt"><div class="ai"><span class="material-icons" style="font-size:18px;">event</span></div><div style="min-width:0;"><div style="font-weight:700;font-size:13px;">'+esc(a.title||'Appointment')+(a.status?' <span class="muted" style="font-weight:400;">('+esc(a.status)+')</span>':'')+'</div><div class="muted" style="font-size:11.5px;">'+dt(a.start)+(a.calendar?' · '+esc(a.calendar):'')+'</div></div></div>';}).join(''):'<div class="pv-line muted" style="font-size:12.5px;">No appointments found.</div>')
    +'<div class="pv-sec">Onboarding answers</div>'
    +(ans.length?ans.map(function(a){return '<div class="pv-ans"><div class="muted" style="font-size:11.5px;">'+esc(a.question)+'</div><div style="font-weight:600;">'+fmtA(a)+'</div></div>';}).join(''):'<div class="pv-line muted" style="font-size:12.5px;">No answers yet.</div>')
    +'<div style="border-top:1px solid #f1f5f9;margin-top:16px;padding-top:12px;display:flex;gap:8px;flex-wrap:wrap;">'
      +'<button onclick="sendInvite(\''+l.id+'\')" style="display:inline-flex;align-items:center;gap:6px;background:#f0fdfa;color:#0f766e;border:1px solid #99f6e4;border-radius:9px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;"><span class="material-icons" style="font-size:16px;">mail</span> Send account-setup invite</button>'
      +(canDeleteLead()?'<button onclick="deleteLead(\''+l.id+'\',\''+esc((l.full_name||l.email||"this prospect").replace(/\x27/g,""))+'\')" style="display:inline-flex;align-items:center;gap:6px;background:#fee2e2;color:#991b1b;border:1px solid #fecaca;border-radius:9px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;"><span class="material-icons" style="font-size:16px;">person_remove</span> Delete &amp; revoke access</button>':'')
    +'</div>'
    +'</div>';
  Swal.fire({html:html,width:560,showConfirmButton:true,confirmButtonText:'Close',confirmButtonColor:'#0f4c81'});
};
function canDeleteLead(){ var r=(localStorage.getItem('pp_role')||'').toLowerCase(); return localStorage.getItem('pp_access_delete_leads')==='true' || r.indexOf('super')>-1 || r==='admin' || r==='operations admin'; }
window.sendInvite=async function(id){
  var c=await Swal.fire({icon:'question',title:'Send setup invite?',text:'Emails this prospect a link to set a password and access the portal.',showCancelButton:true,confirmButtonText:'Send invite',confirmButtonColor:'#0d9488'});
  if(!c.isConfirmed) return;
  var r=await lpApi({action:'send_lead_invite',lead_id:id});
  if(r&&r.success&&r.sent) Swal.fire({icon:'success',title:'Invite sent',timer:1300,showConfirmButton:false});
  else Swal.fire('Note',(r&&r.success)?'Saved, but email could not be sent (check Postmark config).':((r&&r.message)||'Could not send'),'warning');
};
window.deleteLead=async function(id,name){
  var c=await Swal.fire({icon:'warning',title:'Delete prospect?',html:'This permanently deletes <b>'+esc(name)+'</b> and revokes their Lead Portal access. This cannot be undone.',showCancelButton:true,confirmButtonText:'Delete',confirmButtonColor:'#dc2626'});
  if(!c.isConfirmed) return;
  var r=await lpApi({action:'delete_lead',lead_id:id});
  if(r&&r.success){ Swal.fire({icon:'success',title:'Deleted',timer:1200,showConfirmButton:false}); load(); }
  else Swal.fire('Error',(r&&r.message)||'Could not delete','error');
};
// ── Graduation (reverse onboarding, on this screen) ──────────────────────────
var G_LEAD=null, G_COMPANIES=null, G_COID=null, G_CONAME=null, G_INDEP=false, G_IDS=[];
function partnersApi(b){ return fetch('/api/partners',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(localStorage.getItem('pp_session_token')||'')},body:JSON.stringify(b)}).then(function(r){return r.json();}); }
window.graduateProspect=async function(id){
  var l=PROSPECTS.find(function(x){return x.id===id;});
  if(!l){ var r=await lpApi({action:'lead_detail',lead_id:id}); l=r&&r.lead; }
  if(!l) return;
  Swal.close();
  G_LEAD=l; G_COID=null; G_CONAME=null; G_INDEP=false; G_IDS=[];
  document.getElementById('gWho').textContent=(l.full_name||'')+(l.email?' · '+l.email:'');
  document.getElementById('gActivation').value=new Date().toISOString().slice(0,10);
  document.getElementById('gCompany').value=''; document.getElementById('gCompanySel').style.display='none';
  document.getElementById('gBranded').checked=false;
  document.getElementById('gIdInput').value=''; document.getElementById('gRev').value=''; document.getElementById('gPrime').checked=false;
  renderGIds();
  document.getElementById('gradModal').style.display='flex';
  if(!G_COMPANIES){ try{ var pr=await partnersApi({action:'get_partners_list'}); G_COMPANIES=(pr&&pr.data&&pr.data.companies)||[]; }catch(e){ G_COMPANIES=[]; } }
};
window.closeGraduate=function(){ document.getElementById('gradModal').style.display='none'; G_LEAD=null; };
window.gCompanyInput=function(){
  var t=(document.getElementById('gCompany').value||'').trim().toLowerCase();
  // typing = clear a prior selection (they're choosing/creating)
  G_COID=null; G_INDEP=false; document.getElementById('gCompanySel').style.display='none';
  var box=document.getElementById('gCompanyBox');
  var list=(G_COMPANIES||[]).filter(function(c){ return !t || (c.company_name||'').toLowerCase().indexOf(t)>-1; }).slice(0,30);
  var html='';
  html+='<div class="row" onmousedown="pickIndependent()"><span class="material-icons" style="font-size:16px;color:#94a3b8;">person</span> Independent (no company)</div>';
  list.forEach(function(c){ html+='<div class="row" onmousedown="pickGCompany(\''+c.id+'\',\''+esc((c.company_name||'').replace(/\x27/g,"")) +'\')"><span class="material-icons" style="font-size:16px;color:var(--blue);">business</span> '+esc(c.company_name||'')+'</div>'; });
  var exact=(G_COMPANIES||[]).some(function(c){return (c.company_name||'').toLowerCase()===t;});
  if(t && !exact){ html+='<div class="row" onmousedown="createGCompany()"><span class="material-icons" style="font-size:16px;color:#16a34a;">add_circle</span> Create new: <b style="margin-left:3px;">'+esc(document.getElementById('gCompany').value.trim())+'</b></div>'; }
  box.innerHTML=html; box.style.display='block';
};
window.pickGCompany=function(id,name){ G_COID=id; G_CONAME=name; G_INDEP=false; document.getElementById('gCompany').value=name; document.getElementById('gCompanyBox').style.display='none'; var s=document.getElementById('gCompanySel'); s.style.display='block'; s.innerHTML='<span class="material-icons" style="font-size:14px;vertical-align:-2px;">business</span> '+esc(name); };
window.createGCompany=function(){ G_COID=null; G_INDEP=false; G_CONAME=document.getElementById('gCompany').value.trim(); document.getElementById('gCompanyBox').style.display='none'; var s=document.getElementById('gCompanySel'); s.style.display='block'; s.innerHTML='<span class="material-icons" style="font-size:14px;vertical-align:-2px;color:#16a34a;">add_circle</span> New company: '+esc(G_CONAME); };
window.pickIndependent=function(){ G_INDEP=true; G_COID=null; G_CONAME=null; document.getElementById('gCompany').value='Independent'; document.getElementById('gCompanyBox').style.display='none'; var s=document.getElementById('gCompanySel'); s.style.display='block'; s.innerHTML='<span class="material-icons" style="font-size:14px;vertical-align:-2px;color:#94a3b8;">person</span> Independent (no company)'; };
window.gIdSearch=async function(){
  var term=(document.getElementById('gIdInput').value||'').trim(); var box=document.getElementById('gIdResults');
  if(term.length<1){ box.style.display='none'; return; }
  try{
    var r=await partnersApi({action:'get_orphan_ids',query:term,placeholder_uuid:'f1ed4ff6-a7ee-4658-9684-a1ae7cc275be'});
    var d=(r&&r.data)||[];
    box.style.display='block';
    box.innerHTML=d.length? d.map(function(it){return '<div class="row" onmousedown="gPickId(\''+esc(it.id_string)+'\')"><b>'+esc(it.id_string)+'</b> <span class="muted" style="font-size:11px;">(Unassigned)</span></div>';}).join('')
      : '<div class="row muted" style="font-size:12px;" onmousedown="document.getElementById(\'gIdResults\').style.display=\'none\'">No unassigned ID — enter manually</div>';
  }catch(e){}
};
window.gPickId=function(s){ document.getElementById('gIdInput').value=s; document.getElementById('gIdResults').style.display='none'; };
window.gAddId=function(){
  var idStr=(document.getElementById('gIdInput').value||'').trim();
  var revNum=(document.getElementById('gRev').value||'').trim();
  var isPrime=document.getElementById('gPrime').checked;
  if(!idStr) return;
  var eff=(!revNum&&isPrime)?'50':revNum;
  var rev=eff?(String(eff).replace(/%+$/,'')+'%'):'0%';
  if(G_IDS.some(function(x){return x.string===idStr;})){ Swal.fire('Duplicate','That ID is already added.','warning'); return; }
  G_IDS.push({string:idStr,rev:rev,prime:isPrime});
  document.getElementById('gIdInput').value=''; document.getElementById('gRev').value=''; document.getElementById('gPrime').checked=false;
  renderGIds();
};
window.gRemoveId=function(i){ G_IDS.splice(i,1); renderGIds(); };
function renderGIds(){
  var el=document.getElementById('gIdList');
  if(!G_IDS.length){ el.innerHTML='<div class="muted" style="font-size:11.5px;text-align:center;padding:14px 0;">No IDs added yet</div>'; document.getElementById('gRepPreview').innerHTML=''; return; }
  el.innerHTML=G_IDS.map(function(x,i){return '<div class="gidrow"><b>'+esc(x.string)+'</b> <span class="muted">'+esc(x.rev)+'</span>'+(x.prime?' <span style="color:#b45309;font-weight:800;font-size:11px;">PRIME ⭐</span>':'')+'<span class="material-icons rm" onclick="gRemoveId('+i+')">close</span></div>';}).join('');
  var rep=G_IDS.map(function(x){return x.string+'('+x.rev+')';}).join(' | ');
  var prime=(G_IDS.find(function(x){return x.prime;})||{}).string||'';
  document.getElementById('gRepPreview').innerHTML='<div class="grad-rep"><b>Rep Code → HighLevel:</b> '+esc(rep)+(prime?'<br><b>Prime49ID:</b> '+esc(prime):'')+'</div>';
}
window.submitGraduation=async function(){
  if(!G_LEAD) return;
  if(!G_IDS.length){ Swal.fire('Add at least one ID','A partner needs at least one agent ID.','warning'); return; }
  var btn=document.getElementById('gSubmit'); btn.disabled=true; var orig=btn.innerHTML; btn.innerHTML='Processing…';
  var ad=document.getElementById('gActivation').value;
  var payload={
    action:'create',
    person:{ name:G_LEAD.full_name||'', email:(G_LEAD.email||'').toLowerCase(), phone:G_LEAD.phone||'', hl_id:G_LEAD.ghl_contact_id||null,
      enrolled_at: ad?new Date(ad+'T12:00:00').toISOString():new Date().toISOString(),
      is_branded: document.getElementById('gBranded').checked },
    company: G_INDEP?{id:null,name:null,isIndependent:true}:(G_COID?{id:G_COID,name:null,isIndependent:false}:(G_CONAME?{id:null,name:G_CONAME,isIndependent:false}:{id:null,name:null,isIndependent:true})),
    identifiers: G_IDS.map(function(x){return {string:x.string,rev:x.rev,prime:x.prime};})
  };
  try{
    var cr=await partnersApi(payload);
    if(!cr.success) throw new Error(cr.message||'Could not create partner');
    var gr=await lpApi({action:'graduate_lead',lead_id:G_LEAD.id,identifiers:payload.identifiers});
    partnersApi({action:'refresh_leaderboard'}).catch(function(){});
    var note='<b>'+esc(G_LEAD.full_name||'Prospect')+'</b> is now a partner.';
    if(gr&&gr.success&&gr.rep_code) note+='<br><span style="color:#64748b;font-size:12px;">Rep Code → HighLevel: '+esc(gr.rep_code)+'</span>';
    closeGraduate();
    await Swal.fire({icon:'success',title:'Welcome aboard! 🎉',html:note,confirmButtonColor:'#0d9488'});
    load();
  }catch(e){ Swal.fire('Error',e.message||'Failed','error'); }
  btn.disabled=false; btn.innerHTML=orig;
};

window.assignRep=async function(leadId,uid){
  var note=document.getElementById('ld-rep-note'); if(note) note.textContent='Saving…';
  var r=await lpApi({action:'set_lead_rep',lead_id:leadId,rep_userid:uid||null});
  if(note) note.textContent=(r&&r.success)?'✓ Saved':'Could not save';
  var p=PROSPECTS.find(function(x){return x.id===leadId;}); if(p){ p.assigned_rep=uid||null; renderProspects(); }
};
load();
</script>
