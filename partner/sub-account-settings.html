<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/js/pp-session.js?v=20260812b"></script>
    <script src="/js/brand-boot.js?v=20260812b"></script>
    <link rel="icon" href="/api/favicon" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub-account Settings | PayProTec Partner Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        *,*::before,*::after{box-sizing:border-box;}
        :root{--teal:#0d9488;--teal-dark:#0f766e;--teal-bg:#f0fdfa;--navy:#001e3c;--border:#e2e8f0;--surface:#f8fafc;--text:#0a1628;--secondary:#475569;--muted:#94a3b8;--purple-bg:#ede9fe;--purple-text:#6d28d9;--shadow-sm:0 1px 3px rgba(0,0,0,0.06);--shadow-md:0 4px 16px rgba(0,0,0,0.07);}
        body{margin:0;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
        .sidebar{position:fixed;top:0;left:0;width:240px;height:100vh;background:var(--navy);display:flex;flex-direction:column;z-index:100;box-shadow:4px 0 20px rgba(0,0,0,0.15);}
        .sidebar-header{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,0.08);}
        .sidebar-logo{height:28px;filter:brightness(0) invert(1);display:block;margin-bottom:16px;}
        .sidebar-partner{display:flex;align-items:center;gap:10px;}
        .sidebar-avatar{width:36px;height:36px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:white;}
        .sidebar-name{font-size:13px;font-weight:700;color:white;}
        .sidebar-tag{font-size:10px;color:rgba(255,255,255,0.4);}
        .sidebar-nav{flex:1;padding:16px 12px;display:flex;flex-direction:column;gap:4px;}
        .nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;color:rgba(255,255,255,0.6);text-decoration:none;cursor:pointer;border:none;background:none;width:100%;font-family:inherit;}
        .nav-item:hover{background:rgba(255,255,255,0.08);color:white;}
        .nav-item.active{background:var(--teal);color:white;}
        .nav-item .material-icons{font-size:20px;}
        .nav-divider{height:1px;background:rgba(255,255,255,0.08);margin:8px 0;}
        .main{margin-left:240px;min-height:100vh;}
        .topbar{background:white;padding:16px 28px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
        .content{padding:24px 28px;max-width:820px;}
        .crumb{font-size:12px;color:var(--muted);margin-bottom:10px;}
        .crumb a{color:var(--teal);text-decoration:none;font-weight:700;}
        .card{background:white;border:1px solid var(--border);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow-sm);margin-bottom:20px;}
        .card-title{font-size:15px;font-weight:800;margin:0 0 4px;display:flex;align-items:center;gap:8px;}
        .card-sub{font-size:12px;color:var(--muted);margin:0 0 4px;}
        .muted{color:var(--muted);font-size:12px;}
        .soon{display:inline-block;margin-top:12px;font-size:11px;font-weight:800;background:#f1f5f9;color:#64748b;padding:4px 12px;border-radius:99px;letter-spacing:0.5px;}
        .list{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
        .list li{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:#f8fafc;font-size:13px;font-weight:600;color:var(--secondary);}
        .list li .material-icons{font-size:18px;color:var(--teal);}
        @media(max-width:768px){.sidebar{transform:translateX(-100%);}.main{margin-left:0;}.content{padding:16px;}.list{grid-template-columns:1fr;}}
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-header">
        <img src="/api/brand-logo" class="sidebar-logo">
        <div class="sidebar-partner"><div class="sidebar-avatar" id="sidebarAvatar">?</div>
            <div><div class="sidebar-name" id="sidebarName">Loading...</div><div class="sidebar-tag">Partner Portal</div></div></div>
    </div>
    <nav class="sidebar-nav">
        <a class="nav-item" href="/partner/home"><span class="material-icons">home</span> Home</a>
        <a class="nav-item" id="navBackAgency" href="/partner/agency"><span class="material-icons">apartment</span> Agency Home</a>
        <a class="nav-item" id="navSub" href="/partner/sub-account"><span class="material-icons">hub</span> CRM Workspace</a>
        <a class="nav-item active" href="#"><span class="material-icons">settings</span> Sub-account Settings</a>
        <div class="nav-divider"></div>
        <button class="nav-item" onclick="handleLogout()"><span class="material-icons">logout</span> Sign Out</button>
    </nav>
    <div style="padding:16px;font-size:10px;color:rgba(255,255,255,0.25);text-align:center;">PayProTec Partner Portal v1.0</div>
</div>

<div class="main">
    <div class="topbar">
        <a href="#" id="backSub" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--teal);font-weight:700;font-size:13px;"><span class="material-icons" style="font-size:18px;">arrow_back</span> Back to CRM</a>
        <div style="font-size:1.1rem;font-weight:800;">Sub-account Settings</div>
    </div>
    <div class="content" id="content"><div class="muted" style="padding:30px;">Loading…</div></div>
</div>

<script>
const token = localStorage.getItem('pp_partner_token');
if (!token) window.location.href = '/partner';
function ppClearPartner(){ ['pp_partner_token','pp_partner_id','pp_impersonating','pp_active_portal','pp_active_sub_account','pp_active_company'].forEach(function(k){localStorage.removeItem(k);}); }
const subId = new URLSearchParams(location.search).get('sub') || localStorage.getItem('pp_active_sub_account') || '';
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);}); }
function initials(n){ return (String(n||'?').trim().split(/\s+/).map(function(w){return w[0];}).slice(0,2).join('')||'?').toUpperCase(); }

async function load(){
    if(!subId){ document.getElementById('content').innerHTML='<div class="card"><div class="muted">No sub-account selected. Go to <a href="/partner/home" style="color:var(--teal);font-weight:700;">Home</a>.</div></div>'; return; }
    var subUrl='/partner/sub-account?sub='+encodeURIComponent(subId);
    document.getElementById('navSub').href=subUrl; document.getElementById('backSub').href=subUrl;
    var r;
    try{ r=await fetch('/api/whitelabel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'get_sub_account',token:token,sub_account_id:subId})}).then(x=>x.json()); }catch(e){ r=null; }
    if(!r||!r.success){ if(r&&/session/i.test(r.message||'')){ppClearPartner();location.href='/partner';return;} document.getElementById('content').innerHTML='<div class="card"><div class="muted">'+esc((r&&r.message)||'Could not load.')+'</div></div>'; return; }
    var sa=r.sub_account, agencyName=(r.agency&&(r.agency.agency_name||r.agency.relationship_id))||'Agency';
    if(r.agency){ document.getElementById('navBackAgency').href='/partner/agency?portal='+encodeURIComponent(r.agency.portal_id); }
    document.getElementById('sidebarName').textContent=sa.name||'Sub-account';
    document.getElementById('sidebarAvatar').textContent=initials(sa.name||'S');
    document.getElementById('content').innerHTML=
      '<div class="crumb"><a href="/partner/home">Home</a> › <a href="/partner/agency'+(r.agency?('?portal='+encodeURIComponent(r.agency.portal_id)):'')+'">'+esc(agencyName)+'</a> › <a href="'+subUrl+'">'+esc(sa.name)+'</a> › Settings</div>'
      +'<div class="card"><div class="card-title"><span class="material-icons" style="font-size:18px;color:var(--teal);">tune</span> CRM Settings</div>'
      +'<div class="card-sub">Per-CRM configuration for <b>'+esc(sa.name)+'</b>. Each CRM inside your agency has its own settings.</div>'
      +'<ul class="list">'
      +'<li><span class="material-icons">trending_up</span> Pipeline &amp; stages</li>'
      +'<li><span class="material-icons">contacts</span> Contact fields</li>'
      +'<li><span class="material-icons">bolt</span> Automation rules</li>'
      +'<li><span class="material-icons">description</span> Forms</li>'
      +'<li><span class="material-icons">sell</span> Tags</li>'
      +'<li><span class="material-icons">groups</span> Team visibility</li>'
      +'</ul>'
      +'<span class="soon">COMING SOON</span>'
      +'</div>';
}
function handleLogout(){ fetch('/api/partner-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout',token})}).finally(function(){ ppClearPartner(); location.href='/partner'; }); }
load();
</script>
<script src="/js/pp-transition.js?v=20260812b"></script>
<script src="/js/brand.js?v=20260812b"></script>
<script src="/js/partner-nav.js?v=20260812b"></script>
</body>
</html>
