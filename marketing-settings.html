<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings | Marketing</title>
<script>(function(){const u=localStorage.getItem('pp_userid'),v=localStorage.getItem('pp_verified');if(!u||v!=='true')window.location.href='/?reason=unauthorized';})();</script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  *{box-sizing:border-box;}body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#f8fafc;color:#0f172a;}
  :root{--pri:#2563eb;--pri-d:#1d4ed8;--border:#e2e8f0;--muted:#94a3b8;--red:#dc2626;--green:#16a34a;}
  .top{background:#fff;border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;}
  .top h1{font-size:18px;font-weight:800;margin:0;flex:1;}
  .top a.back{color:var(--muted);text-decoration:none;font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px;}
  .wrap{max-width:820px;margin:0 auto;padding:24px;}
  .btn{border:none;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
  .btn-p{background:var(--pri);color:#fff;}.btn-p:hover{background:var(--pri-d);}
  .btn-n{background:#fff;color:#475569;border:1px solid var(--border);}
  .btn-r{background:#fff;color:var(--red);border:1px solid #fecaca;}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;margin-bottom:16px;overflow:hidden;}
  .card-head{padding:15px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
  .card-head .material-icons{color:var(--pri);}
  .card-head .t{font-weight:800;font-size:14.5px;flex:1;}
  .card-body{padding:16px 18px;}
  label{display:block;font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 5px;}
  input,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;background:#f8fafc;outline:none;}
  input:focus,textarea:focus{border-color:var(--pri);background:#fff;}
  .muted{color:var(--muted);}.empty{text-align:center;padding:40px;color:var(--muted);}
  .pill{font-size:11px;font-weight:800;border-radius:20px;padding:3px 10px;}
  .pill.on{background:#dcfce7;color:#166534;}.pill.off{background:#fef3c7;color:#b45309;}.pill.err{background:#fee2e2;color:#b91c1c;}
  code{font-size:11.5px;background:#f1f5f9;padding:2px 6px;border-radius:5px;word-break:break-all;}
  .hint{font-size:11.5px;color:#94a3b8;margin-top:5px;line-height:1.5;}
  .rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .copybtn{border:1px solid var(--border);background:#fff;color:var(--pri);border-radius:6px;font-size:11px;font-weight:700;padding:2px 8px;cursor:pointer;font-family:inherit;margin-left:6px;}
  .copybtn:hover{background:#eff6ff;}
  details.guide{margin:14px 0 4px;border:1px solid #dbeafe;background:#f5f9ff;border-radius:10px;overflow:hidden;}
  details.guide summary{cursor:pointer;list-style:none;padding:11px 14px;font-size:13px;font-weight:800;color:#1d4ed8;display:flex;align-items:center;gap:6px;user-select:none;}
  details.guide summary::-webkit-details-marker{display:none;}
  details.guide[open] summary{border-bottom:1px solid #dbeafe;}
  .guide-body{padding:12px 16px 16px;font-size:12.5px;color:#334155;line-height:1.6;}
  .guide-body ol{margin:6px 0;padding-left:20px;}
  .guide-body li{margin-bottom:9px;}
  .guide-body a{color:var(--pri);font-weight:700;}
  .gnote{background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin:6px 0;}
  .gcode{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap;}
  .gcode code{flex:1;min-width:200px;}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="/marketing"><span class="material-icons" style="font-size:18px;">arrow_back</span> Marketing</a>
  <h1>⚙️ Marketing Settings</h1>
  <a class="btn btn-n" href="/activity-logs?category=marketing" style="text-decoration:none;"><span class="material-icons" style="font-size:16px;">history</span> Activity log</a>
  <a class="btn btn-n" href="/marketing-courses" style="text-decoration:none;"><span class="material-icons" style="font-size:16px;">video_library</span> Courses</a>
</div>
<div class="wrap" id="wrap"><div class="empty">Loading…</div></div>
<script>
var TOKEN=localStorage.getItem('pp_session_token')||'';
function H(){ return {'Content-Type':'application/json','Authorization':'Bearer '+TOKEN}; }
function macc(b){ return fetch('/api/marketing-access',{method:'POST',headers:H(),body:JSON.stringify(b)}).then(function(r){return r.json();}); }
function capi(b){ return fetch('/api/courses',{method:'POST',headers:H(),body:JSON.stringify(b)}).then(function(r){return r.json();}); }
function yapi(b){ return fetch('/api/youtube-oauth',{method:'POST',headers:H(),body:JSON.stringify(b)}).then(function(r){return r.json();}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);}); }

// ── No-access gate ──
function renderGate(info){
  var w=document.getElementById('wrap');
  w.innerHTML='<div class="card"><div class="card-body" style="text-align:center;padding:40px 24px;">'
    +'<span class="material-icons" style="font-size:52px;color:#cbd5e1;">lock</span>'
    +'<div style="font-weight:800;font-size:17px;margin-top:10px;">You don\'t have access to Marketing Settings</div>'
    +'<div class="muted" style="margin-top:6px;max-width:460px;margin-left:auto;margin-right:auto;">This area holds sensitive integration keys (YouTube API &amp; Analytics). Ask the web developers to grant you access, or request it below.</div>'
    +'<div style="max-width:420px;margin:18px auto 0;text-align:left;">'
    +'<label>Reason (optional)</label><textarea id="reqReason" rows="3" placeholder="Why do you need access?"></textarea>'
    +'<button class="btn btn-p" style="margin-top:12px;width:100%;justify-content:center;" onclick="requestPerm(this)"><span class="material-icons" style="font-size:17px;">outgoing_mail</span> Request permission</button>'
    +'<div id="reqNote" class="hint" style="text-align:center;margin-top:10px;"></div>'
    +'</div></div></div>';
}
window.requestPerm=async function(btn){
  btn.disabled=true; var _h=btn.innerHTML; btn.innerHTML='<span class="material-icons" style="font-size:17px;">hourglass_top</span> Sending…';
  var reason=(document.getElementById('reqReason')||{}).value||'';
  var r=await macc({action:'request_permission',area:'Marketing → Settings',reason:reason});
  btn.disabled=false; btn.innerHTML=_h;
  var note=document.getElementById('reqNote');
  if(r&&r.success){
    btn.innerHTML='<span class="material-icons" style="font-size:17px;">check</span> Request sent';
    btn.disabled=true;
    note.innerHTML=r.sent?('✅ Your request was emailed to the web developers ('+r.recipients+' recipient'+(r.recipients===1?'':'s')+') and logged.'):('✅ Request logged. '+esc(r.note||''));
    Swal.fire({icon:'success',title:'Request sent',timer:1600,showConfirmButton:false});
  } else { note.textContent=(r&&r.message)||'Could not send the request.'; }
};

// ── Copy helper ──
window.copyText=function(t,btn){
  function done(){ if(btn){ var o=btn.textContent; btn.textContent='Copied!'; setTimeout(function(){btn.textContent=o;},1200); } }
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done).catch(function(){}); }
  else { try{ var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); }catch(e){} }
};

// ── Setup guide (collapsible) ──
function guideHtml(redirect){
  return '<details class="guide"><summary><span class="material-icons" style="font-size:16px;vertical-align:-3px;">menu_book</span> Setup guide — how to get the Client ID &amp; Secret</summary>'
    +'<div class="guide-body">'
    +'<div class="gnote">Do this once, signed in with the Google account that <b>owns the YouTube channel</b>. It\'s free.</div>'
    +'<ol>'
      +'<li><b>Open Google Cloud Console</b> → <a href="https://console.cloud.google.com" target="_blank" rel="noopener">console.cloud.google.com</a> → create or pick a project (e.g. "PayProTec Portal").</li>'
      +'<li><b>Enable the APIs.</b> APIs &amp; Services → <b>Library</b> → search <b>"YouTube Analytics API"</b> → Enable. (Also enable <b>YouTube Data API v3</b> if it isn\'t already.)</li>'
      +'<li><b>Configure the consent screen.</b> APIs &amp; Services → <b>OAuth consent screen</b> (may be labelled <b>Google Auth Platform</b>). If it\'s new, click <b>Get started</b> and follow the wizard: <b>App Information</b> (name + your email) → <b>Audience</b> — choose <b>External</b> here → <b>Contact info</b> → agree → <b>Create</b>. <span style="color:#64748b;">(On a personal Gmail there\'s no Internal option — it\'s External by default.)</span></li>'
      +'<li><b>Add a test user.</b> Open the <b>Audience</b> tab → <b>Test users</b> → <b>Add users</b> → add the channel owner\'s Google email. Leaving the app in <b>Testing</b> mode is fine.</li>'
      +'<li><b>Create the client.</b> APIs &amp; Services → <b>Credentials</b> → Create Credentials → <b>OAuth client ID</b> → Application type <b>Web application</b>.</li>'
      +'<li><b>Add the redirect URI</b> — under "Authorized redirect URIs", paste this <b>exactly</b>:<div class="gcode"><code>'+esc(redirect||'')+'</code><button class="copybtn" onclick="copyText(this.previousElementSibling.textContent,this)">Copy</button></div></li>'
      +'<li>Click <b>Create</b>. Google shows a <b>Client ID</b> (…apps.googleusercontent.com) and <b>Client Secret</b> (GOCSPX-…). Paste both into the fields below.</li>'
      +'<li>Click <b>Save &amp; connect</b> → approve as the channel owner → you\'ll return here <b>Connected</b>. Then click <b>Save &amp; refresh</b>.</li>'
    +'</ol>'
    +'<div class="gnote"><b>How it works:</b> once connected, for each video we ask YouTube Analytics how many of its <b>embedded-player</b> views happened on your portal host — that becomes the <b>YT-portal</b> chip on each video. It refreshes hourly. Note: YouTube Analytics lags <b>2–3 days</b> and only reports a domain once it clears YouTube\'s minimum threshold, so the instant <b>portal</b> play count (with partner names) stays the most reliable "watched from the portal" number.</div>'
    +'</div></details>';
}

// ── Settings panels ──
async function renderSettings(){
  var w=document.getElementById('wrap');
  w.innerHTML='<div class="empty">Loading settings…</div>';
  var ks=await capi({action:'yt_key_status'});
  var st=await yapi({action:'status'});
  var ai=await yapi({action:'get_ai_config'}); if(!ai||!ai.success) ai={};
  var keySet=ks&&ks.success&&ks.set;
  var connected=st&&st.success&&st.connected, clientSet=st&&st.client_set;
  var connPill=connected?'<span class="pill on">Connected</span>':(clientSet?'<span class="pill off">Not connected</span>':'<span class="pill err">Client not set</span>');
  w.innerHTML=''
    // YouTube Data API key
    +'<div class="card"><div class="card-head"><span class="material-icons">smart_display</span><span class="t">YouTube Data API key</span>'
      +(keySet?'<span class="pill on">'+esc(ks.masked||'set')+'</span>':'<span class="pill err">Not set</span>')+'</div>'
      +'<div class="card-body">'
      +'<div class="muted" style="font-size:13px;">Powers auto-sync of channel lives and total YouTube view counts. Create one in Google Cloud → Credentials with <b>YouTube Data API v3</b> enabled (read-only, no OAuth).</div>'
      +'<label>API key</label><input id="ytkey" type="text" autocomplete="off" placeholder="Paste a key (leave blank to keep the current one)">'
      +'<div class="rowbtns"><button class="btn btn-p" onclick="saveKey(this)"><span class="material-icons" style="font-size:16px;">save</span> Save key</button></div>'
      +'</div></div>'
    // YouTube Analytics (portal attribution)
    +'<div class="card"><div class="card-head"><span class="material-icons">verified</span><span class="t">YouTube Analytics — portal-attributed views</span>'+connPill+'</div>'
      +'<div class="card-body">'
      +'<div class="muted" style="font-size:13px;">'+(connected&&st.channel?('Connected channel: <b>'+esc(st.channel)+'</b>. '):'')+'Counts views of your videos <b>embedded on the portal</b> specifically (needs OAuth as the channel owner). Data has a 2–3 day delay. This connection also powers per-video analytics and <b>replying to YouTube comments</b> from the portal.</div>'
      +((connected && !st.can_reply)?'<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:10px 12px;margin-top:10px;font-size:12.5px;color:#92400e;">⚠️ Your connection was made before comment replies were added. Click <b>Reconnect</b> below to grant the comment permission — otherwise you can read comments but not reply.</div>':'')
      +guideHtml((st&&st.redirect_uri)||'')
      +'<label>Google OAuth Client ID</label><input id="ycid" type="text" autocomplete="off" placeholder="'+(clientSet?'•••• (set — leave blank to keep)':'xxxxx.apps.googleusercontent.com')+'">'
      +'<label>Google OAuth Client Secret</label><input id="ycsec" type="text" autocomplete="off" placeholder="'+(clientSet?'•••• (set — leave blank to keep)':'GOCSPX-…')+'">'
      +'<div class="hint">Create the client below in Google Cloud (see the guide above). Authorized redirect URI must be exactly:<br><code id="rediUri">'+esc((st&&st.redirect_uri)||'')+'</code> <button class="copybtn" onclick="copyText(document.getElementById(\'rediUri\').textContent,this)">Copy</button></div>'
      +'<label>Portal host(s) to attribute <span style="text-transform:none;color:#94a3b8;font-weight:400;">(comma-separated)</span></label><input id="yhosts" type="text" value="'+esc((st&&st.hosts)||'')+'">'
      +'<div class="rowbtns">'
        +'<button class="btn btn-p" onclick="saveAnalytics(this)"><span class="material-icons" style="font-size:16px;">'+(connected?'sync':'link')+'</span> '+(connected?'Save & refresh now':'Save & connect')+'</button>'
        +(connected?'<button class="btn btn-n" onclick="reconnectAnalytics(this)"><span class="material-icons" style="font-size:16px;">autorenew</span> Reconnect</button>':'')
        +(connected?'<button class="btn btn-r" onclick="disconnectAnalytics()"><span class="material-icons" style="font-size:16px;">link_off</span> Disconnect</button>':'')
      +'</div>'
      +'</div></div>'
    // AI comment auto-reply
    +'<div class="card"><div class="card-head"><span class="material-icons">auto_awesome</span><span class="t">AI comment auto-reply</span>'
      +(ai.enabled?'<span class="pill on">On</span>':'<span class="pill off">Off</span>')+'</div>'
      +'<div class="card-body">'
      +'<div class="muted" style="font-size:13px;">When on, Gemini reads each new YouTube comment (and the video) and posts a reply <b>as your channel</b> automatically — after a random delay so it feels human. Leave off to just get the notification and reply yourself (with the ✨ AI draft button).</div>'
      +(ai.gemini_set?'':'<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:9px;padding:10px 12px;margin-top:10px;font-size:12.5px;color:#b91c1c;">⚠️ No Gemini API key detected — AI drafting and auto-reply won\'t work until <code>GEMINI_API_KEY</code> is configured.</div>')
      +'<label style="display:flex;align-items:center;gap:9px;text-transform:none;letter-spacing:0;margin-top:14px;font-size:14px;cursor:pointer;font-weight:700;"><input type="checkbox" id="ai-en" style="width:auto;" '+(ai.enabled?'checked':'')+'> Yes, let AI answer comments on my behalf</label>'
      +'<div class="row" style="display:flex;gap:12px;margin-top:12px;"><div style="flex:1;"><label>Reply after — min (minutes)</label><input id="ai-min" type="number" min="1" max="120" value="'+(ai.min_minutes||1)+'"></div>'
      +'<div style="flex:1;"><label>…to max (minutes)</label><input id="ai-max" type="number" min="1" max="120" value="'+(ai.max_minutes||10)+'"></div></div>'
      +'<div class="hint">Each reply posts at a random time between these two values after the comment is detected (default 1–10 min). Comments are checked every ~2 minutes.</div>'
      +'<div class="rowbtns"><button class="btn btn-p" onclick="saveAi(this)"><span class="material-icons" style="font-size:16px;">save</span> Save comment settings</button></div>'
      // ── Live chat responder (separate, faster) ──
      +'<div style="border-top:1px solid #e2e8f0;margin-top:18px;padding-top:14px;">'
      +'<div style="display:flex;align-items:center;gap:8px;"><span class="material-icons" style="color:#dc2626;font-size:19px;">sensors</span><span style="font-weight:800;font-size:14px;">Live-chat responder</span>'+(ai.live_enabled?'<span class="pill on">On</span>':'<span class="pill off">Off</span>')+'</div>'
      +'<div class="muted" style="font-size:13px;margin-top:6px;">During a <b>livestream</b>, AI answers chat in near-real-time. It stays natural by being <b>selective</b> (only real questions / messages to you — greetings &amp; emojis are ignored), <b>throttled</b> (a max per minute), and <b>staggered</b> (a few random seconds each) so it never floods the chat when many people type at once.</div>'
      +'<label style="display:flex;align-items:center;gap:9px;text-transform:none;letter-spacing:0;margin-top:12px;font-size:14px;cursor:pointer;font-weight:700;"><input type="checkbox" id="lv-en" style="width:auto;" '+(ai.live_enabled?'checked':'')+'> Answer live chat during my streams</label>'
      +'<label style="display:flex;align-items:center;gap:9px;text-transform:none;letter-spacing:0;margin-top:8px;font-size:13px;cursor:pointer;"><input type="checkbox" id="lv-q" style="width:auto;" '+(ai.live_questions_only!==false?'checked':'')+'> Only answer genuine questions / messages directed at us <span class="muted">(recommended)</span></label>'
      +'<div class="row" style="display:flex;gap:12px;margin-top:12px;"><div style="flex:1;"><label>Max replies / minute</label><input id="lv-mpm" type="number" min="1" max="30" value="'+(ai.live_max_per_min||4)+'"></div>'
      +'<div style="flex:1;"><label>Delay min (sec)</label><input id="lv-dmin" type="number" min="0" max="120" value="'+(ai.live_delay_min_sec!=null?ai.live_delay_min_sec:3)+'"></div>'
      +'<div style="flex:1;"><label>…max (sec)</label><input id="lv-dmax" type="number" min="0" max="300" value="'+(ai.live_delay_max_sec!=null?ai.live_delay_max_sec:20)+'"></div></div>'
      +'<div class="hint">Checked every minute; when you\'re live it polls chat continuously. Heads-up: heavy live use consumes more YouTube API quota.</div>'
      +'<div class="rowbtns"><button class="btn btn-p" onclick="saveLive(this)"><span class="material-icons" style="font-size:16px;">save</span> Save live-chat settings</button></div>'
      +'</div>'
      +'</div></div>';
}
window.saveLive=async function(btn){
  var en=(document.getElementById('lv-en')||{}).checked;
  var q=(document.getElementById('lv-q')||{}).checked;
  var mpm=parseInt((document.getElementById('lv-mpm')||{}).value,10)||4;
  var dmin=parseInt((document.getElementById('lv-dmin')||{}).value,10); if(isNaN(dmin))dmin=3;
  var dmax=parseInt((document.getElementById('lv-dmax')||{}).value,10); if(isNaN(dmax))dmax=20;
  if(dmax<dmin){ Swal.fire('Check the range','Max seconds must be ≥ min seconds.','warning'); return; }
  btn.disabled=true;
  var r=await yapi({action:'set_live_config',enabled:en,questions_only:q,max_per_min:mpm,delay_min_sec:dmin,delay_max_sec:dmax});
  btn.disabled=false;
  if(r&&r.success){ Swal.fire({icon:'success',title:'Saved',timer:1100,showConfirmButton:false}); renderSettings(); }
  else Swal.fire('Error',(r&&r.message)||'Could not save','error');
};
window.saveAi=async function(btn){
  var en=(document.getElementById('ai-en')||{}).checked;
  var mn=parseInt((document.getElementById('ai-min')||{}).value,10)||1;
  var mx=parseInt((document.getElementById('ai-max')||{}).value,10)||10;
  if(mx<mn){ Swal.fire('Check the range','Max minutes must be ≥ min minutes.','warning'); return; }
  btn.disabled=true;
  var r=await yapi({action:'set_ai_config',enabled:en,min_minutes:mn,max_minutes:mx});
  btn.disabled=false;
  if(r&&r.success){ Swal.fire({icon:'success',title:'Saved',timer:1100,showConfirmButton:false}); renderSettings(); }
  else Swal.fire('Error',(r&&r.message)||'Could not save','error');
};
window.saveKey=async function(btn){
  var k=(document.getElementById('ytkey')||{}).value.trim();
  btn.disabled=true;
  var r=await capi({action:'set_yt_key',key:k});
  btn.disabled=false;
  if(r&&r.success){ Swal.fire({icon:'success',title:r.set?'Key saved':'Cleared',timer:1100,showConfirmButton:false}); renderSettings(); }
  else Swal.fire('Error',(r&&r.message)||'Could not save','error');
};
window.saveAnalytics=async function(btn){
  var cid=(document.getElementById('ycid')||{}).value.trim(), csec=(document.getElementById('ycsec')||{}).value.trim(), hosts=(document.getElementById('yhosts')||{}).value.trim();
  btn.disabled=true;
  var st=await yapi({action:'status'});
  if(cid||csec) await yapi({action:'set_client',client_id:cid,client_secret:csec});
  if(hosts) await yapi({action:'set_hosts',hosts:hosts});
  if(st&&st.connected){
    Swal.fire({title:'Refreshing portal-attributed views…',didOpen:function(){Swal.showLoading();},allowOutsideClick:false});
    var rr=await yapi({action:'refresh_portal_views'});
    btn.disabled=false;
    if(rr&&rr.success){ Swal.fire({icon:'success',title:'Updated',text:(rr.updated||0)+' video(s) refreshed.',timer:1800,showConfirmButton:false}); renderSettings(); }
    else Swal.fire('Note',(rr&&rr.message)||'Could not refresh.','warning');
  } else {
    var s=await yapi({action:'start'});
    btn.disabled=false;
    if(s&&s.success&&s.auth_url){ location.href=s.auth_url; }
    else Swal.fire('Error',(s&&s.message)||'Add the OAuth client ID + secret first.','error');
  }
};
window.reconnectAnalytics=async function(btn){
  // Re-run the OAuth consent so Google re-grants the current scopes (e.g. after
  // we add the comment-reply permission). Saves any edited client/hosts first.
  var cid=(document.getElementById('ycid')||{}).value.trim(), csec=(document.getElementById('ycsec')||{}).value.trim(), hosts=(document.getElementById('yhosts')||{}).value.trim();
  if(cid||csec) await yapi({action:'set_client',client_id:cid,client_secret:csec});
  if(hosts) await yapi({action:'set_hosts',hosts:hosts});
  var s=await yapi({action:'start'});
  if(s&&s.success&&s.auth_url){ location.href=s.auth_url; }
  else Swal.fire('Error',(s&&s.message)||'Could not start reconnect.','error');
};
window.disconnectAnalytics=async function(){
  var c=await Swal.fire({icon:'warning',title:'Disconnect channel?',text:'Portal-attributed views will stop refreshing.',showCancelButton:true,confirmButtonColor:'#dc2626',confirmButtonText:'Disconnect'});
  if(!c.isConfirmed) return;
  await yapi({action:'disconnect'});
  Swal.fire({icon:'success',title:'Disconnected',timer:1200,showConfirmButton:false});
  renderSettings();
};

// OAuth return toast (Google redirects to /marketing-settings?yt=…).
(function(){
  var p=new URLSearchParams(location.search), yt=p.get('yt');
  if(yt==='connected'){ Swal.fire({icon:'success',title:'YouTube channel connected',text:'Click "Save & refresh" to pull portal-attributed views.',confirmButtonColor:'#2563eb'}); }
  else if(yt==='error'){ Swal.fire('Connection failed',p.get('msg')||'Could not connect the channel.','error'); }
  if(yt){ history.replaceState({},'',location.pathname); }
})();

(async function(){
  var chk=await macc({action:'check'});
  if(chk&&chk.success&&chk.access){ renderSettings(); }
  else if(chk&&chk.success){ renderGate(chk); }
  else { document.getElementById('wrap').innerHTML='<div class="empty" style="color:#9a3412;">'+esc((chk&&chk.message)||'Could not load')+'</div>'; }
})();
</script>
</body>
