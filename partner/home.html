<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/js/pp-session.js?v=20260812b"></script>
    <script src="/js/brand-boot.js?v=20260812b"></script>
    <script src="/js/world-transition.js?v=20260812b"></script>
    <link rel="icon" href="/api/favicon" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | PayProTec Partner Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root {
            --teal:#0d9488; --teal-dark:#0f766e; --teal-light:#ccfbf1; --teal-bg:#f0fdfa;
            --navy:#001e3c; --border:#e2e8f0; --surface:#f8fafc; --white:#ffffff;
            --text:#0a1628; --secondary:#475569; --muted:#94a3b8;
            --green-bg:#dcfce7; --green-text:#166534; --amber-bg:#fef3c7; --amber-text:#92400e;
            --purple-bg:#ede9fe; --purple-text:#6d28d9;
            --shadow-sm:0 1px 3px rgba(0,0,0,0.06); --shadow-md:0 4px 16px rgba(0,0,0,0.07);
        }
        body { margin:0; font-family:'DM Sans',sans-serif; background:var(--surface); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; }
        .sidebar { position:fixed; top:0; left:0; width:240px; height:100vh; background:var(--navy); display:flex; flex-direction:column; z-index:100; box-shadow:4px 0 20px rgba(0,0,0,0.15); }
        .sidebar-header { padding:24px 20px 20px; border-bottom:1px solid rgba(255,255,255,0.08); }
        .sidebar-logo { height:28px; filter:brightness(0) invert(1); display:block; margin-bottom:16px; }
        .sidebar-partner { display:flex; align-items:center; gap:10px; }
        .sidebar-avatar { width:36px; height:36px; border-radius:50%; background:var(--teal); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; color:white; flex-shrink:0; }
        .sidebar-name { font-size:13px; font-weight:700; color:white; line-height:1.3; }
        .sidebar-tag { font-size:10px; color:rgba(255,255,255,0.4); font-weight:500; }
        .sidebar-nav { flex:1; padding:16px 12px; display:flex; flex-direction:column; gap:4px; }
        .nav-item { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; font-size:13px; font-weight:600; color:rgba(255,255,255,0.6); text-decoration:none; cursor:pointer; border:none; background:none; width:100%; font-family:'DM Sans',sans-serif; }
        .nav-item:hover { background:rgba(255,255,255,0.08); color:white; }
        .nav-item.active { background:var(--teal); color:white; }
        .nav-item .material-icons { font-size:20px; flex-shrink:0; }
        .nav-divider { height:1px; background:rgba(255,255,255,0.08); margin:8px 0; }
        .main { margin-left:240px; min-height:100vh; }
        .topbar { background:white; padding:16px 28px; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:50; }
        .topbar-title { font-size:1.2rem; font-weight:800; margin:0; }
        .content { padding:28px; max-width:1100px; }
        .hero { background:linear-gradient(135deg,var(--navy),#00355f); color:white; border-radius:20px; padding:26px 28px; margin-bottom:26px; display:flex; align-items:center; gap:18px; }
        .hero-avatar { width:60px; height:60px; border-radius:50%; background:var(--teal); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:24px; flex-shrink:0; }
        .hero h2 { margin:0 0 3px; font-size:1.5rem; font-weight:800; }
        .hero p { margin:0; font-size:13px; color:rgba(255,255,255,0.6); }
        .section-label { font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:0.8px; margin:26px 0 12px; display:flex; align-items:center; gap:8px; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
        .card { background:white; border:1px solid var(--border); border-radius:16px; padding:20px; box-shadow:var(--shadow-sm); transition:box-shadow 0.2s, transform 0.1s; display:flex; flex-direction:column; }
        .card:hover { box-shadow:var(--shadow-md); transform:translateY(-1px); }
        .card.agency { border-top:4px solid var(--teal); }
        .card.standalone { border-top:4px solid #cbd5e1; }
        .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px; }
        .card-title { font-size:16px; font-weight:800; line-height:1.25; }
        .rel { font-family:'DM Mono',monospace; font-size:11px; color:var(--purple-text); background:var(--purple-bg); padding:2px 8px; border-radius:6px; font-weight:700; white-space:nowrap; }
        .role-badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:99px; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.4px; }
        .role-owner { background:var(--purple-bg); color:var(--purple-text); }
        .role-admin { background:#f1f5f9; color:#475569; }
        .role-sub { background:var(--amber-bg); color:var(--amber-text); }
        .dot { display:inline-block; width:7px; height:7px; border-radius:50%; }
        .companies { display:flex; flex-wrap:wrap; gap:5px; margin:12px 0; }
        .chip { font-size:11px; font-weight:600; background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:3px 9px; color:var(--secondary); }
        .card-foot { margin-top:auto; padding-top:14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .status { font-size:11px; font-weight:700; display:flex; align-items:center; gap:5px; }
        .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:9px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; border:none; text-decoration:none; }
        .btn-teal { background:var(--teal); color:white; } .btn-teal:hover { background:var(--teal-dark); }
        .muted-note { font-size:12px; color:var(--muted); }
        .empty { background:white; border:1px dashed var(--border); border-radius:16px; padding:40px; text-align:center; color:var(--muted); }
        .empty .material-icons { font-size:40px; opacity:0.3; display:block; margin:0 auto 8px; }
        /* 3-level launcher: Partner Portal (standalone) · Agency (container) · CRMs (nested) */
        .launch { display:flex; flex-direction:column; gap:22px; }
        .portal-solo { max-width:360px; }
        .agency-block { background:white; border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow-sm); overflow:hidden; }
        .agency-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:18px 20px; background:linear-gradient(135deg,#f8fafc,#f0fdfa); border-bottom:1px solid var(--border); flex-wrap:wrap; }
        .agency-head-left { display:flex; align-items:center; gap:12px; }
        .agency-ico { width:44px; height:44px; border-radius:12px; background:var(--teal-bg); color:var(--teal); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .agency-ico .material-icons { font-size:24px; }
        .agency-title { font-size:16px; font-weight:800; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
        .agency-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
        .btn-outline { background:white; color:var(--secondary); border:1px solid var(--border); }
        .crm-wrap { padding:16px 20px 20px; }
        .crm-wrap-label { font-size:10px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:0.7px; margin:0 0 12px; }
        .crm-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
        .crm-card { border:1px solid var(--border); border-top:4px solid var(--teal); border-radius:14px; padding:16px; display:flex; flex-direction:column; background:white; transition:box-shadow .2s, transform .1s; }
        .crm-card:hover { box-shadow:var(--shadow-md); transform:translateY(-1px); }
        .add-crm { border:1.5px dashed var(--border); border-radius:14px; padding:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--muted); cursor:pointer; font-weight:700; font-size:13px; min-height:118px; text-align:center; }
        .add-crm:hover { border-color:var(--teal); color:var(--teal); background:var(--teal-bg); }
        @media (max-width:768px){ .sidebar{transform:translateX(-100%);} .main{margin-left:0;} .content{padding:16px;} }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-header">
        <img src="/api/brand-logo" class="sidebar-logo">
        <div class="sidebar-partner">
            <div class="sidebar-avatar" id="sidebarAvatar">?</div>
            <div>
                <div class="sidebar-name" id="sidebarName">Loading...</div>
                <div class="sidebar-tag">Partner Portal</div>
            </div>
        </div>
    </div>
    <nav class="sidebar-nav">
        <a class="nav-item active" href="/partner/home"><span class="material-icons">home</span> Home</a>
        <a class="nav-item" href="/partner/dashboard"><span class="material-icons">dashboard</span> PayProTec Portal</a>
        <div class="nav-divider"></div>
        <button class="nav-item" onclick="handleLogout()"><span class="material-icons">logout</span> Sign Out</button>
    </nav>
    <div style="padding:16px;font-size:10px;color:rgba(255,255,255,0.25);text-align:center;" data-brand-replace>PayProTec Partner Portal v1.0</div>
</div>

<div class="main">
    <div class="topbar"><h1 class="topbar-title">Home</h1></div>
    <div class="content">
        <div class="hero">
            <div class="hero-avatar" id="heroAvatar">?</div>
            <div>
                <h2 id="heroName">Welcome</h2>
                <p id="heroSub">Your partner portal and CRM — pick where to work.</p>
            </div>
        </div>
        <div id="hubBody"><div class="muted-note">Loading your workspace…</div></div>
    </div>
</div>

<script>
const token = localStorage.getItem('pp_partner_token');
if (!token) window.location.href = '/partner';
// Clear only partner keys (preserve a co-resident staff session for Login As).
function ppClearPartner(){ ['pp_partner_token','pp_partner_id','pp_impersonating','pp_active_portal','pp_active_sub_account','pp_active_company'].forEach(function(k){localStorage.removeItem(k);}); }

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);}); }
function initials(name){ return (String(name||'?').trim().split(/\s+/).map(function(w){return w[0];}).slice(0,2).join('')||'?').toUpperCase(); }

function roleBadge(a){
    if (a.my_role === 'god') return '<span class="role-badge" style="background:linear-gradient(135deg,#7c3aed,#4f46e5);color:white;">🔑 God</span>';
    if (a.my_role === 'owner') return '<span class="role-badge role-owner">'+(a.is_primary?'★ ':'')+'Owner'+(a.full_access&&!a.is_primary?' · Full':'')+'</span>';
    if (a.my_role === 'sub_partner') return '<span class="role-badge role-sub">Sub-partner</span>';
    return '<span class="role-badge role-admin">'+esc((a.my_role||'admin').replace('_',' '))+'</span>';
}
function domainStatus(a){
    if (!a.agency_enabled) return '<span class="status" style="color:#94a3b8;"><span class="dot" style="background:#cbd5e1;"></span>White-label off</span>';
    var d = a.domain;
    if (d && d.ssl_status === 'active') return '<span class="status" style="color:#166534;"><span class="dot" style="background:#22c55e;"></span>'+esc(d.host)+'</span>';
    if (d) return '<span class="status" style="color:#92400e;"><span class="dot" style="background:#f59e0b;"></span>'+esc(d.host)+' · setting up</span>';
    return '<span class="status" style="color:#92400e;"><span class="dot" style="background:#f59e0b;"></span>No domain yet</span>';
}
// Entering an agency (optionally a specific sub-account) stores the active context for
// the CRM (switcher-ready), then lands on the dashboard. Per-context scoping lands with
// the CRM layer.
function ppGo(url){ (window.ppWorldGo || function(u){ window.location.href = u; })(url); }
window.enterAgency = function(portalId, subId){
    localStorage.setItem('pp_active_portal', portalId || '');
    localStorage.setItem('pp_active_sub_account', subId || '');
    // A specific sub-account opens its CRM workspace (a different world → flash);
    // "open agency" (no sub) stays in the agency world.
    ppGo(subId ? ('/partner/sub-account?sub=' + encodeURIComponent(subId)) : ('/partner/agency?portal=' + encodeURIComponent(portalId)));
};
window.enterCompany = function(companyId){
    localStorage.setItem('pp_active_portal', '');
    localStorage.setItem('pp_active_sub_account', '');
    localStorage.setItem('pp_active_company', companyId || '');
    ppGo('/partner/dashboard');
};

// LEVEL 2 — the AGENCY (branded office). A container that "caters" the CRMs:
// its header carries branding/domain + Settings/Team; its body nests the CRMs.
function agencyBlock(a){
    var title = a.agency_name || 'Unnamed agency';
    var n = (a.sub_accounts||[]).length;
    var head =
      '<div class="agency-head">'
      +'<div class="agency-head-left"><div class="agency-ico"><span class="material-icons">apartment</span></div>'
      +'<div><div class="agency-title">'+esc(title)+' <span class="rel">'+esc(a.relationship_id||'')+'</span></div>'
      +'<div style="margin-top:5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">'+roleBadge(a)+' <span class="muted-note">· '+n+' CRM'+(n===1?'':'s')+'</span> '+domainStatus(a)+'</div></div></div>'
      +'<div class="agency-actions">'
      +(a.can_manage?'<a class="btn btn-outline" href="/partner/agency-settings?portal='+a.portal_id+'"><span class="material-icons" style="font-size:15px;">settings</span> Settings</a>':'')
      +'<a class="btn btn-outline" href="/partner/agency?portal='+a.portal_id+'"><span class="material-icons" style="font-size:15px;">groups</span> Team</a>'
      +'</div></div>';

    // LEVEL 3 — the CRMs (sub-accounts) nested inside this agency.
    var cards = (a.sub_accounts||[]).map(function(s){ return crmCard(s, a); }).join('');
    var addTile = a.can_manage
      ? '<div class="add-crm" onclick="openCreateSub(\''+a.portal_id+'\')"><span class="material-icons" style="font-size:26px;">add_circle</span>Add CRM</div>'
      : '';
    if (!n && !a.can_manage) cards = '<div class="muted-note" style="padding:6px 2px;">No CRMs yet.</div>';

    return '<div class="agency-block">'+head
      +'<div class="crm-wrap"><div class="crm-wrap-label">CRMs</div>'
      +'<div class="crm-grid">'+cards+addTile+'</div></div></div>';
}

// A CRM = one sub-account inside the agency. This is what you open to work.
function crmCard(s, a){
    var del = a.can_manage ? '<span class="material-icons" title="Remove CRM" onclick="event.stopPropagation();removeSub(\''+a.portal_id+'\',\''+s.id+'\')" style="font-size:16px;color:#cbd5e1;cursor:pointer;">close</span>' : '';
    return '<div class="crm-card">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">'
      +'<div style="font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;"><span class="material-icons" style="font-size:17px;color:var(--teal);">hub</span>'+esc(s.name)+'</div>'+del+'</div>'
      +'<div class="muted-note" style="margin:6px 0 14px;">CRM · '+(s.type==='client'?'Client':'Company')+'</div>'
      +'<div style="margin-top:auto;"><button class="btn btn-teal" style="width:100%;justify-content:center;" onclick="enterAgency(\''+a.portal_id+'\',\''+s.id+'\')">Open CRM <span class="material-icons" style="font-size:16px;">arrow_forward</span></button></div>'
      +'</div>';
}
function standaloneCard(c){
    return '<div class="card standalone">'
      +'<div class="card-top"><div class="card-title">'+esc(c.company_name)+'</div></div>'
      +'<div class="muted-note" style="margin:6px 0 2px;">Your company · standard portal</div>'
      +'<div class="card-foot"><span class="status" style="color:#94a3b8;"><span class="dot" style="background:#cbd5e1;"></span>Standard</span>'
      +'<button class="btn btn-teal" onclick="enterCompany(\''+c.company_id+'\')">Open <span class="material-icons" style="font-size:16px;">arrow_forward</span></button></div>'
      +'</div>';
}

// Create a sub-account: pick one of your PayProTec companies, or a free-form client.
window.openCreateSub = async function(portalId){
    var comps = [];
    try { var r = await fetch('/api/whitelabel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'my_companies',token:token,portal_id:portalId})}).then(x=>x.json()); if(r&&r.success) comps=r.companies||[]; } catch(e){}
    var opts = comps.map(function(c){ return '<option value="'+esc(c.company_id)+'">'+esc(c.company_name)+'</option>'; }).join('');
    var html =
      '<div style="text-align:left;font-size:13px;">'
      +'<label style="font-weight:700;display:block;margin-bottom:6px;">CRM type</label>'
      +'<select id="scType" class="swal2-select" style="width:100%;margin:0 0 12px;" onchange="document.getElementById(\'scCompanyWrap\').style.display=this.value===\'company\'?\'block\':\'none\';document.getElementById(\'scNameWrap\').style.display=this.value===\'client\'?\'block\':\'none\';">'
      +'<option value="company">One of my companies</option>'
      +'<option value="client">New client (not a PayProTec partner)</option>'
      +'</select>'
      +'<div id="scCompanyWrap">'
      + (comps.length ? '<label style="font-weight:700;display:block;margin-bottom:6px;">Company</label><select id="scCompany" class="swal2-select" style="width:100%;margin:0;">'+opts+'</select>'
                      : '<div class="muted-note">All your companies are already added, or you have none. Use “New client” instead.</div>')
      +'</div>'
      +'<div id="scNameWrap" style="display:none;"><label style="font-weight:700;display:block;margin-bottom:6px;">Client name</label><input id="scName" class="swal2-input" style="width:100%;margin:0;" placeholder="e.g. Downtown Diner"></div>'
      +'</div>';
    var res = await Swal.fire({
        title:'New CRM', html:html, showCancelButton:true, confirmButtonText:'Create', confirmButtonColor:'#0d9488',
        focusConfirm:false,
        preConfirm:function(){
            var type=document.getElementById('scType').value;
            if(type==='company'){ var el=document.getElementById('scCompany'); if(!el||!el.value){ Swal.showValidationMessage('No company available — use New client.'); return false; } return {company_id:el.value}; }
            var nm=(document.getElementById('scName').value||'').trim(); if(!nm){ Swal.showValidationMessage('Enter a client name.'); return false; } return {name:nm};
        }
    });
    if(!res.isConfirmed) return;
    var payload = Object.assign({action:'create_sub_account',token:token,portal_id:portalId}, res.value);
    var cr = await fetch('/api/whitelabel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(x=>x.json());
    if(!cr||!cr.success){ Swal.fire('Error',(cr&&cr.message)||'Could not create.','error'); return; }
    loadHub();
};
window.removeSub = async function(portalId, subId){
    var c = await Swal.fire({icon:'warning',title:'Remove CRM?',text:'This removes it from the agency (the underlying company/partner record is untouched).',showCancelButton:true,confirmButtonText:'Remove',confirmButtonColor:'#dc2626'});
    if(!c.isConfirmed) return;
    await fetch('/api/whitelabel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'delete_sub_account',token:token,portal_id:portalId,sub_account_id:subId})}).then(x=>x.json());
    loadHub();
};

async function loadHub(){
    var r;
    try { r = await fetch('/api/whitelabel', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'get_my_agencies', token: token }) }).then(x=>x.json()); }
    catch(e){ r = null; }
    if (!r || !r.success) {
        if (r && /session/i.test(r.message||'')) { ppClearPartner(); window.location.href='/partner'; return; }
        document.getElementById('hubBody').innerHTML = '<div class="empty"><span class="material-icons">error_outline</span>Could not load your workspace.</div>';
        return;
    }
    var name = (r.person && r.person.full_name) || 'Partner';
    document.getElementById('heroName').textContent = 'Welcome, ' + name.split(' ')[0] + ' 👋';
    document.getElementById('heroAvatar').textContent = initials(name);
    document.getElementById('sidebarName').textContent = name;
    document.getElementById('sidebarAvatar').textContent = initials(name);

    var owned = (r.agencies||[]).filter(function(a){ return a.is_owner; });
    var accessed = (r.agencies||[]).filter(function(a){ return !a.is_owner; });
    var agencies = owned.concat(accessed);

    // Remember the active agency for context (Settings/Team live on each agency card).
    var manageable = agencies.filter(function(a){ return a.can_manage; })[0] || agencies[0];
    if (manageable) localStorage.setItem('pp_active_portal', manageable.portal_id);

    // The Partner Portal is SEPARATE from the agency — your standard partner account.
    var portalCard = '<div class="card" style="border-top:4px solid var(--navy);">'
      +'<div class="card-top"><div class="card-title">PayProTec Portal</div></div>'
      +'<div class="muted-note" style="margin:6px 0 2px;">Your standard partner account — merchants, residuals, POS leads.</div>'
      +'<div class="card-foot"><span class="status" style="color:#64748b;"><span class="dot" style="background:#334155;"></span>Standard access</span>'
      +'<button class="btn btn-teal" onclick="ppGo(\'/partner/dashboard\')">Open <span class="material-icons" style="font-size:16px;">arrow_forward</span></button></div></div>';

    // Three levels: Partner Portal (standalone) · Agency (container) · CRMs (nested inside).
    var html = '<div class="section-label"><span class="material-icons" style="font-size:15px;">grid_view</span> Choose where to work</div>'
             + '<div class="launch">'
             +   '<div class="portal-solo">' + portalCard + '</div>'
             +   agencies.map(agencyBlock).join('')
             + '</div>';
    document.getElementById('hubBody').innerHTML = html;
}

function handleLogout(){
    fetch('/api/partner-auth', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'logout', token }) })
      .finally(function(){ ppClearPartner(); window.location.href='/partner'; });
}

loadHub();
</script>
<script src="/js/pp-transition.js?v=20260812b"></script>
<script src="/js/brand.js?v=20260812b"></script>
<script src="/js/partner-nav.js?v=20260812b"></script>
</body>
</html>
