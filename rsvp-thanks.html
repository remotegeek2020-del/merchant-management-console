<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP Confirmed</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#f1f5f9;color:#0a1628;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;}
  .box{padding:30px 20px;}
  .box div.icon{font-size:40px;}
  h1{font-size:18px;margin:10px 0 4px;}
  p{color:#64748b;font-size:13px;}
</style>
</head>
<body>
<div class="box">
  <div class="icon">🎉</div>
  <h1>Thanks — you're all set!</h1>
  <p>You can close this window.</p>
</div>
<script>
// Set as the HighLevel form's "Redirect URL after submit" — this page's only
// job is to tell the parent page (the RSVP popup) that the embedded form was
// actually submitted, since HighLevel's own postMessage signal on submit isn't
// reliably detectable cross-origin. No context is needed in the message: the
// parent already knows which RSVP is in progress.
try {
    if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'ppxRsvpFormDone' }, '*');
    }
} catch (e) {}
</script>
</body>
</html>
