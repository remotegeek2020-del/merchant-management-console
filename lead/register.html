<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Become a Partner | PayProTec</title>
<link rel="icon" href="/api/favicon" />
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#001e3c;color:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:100%;max-width:420px;padding:28px;}
  .logo{height:30px;display:block;margin:0 auto 6px;filter:none;}
  h1{font-size:20px;font-weight:800;text-align:center;margin:8px 0 2px;color:#001e3c;}
  .sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:18px;}
  .tabs{display:flex;gap:6px;background:#f1f5f9;border-radius:10px;padding:4px;margin-bottom:16px;}
  .tab{flex:1;text-align:center;padding:8px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;color:#475569;}
  .tab.on{background:#fff;color:#0d9488;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  label{display:block;font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.4px;margin:12px 0 5px;}
  input{width:100%;padding:11px 13px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:#f8fafc;}
  input:focus{border-color:#0d9488;background:#fff;}
  .btn{width:100%;margin-top:18px;padding:12px;border:none;border-radius:10px;background:#0d9488;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;}
  .btn:hover{background:#0f766e;}.btn:disabled{opacity:.6;cursor:not-allowed;}
  .msg{margin-top:12px;font-size:12.5px;text-align:center;}
  .foot{text-align:center;margin-top:16px;font-size:12px;}.foot a{color:#0d9488;text-decoration:none;font-weight:700;}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="https://assets.cdn.filesafe.space/dfg08aPdtlQ1RhIKkCnN/media/66cf5cf28a35e448970f1ead.png" alt="PayProTec">
  <h1>PayProTec Partner Program</h1>
  <div class="sub">Register to unlock the program — webinars, updates & your become-a-partner call.</div>
  <div class="tabs"><div class="tab on" id="tab-reg" onclick="setMode('reg')">Create account</div><div class="tab" id="tab-in" onclick="setMode('in')">Sign in</div></div>

  <div id="regForm">
    <label>Full name</label><input id="r-name" placeholder="Jane Smith">
    <label>Email</label><input id="r-email" type="email" placeholder="you@company.com">
    <label>Phone</label><input id="r-phone" type="tel" placeholder="(555) 000-0000">
    <label>Create a password</label><input id="r-pass" type="password" placeholder="At least 6 characters">
    <button class="btn" id="regBtn" onclick="doRegister()"><span class="material-icons" style="font-size:18px;">rocket_launch</span> Create my account</button>
  </div>

  <div id="inForm" style="display:none;">
    <label>Email</label><input id="i-email" type="email" placeholder="you@company.com">
    <label>Password</label><input id="i-pass" type="password" placeholder="••••••••">
    <button class="btn" id="inBtn" onclick="doLogin()"><span class="material-icons" style="font-size:18px;">login</span> Sign in</button>
  </div>

  <div id="msg" class="msg"></div>
  <div class="foot">Already a partner? <a href="/partner">Partner sign in</a></div>
</div>
<script>
if(localStorage.getItem('pp_lead_token')){ location.href='/lead/home'; }
function setMode(m){ document.getElementById('tab-reg').className='tab'+(m==='reg'?' on':''); document.getElementById('tab-in').className='tab'+(m==='in'?' on':''); document.getElementById('regForm').style.display=m==='reg'?'block':'none'; document.getElementById('inForm').style.display=m==='in'?'block':'none'; document.getElementById('msg').textContent=''; }
function api(b){ return fetch('/api/lead-portal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json();}); }
function err(m){ var e=document.getElementById('msg'); e.style.color='#dc2626'; e.textContent=m; }
function val(id){ return (document.getElementById(id).value||'').trim(); }
async function doRegister(){
  var name=val('r-name'), email=val('r-email'), phone=val('r-phone'), pass=document.getElementById('r-pass').value;
  if(!name||!email||pass.length<6){ err('Fill in your name, email and a 6+ character password.'); return; }
  var btn=document.getElementById('regBtn'); btn.disabled=true;
  var r=await api({action:'lead_register',full_name:name,email:email,phone:phone,password:pass,source:'become_a_partner'});
  btn.disabled=false;
  if(r&&r.success){ localStorage.setItem('pp_lead_token',r.token); localStorage.setItem('pp_lead_name',r.lead.full_name||''); location.href='/lead/onboarding'; }
  else err((r&&r.message)||'Could not create your account.');
}
async function doLogin(){
  var email=val('i-email'), pass=document.getElementById('i-pass').value;
  if(!email||!pass){ err('Enter your email and password.'); return; }
  var btn=document.getElementById('inBtn'); btn.disabled=true;
  var r=await api({action:'lead_login',email:email,password:pass});
  btn.disabled=false;
  if(r&&r.success){ localStorage.setItem('pp_lead_token',r.token); localStorage.setItem('pp_lead_name',r.lead.full_name||''); location.href = r.lead.onboarding_completed ? '/lead/home' : '/lead/onboarding'; }
  else err((r&&r.message)||'Invalid email or password.');
}
</script>
</body>
</html>
