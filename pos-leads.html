<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS Express Leads</title>
<script src="js/access-guard.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  :root{--blue:#ea580c;--muted:#94a3b8;--border:#e2e8f0;--green:#16a34a;--red:#dc2626;}
  *{box-sizing:border-box;}body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#fff7ed;color:#0f172a;}
  .brandbar{background:linear-gradient(135deg,#9a3412,#ea580c);color:#fff;padding:9px 22px;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;}
  .brandbar .dot{width:9px;height:9px;border-radius:50%;background:#fed7aa;}
  .brandbar a{color:#fff;text-decoration:none;margin-left:auto;opacity:.9;display:flex;align-items:center;gap:4px;}
  .top{background:#fff;border-bottom:1px solid var(--border);padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .top h1{font-size:18px;font-weight:800;margin:0;flex:1;}
  .btn{border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn-b{background:var(--blue);color:#fff;}.btn-n{background:#fff;color:#475569;border:1px solid var(--border);}
  .wrap{max-width:1200px;margin:20px auto;padding:0 18px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px;}
  .stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;}
  .stat .n{font-size:24px;font-weight:800;}.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .tab{padding:7px 14px;border:1px solid var(--border);background:#fff;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;color:#64748b;}
  .tab.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  th{text-align:left;font-size:10px;text-transform:uppercase;color:var(--muted);padding:10px 12px;background:#f8fafc;font-weight:800;}
  td{padding:11px 12px;border-top:1px solid #f1f5f9;font-size:13px;}
  tr{cursor:pointer;}tr:hover td{background:#f8fafc;}
  .pill{font-size:10px;font-weight:800;border-radius:5px;padding:2px 7px;}
  .badge-ok{background:#dcfce7;color:#166534;}.badge-no{background:#fee2e2;color:#991b1b;}
</style>
</head>
<body>
<div class="brandbar">
  <span class="dot"></span> POS EXPRESS · Sub-Account Workspace
  <a href="/"><span class="material-icons" style="font-size:15px;">swap_horiz</span> Exit to PayProTec Portal</a>
</div>
<div class="top">
  <span class="material-icons" style="color:#ea580c;">point_of_sale</span>
  <h1>POS Express — Lead Pipeline</h1>
  <button class="btn btn-n" onclick="openConfig()"><span class="material-icons" style="font-size:15px;vertical-align:middle;">settings</span> Webhook</button>
  <button class="btn btn-n" onclick="load()">Refresh</button>
</div>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs"></div>
  <table>
    <thead><tr><th>Business</th><th>Partner</th><th>Contact</th><th>Volume</th><th>Source</th><th>Status</th></tr></thead>
    <tbody id="rows"><tr><td colspan="6" style="text-align:center;padding:30px;color:var(--muted);">Loading…</td></tr></tbody>
  </table>
</div>
<script>
var TOKEN=localStorage.getItem('pp_session_token')||'';
var LEADS=[], FILTER='';
var STATUSES=[['','All'],['new','New'],['reviewing','Reviewing'],['qualified','Qualified'],['rejected','Rejected'],['sent','Sent to POS Express']];
function api(b){ return fetch('/api/pos',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify(b)}).then(function(r){return r.json();}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);}); }
function money(n){ return n?('$'+Number(n).toLocaleString()):'—'; }
var STPILL={new:'#0369a1',reviewing:'#b45309',qualified:'#16a34a',rejected:'#94a3b8',sent:'#7c3aed'};

function renderTabs(){
  document.getElementById('tabs').innerHTML=STATUSES.map(function(s){return '<button class="tab '+(FILTER===s[0]?'on':'')+'" onclick="setFilter(\''+s[0]+'\')">'+s[1]+'</button>';}).join('');
}
function setFilter(f){ FILTER=f; renderTabs(); renderRows(); }
function renderStats(){
  var c={new:0,reviewing:0,qualified:0,rejected:0,sent:0};
  LEADS.forEach(function(l){ if(c[l.status]!=null) c[l.status]++; });
  document.getElementById('stats').innerHTML=
    '<div class="stat"><div class="n">'+LEADS.length+'</div><div class="l">Total</div></div>'+
    '<div class="stat"><div class="n" style="color:#0369a1;">'+c.new+'</div><div class="l">New</div></div>'+
    '<div class="stat"><div class="n" style="color:#b45309;">'+c.reviewing+'</div><div class="l">Reviewing</div></div>'+
    '<div class="stat"><div class="n" style="color:#16a34a;">'+c.qualified+'</div><div class="l">Qualified</div></div>'+
    '<div class="stat"><div class="n" style="color:#7c3aed;">'+c.sent+'</div><div class="l">Sent</div></div>';
}
function renderRows(){
  var list=FILTER?LEADS.filter(function(l){return l.status===FILTER;}):LEADS;
  var tb=document.getElementById('rows');
  if(!list.length){ tb.innerHTML='<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--muted);">No leads.</td></tr>'; return; }
  tb.innerHTML=list.map(function(l){
    return '<tr onclick="openLead(\''+l.id+'\')"><td><b>'+esc(l.business_name||'—')+'</b><div style="font-size:11px;color:var(--muted);">'+esc(l.city||'')+(l.state?', '+esc(l.state):'')+'</div></td>'+
      '<td>'+esc(l.partner_name||'—')+'<div style="font-size:11px;color:var(--muted);">'+esc(l.agent_id||'')+' '+(l.agent_valid?'<span class="pill badge-ok">valid</span>':'<span class="pill badge-no">unmatched</span>')+'</div></td>'+
      '<td>'+esc(l.contact_name||'—')+'<div style="font-size:11px;color:var(--muted);">'+esc(l.email||l.phone||'')+'</div></td>'+
      '<td>'+money(l.monthly_volume)+'</td>'+
      '<td><span class="pill" style="background:#f1f5f9;color:#475569;">'+esc(l.source)+'</span></td>'+
      '<td><span class="pill" style="background:'+(STPILL[l.status]||'#64748b')+';color:#fff;">'+esc(l.status)+'</span></td></tr>';
  }).join('');
}
async function load(){
  var r=await api({action:'list'});
  if(!r.success){ document.getElementById('rows').innerHTML='<tr><td colspan="6" style="color:var(--red);padding:20px;">'+esc(r.message||'Failed')+'</td></tr>'; return; }
  LEADS=r.leads||[]; renderStats(); renderRows();
}
async function openLead(id){
  var l=LEADS.find(function(x){return x.id===id;}); if(!l) return;
  var info=[['Business',l.business_name],['Contact',l.contact_name],['Email',l.email],['Phone',l.phone],['Location',(l.city||'')+(l.state?', '+l.state:'')],['Type',l.business_type],['Monthly volume',money(l.monthly_volume)],['Partner',(l.partner_name||'—')+' ('+(l.agent_id||'no agent id')+')'],['Notes',l.notes]]
    .filter(function(x){return x[1];}).map(function(x){return '<div style="display:flex;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px solid #f1f5f9;"><span style="width:130px;color:#94a3b8;font-weight:700;">'+x[0]+'</span><span>'+esc(x[1])+'</span></div>';}).join('');
  var canSend = l.status!=='sent';
  var res=await Swal.fire({
    title:esc(l.business_name||'Lead'), width:640,
    html:'<div style="text-align:left;">'+
      (l.agent_valid?'':'<div style="background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:10px;">⚠️ Agent ID “'+esc(l.agent_id||'')+'” did not match a partner. Verify before sending.</div>')+
      info+
      '<label style="display:block;font-size:12px;font-weight:700;margin:12px 0 4px;">Classification</label>'+
      '<select id="pl-class" class="swal2-input" style="margin:0;width:100%;"><option value="">— unclassified —</option><option value="good"'+(l.classification==='good'?' selected':'')+'>Good lead</option><option value="bad"'+(l.classification==='bad'?' selected':'')+'>Bad lead</option></select>'+
      '<label style="display:block;font-size:12px;font-weight:700;margin:12px 0 4px;">Status</label>'+
      '<select id="pl-status" class="swal2-input" style="margin:0;width:100%;">'+['new','reviewing','qualified','rejected','sent'].map(function(s){return '<option value="'+s+'"'+(l.status===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select>'+
      '<label style="display:block;font-size:12px;font-weight:700;margin:12px 0 4px;">Review notes</label>'+
      '<textarea id="pl-notes" class="swal2-textarea" style="margin:0;width:100%;">'+esc(l.review_notes||'')+'</textarea>'+
      '</div>',
    showCancelButton:true, confirmButtonText:'Save',
    footer: canSend ? '<button id="pl-send" class="btn btn-b" style="background:#7c3aed;">✅ Mark good &amp; send to POS Express</button>' : '<span style="color:#7c3aed;font-weight:700;">Already sent to POS Express</span>',
    didOpen:function(){
      var sb=document.getElementById('pl-send');
      if(sb) sb.addEventListener('click',async function(){
        sb.disabled=true; sb.textContent='Sending…';
        var s=await api({action:'send_to_ghl',id:l.id});
        if(s.success){ Swal.close(); Swal.fire({icon:'success',title:'Sent to POS Express',timer:1400,showConfirmButton:false}); load(); }
        else { Swal.showValidationMessage(s.message||'Send failed'); sb.disabled=false; sb.textContent='✅ Mark good & send to POS Express'; }
      });
    },
    preConfirm:function(){ return { classification:document.getElementById('pl-class').value, status:document.getElementById('pl-status').value, review_notes:document.getElementById('pl-notes').value }; }
  });
  if(res.isConfirmed && res.value){
    await api({action:'update',id:l.id,classification:res.value.classification||null,status:res.value.status,review_notes:res.value.review_notes});
    load();
  }
}
async function openConfig(){
  var r=await api({action:'get_config'});
  var res=await Swal.fire({title:'POS Express webhook',input:'url',inputLabel:'HighLevel inbound webhook URL (good leads are POSTed here)',inputValue:(r.success?r.webhook_url:'')||'',showCancelButton:true,confirmButtonText:'Save'});
  if(res.isConfirmed){ var s=await api({action:'set_config',webhook_url:res.value||''}); if(!s.success) Swal.fire('Error',s.message||'','error'); else Swal.fire({icon:'success',title:'Saved',timer:1000,showConfirmButton:false}); }
}
renderTabs(); load();
</script>
</body>
</html>
