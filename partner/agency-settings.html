<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/js/pp-session.js?v=20260812b"></script>
    <script src="/js/brand-boot.js?v=20260812b"></script>
    <script src="/js/world-transition.js?v=20260812b"></script>
    <link rel="icon" href="/api/favicon" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency Settings | PayProTec Partner Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        *,*::before,*::after{box-sizing:border-box;}
        :root{--teal:#0d9488;--teal-dark:#0f766e;--teal-bg:#f0fdfa;--navy:#001e3c;--border:#e2e8f0;--surface:#f8fafc;--text:#0a1628;--secondary:#475569;--muted:#94a3b8;--purple-bg:#ede9fe;--purple-text:#6d28d9;--shadow-sm:0 1px 3px rgba(0,0,0,0.06);--shadow-md:0 4px 16px rgba(0,0,0,0.07);}
        body{margin:0;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
        .sidebar{position:fixed;top:0;left:0;width:240px;height:100vh;background:var(--navy);display:flex;flex-direction:column;z-index:100;box-shadow:4px 0 20px rgba(0,0,0,0.15);}
        .sidebar-header{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,0.08);}
        .sidebar-logo{height:28px;filter:brightness(0) invert(1);display:block;margin-bottom:16px;}
        .sidebar-partner{display:flex;align-items:center;gap:10px;}
        .sidebar-avatar{width:36px;height:36px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:white;}
        .sidebar-name{font-size:13px;font-weight:700;color:white;}
        .sidebar-tag{font-size:10px;color:rgba(255,255,255,0.4);}
        .sidebar-nav{flex:1;padding:16px 12px;display:flex;flex-direction:column;gap:4px;}
        .nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;color:rgba(255,255,255,0.6);text-decoration:none;cursor:pointer;border:none;background:none;width:100%;font-family:inherit;}
        .nav-item:hover{background:rgba(255,255,255,0.08);color:white;}
        .nav-item.active{background:var(--teal);color:white;}
        .nav-item .material-icons{font-size:20px;}
        .nav-divider{height:1px;background:rgba(255,255,255,0.08);margin:8px 0;}
        .main{margin-left:240px;min-height:100vh;}
        .topbar{background:white;padding:16px 28px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
        .content{padding:24px 28px;max-width:820px;}
        .crumb{font-size:12px;color:var(--muted);margin-bottom:10px;}
        .crumb a{color:var(--teal);text-decoration:none;font-weight:700;}
        .card{background:white;border:1px solid var(--border);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow-sm);margin-bottom:20px;}
        .card-title{font-size:15px;font-weight:800;margin:0 0 4px;display:flex;align-items:center;gap:8px;}
        .card-sub{font-size:12px;color:var(--muted);margin:0 0 18px;}
        label{display:block;font-size:11px;font-weight:700;color:var(--secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
        input[type=text],input[type=email],input[type=url]{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:inherit;color:var(--text);background:#f8fafc;outline:none;margin-bottom:14px;}
        input:focus{border-color:var(--teal);background:white;box-shadow:0 0 0 3px rgba(13,148,136,0.08);}
        .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
        .color-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
        .color-row input[type=color]{width:44px;height:38px;border:1px solid var(--border);border-radius:8px;padding:2px;background:white;cursor:pointer;}
        .color-row input[type=text]{margin-bottom:0;flex:1;font-family:'DM Mono',monospace;}
        .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:9px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;border:none;text-decoration:none;}
        .btn-teal{background:var(--teal);color:white;} .btn-teal:hover{background:var(--teal-dark);}
        .btn-outline{background:white;color:var(--secondary);border:1px solid var(--border);}
        .rel{font-family:'DM Mono',monospace;font-size:12px;color:var(--purple-text);background:var(--purple-bg);padding:2px 10px;border-radius:6px;font-weight:700;}
        .logo-prev{height:40px;max-width:180px;object-fit:contain;background:#0b1f3a;border-radius:8px;padding:6px 10px;margin-bottom:12px;display:none;}
        .status{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;}
        .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
        .muted{color:var(--muted);font-size:12px;}
        table.dns{width:100%;border-collapse:collapse;font-size:12px;min-width:420px;}
        table.dns th{text-align:left;color:var(--muted);font-weight:700;padding:6px 8px;}
        table.dns td{padding:8px;font-family:'DM Mono',monospace;background:#f8fafc;}
        .banner{padding:11px 14px;border-radius:10px;font-size:12px;margin-bottom:14px;}
        @media(max-width:768px){.sidebar{transform:translateX(-100%);}.main{margin-left:0;}.content{padding:16px;}.row{grid-template-columns:1fr;}}
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-header">
        <img src="/api/brand-logo" class="sidebar-logo">
        <div class="sidebar-partner"><div class="sidebar-avatar" id="sidebarAvatar">?</div>
            <div><div class="sidebar-name" id="sidebarName">Loading...</div><div class="sidebar-tag">Partner Portal</div></div></div>
    </div>
    <nav class="sidebar-nav">
        <a class="nav-item" id="navAgency" href="/partner/agency"><span class="material-icons">dashboard</span> Dashboard</a>
        <a class="nav-item active" href="#"><span class="material-icons">settings</span> Agency Settings</a>
        <div class="nav-divider"></div>
        <button class="nav-item" onclick="handleLogout()"><span class="material-icons">logout</span> Sign Out</button>
    </nav>
    <div style="padding:16px;font-size:10px;color:rgba(255,255,255,0.25);text-align:center;" data-brand-replace>PayProTec Partner Portal v1.0</div>
</div>

<div class="main">
    <div class="topbar">
        <a href="/partner/agency" id="backAgency" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--teal);font-weight:700;font-size:13px;"><span class="material-icons" style="font-size:18px;">arrow_back</span> Dashboard</a>
        <div style="font-size:1.1rem;font-weight:800;">Agency Settings</div>
    </div>
    <div class="content" id="content"><div class="muted" style="padding:30px;">Loading…</div></div>
</div>

<script>
const token = localStorage.getItem('pp_partner_token');
if (!token) window.location.href = '/partner';
function ppClearPartner(){ ['pp_partner_token','pp_partner_id','pp_impersonating','pp_active_portal','pp_active_sub_account','pp_active_company'].forEach(function(k){localStorage.removeItem(k);}); }
const portalId = new URLSearchParams(location.search).get('portal') || localStorage.getItem('pp_active_portal') || '';
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);}); }
function initials(n){ return (String(n||'?').trim().split(/\s+/).map(function(w){return w[0];}).slice(0,2).join('')||'?').toUpperCase(); }
function api(b){ return fetch('/api/whitelabel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({token:token,portal_id:portalId},b))}).then(r=>r.json()); }

var DATA=null, DOMAIN=null, CNAME='', CFREADY=false;

async function load(){
    if(!portalId){ document.getElementById('content').innerHTML='<div class="card"><div class="muted">No agency selected. Go to <a href="/partner/home" style="color:var(--teal);font-weight:700;">Home</a>.</div></div>'; return; }
    var r = await api({action:'get_agency_branding'});
    if(!r||!r.success){ if(r&&/session/i.test(r.message||'')){ppClearPartner();location.href='/partner';return;} document.getElementById('content').innerHTML='<div class="card"><div class="muted">'+esc((r&&r.message)||'Could not load.')+'</div></div>'; return; }
    DATA=r;
    // domain details (cname target, verification) via my_domain (owner-scoped)
    try{ var d=await fetch('/api/whitelabel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'my_domain',token:token})}).then(x=>x.json()); if(d&&d.success){ DOMAIN=d.domain; CNAME=d.cname_target||''; CFREADY=!!d.cloudflare_ready; } }catch(e){}
    if(r.domain && !DOMAIN) DOMAIN=r.domain;
    render();
}

function render(){
    var b=DATA.branding||{}; var cm=DATA.can_manage;
    document.getElementById('sidebarName').textContent = DATA.agency_name || DATA.relationship_id || 'Agency';
    document.getElementById('sidebarAvatar').textContent = initials(DATA.agency_name||'A');
    var ag = '/partner/agency?portal='+encodeURIComponent(portalId);
    document.getElementById('navAgency').href=ag; document.getElementById('backAgency').href=ag;

    var brandingCard =
      '<div class="card"><div class="card-title"><span class="material-icons" style="font-size:18px;color:var(--teal);">palette</span> Branding</div>'
      +'<div class="card-sub">How your white-label portal looks on your own domain.</div>'
      +'<label>Agency / brand name</label><input id="fName" type="text" value="'+esc(DATA.agency_name||'')+'" placeholder="e.g. Devvly Payments" '+(cm?'':'disabled')+'>'
      +'<label>Logo</label>'
      +'<img id="logoPrev" class="logo-prev" src="'+esc(b.logo_url||'')+'" onload="this.style.display=\'block\'" onerror="this.style.display=\'none\'">'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;">'
      +'<input id="fLogo" type="url" value="'+esc(b.logo_url||'')+'" placeholder="Upload or paste a URL" oninput="var p=document.getElementById(\'logoPrev\');p.src=this.value;p.style.display=this.value?\'block\':\'none\';" style="flex:1;min-width:200px;margin-bottom:0;" '+(cm?'':'disabled')+'>'
      +(cm?'<button class="btn btn-outline" type="button" onclick="document.getElementById(\'logoFile\').click()"><span class="material-icons" style="font-size:16px;">upload</span> Upload</button><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" style="display:none" onchange="uploadBrandAsset(\'fLogo\',this,\'logoPrev\')">':'')
      +'</div>'
      +'<label>Favicon</label>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">'
      +'<input id="fFav" type="url" value="'+esc(b.favicon_url||'')+'" placeholder="Upload or paste a URL" style="flex:1;min-width:200px;margin-bottom:0;" '+(cm?'':'disabled')+'>'
      +(cm?'<button class="btn btn-outline" type="button" onclick="document.getElementById(\'favFile\').click()"><span class="material-icons" style="font-size:16px;">upload</span> Upload</button><input id="favFile" type="file" accept="image/png,image/x-icon,image/svg+xml,image/vnd.microsoft.icon" style="display:none" onchange="uploadBrandAsset(\'fFav\',this,null)">':'')
      +'</div><div style="height:14px;"></div>'
      +'<div class="row">'
      +'<div><label>Primary color</label><div class="color-row"><input type="color" value="'+esc(b.color_primary||'#0d9488')+'" oninput="document.getElementById(\'fPrimary\').value=this.value" '+(cm?'':'disabled')+'><input id="fPrimary" type="text" value="'+esc(b.color_primary||'')+'" placeholder="#0d9488" '+(cm?'':'disabled')+'></div></div>'
      +'<div><label>Dark / sidebar color</label><div class="color-row"><input type="color" value="'+esc(b.color_dark||'#001e3c')+'" oninput="document.getElementById(\'fDark\').value=this.value" '+(cm?'':'disabled')+'><input id="fDark" type="text" value="'+esc(b.color_dark||'')+'" placeholder="#001e3c" '+(cm?'':'disabled')+'></div></div>'
      +'</div>'
      +'<div class="row">'
      +'<div><label>Accent color (optional)</label><div class="color-row"><input type="color" value="'+esc(b.color_accent||'#0f766e')+'" oninput="document.getElementById(\'fAccent\').value=this.value" '+(cm?'':'disabled')+'><input id="fAccent" type="text" value="'+esc(b.color_accent||'')+'" placeholder="#0f766e" '+(cm?'':'disabled')+'></div></div>'
      +'<div><label>Support email (optional)</label><input id="fSupport" type="email" value="'+esc(b.support_email||'')+'" placeholder="help@yourbrand.com" '+(cm?'':'disabled')+'></div>'
      +'</div>'
      +(cm?'<button class="btn btn-teal" onclick="saveBranding(this)"><span class="material-icons" style="font-size:16px;">save</span> Save branding</button> <span class="muted" style="margin-left:8px;">Applies to your custom domain.</span>':'<div class="muted">Only owners and admins can edit branding.</div>')
      +'</div>';

    document.getElementById('content').innerHTML =
      '<div class="crumb"><a href="/partner/home">Home</a> › <a href="'+ag+'">Agency</a> › Settings <span class="rel" style="margin-left:6px;">'+esc(DATA.relationship_id||'')+'</span></div>'
      + brandingCard
      + loginTemplateCard()
      + appThemeCard()
      + domainCard();
}
function appThemeCard(){
    var cm = DATA.can_manage;
    var cur = (DATA.branding && DATA.branding.app_theme) || 'default';
    var T = [
        {k:'default',name:'Default',sb:'#001e3c',ct:'#f8fafc',pn:'#fff'},
        {k:'gradient',name:'Gradient',sb:'linear-gradient(180deg,#001e3c,#0d9488)',ct:'#eef4f3',pn:'#fff'},
        {k:'soft',name:'Soft',sb:'#001e3c',ct:'#f4f6f8',pn:'#fff',round:true},
        {k:'minimal',name:'Minimal',sb:'#001e3c',ct:'#fff',pn:'#fff',border:true},
        {k:'elevated',name:'Elevated',sb:'#001e3c',ct:'#eef1f5',pn:'#fff',shadow:true},
        {k:'tinted',name:'Tinted',sb:'linear-gradient(180deg,#001e3c,#00355f)',ct:'#eef6f5',pn:'#fff'},
        {k:'contrast',name:'Contrast',sb:'#0a0f1c',ct:'#f1f3f6',pn:'#fff',border:true},
        {k:'pop',name:'Pop',sb:'#001e3c',ct:'#f6f7fb',pn:'#fff',top:true},
        {k:'paper',name:'Paper',sb:'#001e3c',ct:'#faf7f2',pn:'#fffdf9'},
        {k:'aurora',name:'Aurora',sb:'linear-gradient(180deg,#001e3c,#0f766e)',ct:'linear-gradient(120deg,#f8fafc,#e6f4f1,#eef2ff)',pn:'#fff'}
    ];
    var cards = T.map(function(t){
        var sel=t.k===cur;
        var pnStyle='position:absolute;left:38%;right:12%;top:22%;height:44%;background:'+t.pn+';border-radius:'+(t.round?'5px':'3px')+';'+(t.border?'border:1px solid #e2e8f0;':'')+(t.shadow?'box-shadow:0 4px 10px rgba(0,0,0,0.15);':'')+(t.top?'border-top:2px solid #0d9488;':'');
        var check = sel?'<span style="position:absolute;top:4px;right:4px;background:var(--teal);color:#fff;border-radius:99px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;z-index:2;"><span class="material-icons" style="font-size:12px;">check</span></span>':'';
        return '<div '+(cm?'onclick="saveAppTheme(\''+t.k+'\')"':'')+' style="cursor:'+(cm?'pointer':'default')+';border:2px solid '+(sel?'var(--teal)':'transparent')+';border-radius:12px;padding:4px;">'
          +'<div style="position:relative;height:64px;border-radius:9px;overflow:hidden;background:'+t.ct+';">'+check
          +'<span style="position:absolute;left:0;top:0;bottom:0;width:26%;background:'+t.sb+';"></span>'
          +'<span style="'+pnStyle+'"></span></div>'
          +'<div style="text-align:center;font-size:11px;font-weight:700;margin-top:5px;color:'+(sel?'var(--teal)':'var(--secondary)')+';">'+t.name+'</div></div>';
    }).join('');
    return '<div class="card"><div class="card-title"><span class="material-icons" style="font-size:18px;color:var(--teal);">palette</span> App Theme</div>'
      +'<div class="card-sub">The look inside your portal &amp; CRM (sidebar, background, panels). Uses your brand colors, with subtle animations.</div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;">'+cards+'</div>'
      +(cm?'':'<div class="muted" style="margin-top:12px;">Only owners and admins can change the theme.</div>')
      +'</div>';
}
// Keep the per-host brand cache (read by brand-boot.js on next load) in sync so a
// just-changed theme/template doesn't flash the previous value.
function bumpBrandCache(obj){ try{ var k='pp_brand:'+location.hostname; var c=JSON.parse(localStorage.getItem(k)||'null'); if(c){ Object.assign(c,obj); localStorage.setItem(k, JSON.stringify(c)); } }catch(e){} }
window.saveAppTheme = async function(k){
    DATA.branding = DATA.branding || {}; DATA.branding.app_theme = k;
    document.documentElement.setAttribute('data-app-theme', k); // reflect live on this page too
    bumpBrandCache({app_theme:k});
    render();
    var r = await api({action:'save_agency_branding', branding:{app_theme:k}});
    if(!r||!r.success){ Swal.fire('Error',(r&&r.message)||'Could not save.','error'); }
    else Swal.fire({icon:'success',title:'Theme saved',timer:900,showConfirmButton:false});
};
window.saveLoginCopy = async function(){
    var copy = { tag:val('lcTag'), heading:val('lcHeading'), sub:val('lcSub'), button:val('lcButton'), tagline:val('lcTagline') };
    DATA.branding = DATA.branding || {}; DATA.branding.login_copy = copy;
    bumpBrandCache({login_copy:copy});
    var r = await api({action:'save_agency_branding', branding:{login_copy:copy}});
    if(!r||!r.success){ Swal.fire('Error',(r&&r.message)||'Could not save.','error'); }
    else Swal.fire({icon:'success',title:'Wording saved',timer:900,showConfirmButton:false});
};

function loginTemplateCard(){
    var cm = DATA.can_manage;
    var cur = (DATA.branding && DATA.branding.login_template) || 'classic';
    var lc = (DATA.branding && DATA.branding.login_copy) || {};
    var tpls = [
        {k:'classic',name:'Classic',css:'background:linear-gradient(135deg,#001e3c,#0d9488);'},
        {k:'split',name:'Split',css:'background:#fff;',extra:'<span style="position:absolute;left:0;top:0;bottom:0;width:45%;background:linear-gradient(160deg,#001e3c,#0d9488);"></span>'},
        {k:'glass',name:'Glass',css:'background:linear-gradient(135deg,#001e3c,#0d9488);',extra:'<span style="position:absolute;inset:22% 25%;background:rgba(255,255,255,0.3);border:1px solid rgba(255,255,255,0.6);border-radius:6px;"></span>'},
        {k:'minimal',name:'Minimal',css:'background:#f6f7f9;',extra:'<span style="position:absolute;inset:25% 22%;background:#fff;border:1px solid #e6e8ec;border-radius:6px;"></span>'},
        {k:'dark',name:'Dark',css:'background:#0b1020;',extra:'<span style="position:absolute;inset:25% 22%;background:#111827;border:1px solid #1f2937;border-radius:6px;"></span>'},
        {k:'mesh',name:'Mesh',css:'background:radial-gradient(circle at 20% 20%,#0d9488,transparent 60%),radial-gradient(circle at 80% 80%,#001e3c,transparent 60%),#0b1020;'},
        {k:'spotlight',name:'Spotlight',css:'background:radial-gradient(circle at 50% 30%,rgba(255,255,255,0.16),transparent 45%),#0a0f1c;',extra:'<span style="position:absolute;inset:28% 26%;background:#fff;border-radius:6px;"></span>'},
        {k:'aurora',name:'Aurora',css:'background:radial-gradient(40% 40% at 20% 25%,rgba(13,148,136,.7),transparent),radial-gradient(45% 45% at 80% 25%,rgba(99,102,241,.6),transparent),radial-gradient(45% 55% at 50% 95%,rgba(236,72,153,.5),transparent),#0b1224;'},
        {k:'corporate',name:'Corporate',css:'background:#eef1f5;',extra:'<span style="position:absolute;inset:25% 22%;background:#fff;border-top:3px solid #0d9488;border-radius:4px;"></span>'},
        {k:'bold',name:'Bold',css:'background:linear-gradient(140deg,#0d9488,#001e3c);',extra:'<span style="position:absolute;left:30%;right:30%;bottom:20%;height:28%;background:#fff;border-radius:5px;"></span>'}
    ];
    var cards = tpls.map(function(t){
        var sel = t.k===cur;
        var check = sel ? '<span style="position:absolute;top:4px;right:4px;background:var(--teal);color:#fff;border-radius:99px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;"><span class="material-icons" style="font-size:12px;">check</span></span>' : '';
        return '<div '+(cm?'onclick="saveLoginTemplate(\''+t.k+'\')"':'')+' style="cursor:'+(cm?'pointer':'default')+';border:2px solid '+(sel?'var(--teal)':'transparent')+';border-radius:12px;padding:4px;">'
          +'<div style="position:relative;height:72px;border-radius:9px;overflow:hidden;'+t.css+'">'+(t.extra||'')+check+'</div>'
          +'<div style="text-align:center;font-size:11px;font-weight:700;margin-top:5px;color:'+(sel?'var(--teal)':'var(--secondary)')+';">'+t.name+'</div></div>';
    }).join('');
    var openLink = (DOMAIN && DOMAIN.host) ? ' · <a href="https://'+esc(DOMAIN.host)+'/partner" target="_blank" style="color:var(--teal);font-weight:700;">Open login ↗</a>' : '';
    return '<div class="card"><div class="card-title"><span class="material-icons" style="font-size:18px;color:var(--teal);">wallpaper</span> Login Screen</div>'
      +'<div class="card-sub">Pick a preset design for your branded login page — it uses your logo &amp; colors. Custom CSS/JS is coming later.</div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;">'+cards+'</div>'
      +'<label style="display:flex;align-items:center;gap:8px;margin-top:16px;font-size:13px;font-weight:600;color:var(--text);cursor:'+(cm?'pointer':'default')+';text-transform:none;letter-spacing:0;"><input type="checkbox" id="fPoweredBy"'+(((DATA.branding&&DATA.branding.login_powered_by)!==false)?' checked':'')+' '+(cm?'onchange="saveLoginPoweredBy(this.checked)"':'disabled')+'> Show “Powered by PayProTec” on the login screen</label>'
      +'<div style="border-top:1px solid #f1f5f9;margin-top:16px;padding-top:14px;">'
      +'<div style="font-size:12px;font-weight:800;margin-bottom:8px;">Login wording</div>'
      +'<div class="row"><div><label>Badge</label><input id="lcTag" type="text" value="'+esc(lc.tag||'')+'" placeholder="Partner Portal" '+(cm?'':'disabled')+'></div><div><label>Heading</label><input id="lcHeading" type="text" value="'+esc(lc.heading||'')+'" placeholder="Sign in" '+(cm?'':'disabled')+'></div></div>'
      +'<label>Subheading</label><input id="lcSub" type="text" value="'+esc(lc.sub||'')+'" placeholder="Access your merchant portfolio" '+(cm?'':'disabled')+'>'
      +'<div class="row"><div><label>Button text</label><input id="lcButton" type="text" value="'+esc(lc.button||'')+'" placeholder="Sign In" '+(cm?'':'disabled')+'></div><div><label>Panel tagline (split / bold)</label><input id="lcTagline" type="text" value="'+esc(lc.tagline||'')+'" placeholder="Sign in to your dedicated partner portal." '+(cm?'':'disabled')+'></div></div>'
      +(cm?'<button class="btn btn-teal" onclick="saveLoginCopy()"><span class="material-icons" style="font-size:16px;">save</span> Save wording</button>':'')
      +'</div>'
      +(cm?'<div class="muted" style="margin-top:12px;">Applies to your custom domain login.'+openLink+'</div>':'<div class="muted" style="margin-top:12px;">Only owners and admins can change the login design.</div>')
      +'</div>';
}

function domainCard(){
    var cm=DATA.can_manage;
    var inner;
    if(!CFREADY){
        inner='<div class="banner" style="background:#fffbeb;border:1px solid #fde68a;color:#92400e;">Custom domains aren’t enabled yet on the platform. Contact support to turn on white-label domains.</div>';
    } else if(!DOMAIN){
        inner='<label>Connect your domain</label><div style="display:flex;gap:8px;flex-wrap:wrap;"><input id="fHost" type="text" placeholder="app.yourbrand.com" style="flex:1;min-width:200px;margin-bottom:0;" '+(cm?'':'disabled')+'>'
          +(cm?'<button class="btn btn-teal" onclick="addDomain(this)"><span class="material-icons" style="font-size:16px;">add_link</span> Connect</button>':'')+'</div>'
          +'<div class="muted" style="margin-top:8px;">Use a subdomain you control (e.g. <code>app.</code>). One DNS record; SSL is automatic.</div>';
    } else {
        var st=DOMAIN.ssl_status||DOMAIN.status;
        var label = st==='active'?['Live','#059669','#22c55e']
          :(st==='ssl_pending'?['Issuing SSL…','#b45309','#f59e0b']
          :(st==='vercel_pending'?['Action needed','#b45309','#f59e0b']
          :['Waiting for DNS','#b45309','#f59e0b']));
        inner='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">'
          +'<div><div style="font-weight:800;font-size:15px;">'+esc(DOMAIN.host)+'</div><div class="status" style="color:'+label[1]+';margin-top:3px;"><span class="dot" style="background:'+label[2]+';"></span>'+label[0]+'</div></div>'
          +(cm?'<div style="display:flex;gap:8px;"><button class="btn btn-outline" onclick="refreshDomain(this)"><span class="material-icons" style="font-size:16px;">refresh</span> Check status</button><button class="btn btn-outline" style="color:#b91c1c;border-color:#fecaca;" onclick="removeDomain()">Remove</button></div>':'')+'</div>';
        if(st!=='active'){
            var recs=asBuildRecords(DOMAIN, CNAME);
            var pending=recs.filter(function(r){return !r.done;}).length;
            var hdr;
            if(pending) hdr='<div style="font-size:12px;color:#b45309;font-weight:700;margin:12px 0 10px;">'+pending+' record'+(pending===1?'':'s')+' still need'+(pending===1?'s':'')+' to verify.</div>';
            else if(st==='ssl_pending') hdr='<div style="font-size:12px;color:#b45309;font-weight:700;margin:12px 0 10px;">✅ DNS verified — issuing your SSL certificate automatically. This can take a few minutes; click Check status.</div>';
            else hdr='<div style="font-size:12px;color:#059669;font-weight:700;margin:12px 0 10px;">All records verified. 🎉</div>';
            inner+='<div style="margin-top:14px;padding-top:14px;border-top:1px solid #f1f5f9;">'
              +'<div style="font-size:12px;font-weight:800;margin-bottom:4px;">Add the record(s) below at your domain provider</div>'
              +'<div class="muted" style="margin-bottom:10px;">Usually just the <b>CNAME</b> — SSL is issued automatically (no TXT). Any extra record required appears here with its own status.</div>'
              +hdr+recs.map(asRecordRow).join('')
              +(st==='dns_pending'?'<div class="muted" style="margin-top:6px;">If your DNS is on Cloudflare, set this CNAME to <b>DNS only</b> (grey cloud), not proxied. New records can take a few minutes to propagate — click Check status again shortly.</div>':'')
              +'</div>';
        }
    }
    return '<div class="card"><div class="card-title"><span class="material-icons" style="font-size:18px;color:var(--teal);">public</span> Custom Domain</div>'
      +'<div class="card-sub">Run the portal on your own branded URL.</div>'+inner+'</div>';
}
// Full record list from the domain's verification state — each independently tracked.
function asBuildRecords(d, target){
    var v=d.verification||{}; var cfActive=(v.cf_status==='active'); var sslActive=(v.ssl_status==='active');
    var vc=v.vercel||null;
    var recs=[{type:'CNAME', name:d.host, value:target||'(set by support)', purpose:'Points your domain to the platform', done:cfActive}];
    if(v.ownership&&v.ownership.name&&v.ownership.value) recs.push({type:(v.ownership.type||'TXT').toUpperCase(), name:v.ownership.name, value:v.ownership.value, purpose:'Verifies you own the domain', done:cfActive});
    (v.dcv||[]).forEach(function(r){ if(r.txt_name&&r.txt_value) recs.push({type:'TXT', name:r.txt_name, value:r.txt_value, purpose:'Issues the SSL certificate', done:sslActive}); });
    if(vc&&vc.configured&&!vc.verified) (vc.verification||[]).forEach(function(r){ if(r.value) recs.push({type:(r.type||'TXT').toUpperCase(), name:r.name||('_vercel.'+d.host.split('.').slice(1).join('.')), value:r.value, purpose:'Confirms domain ownership (one-time — this domain is registered elsewhere)', done:false}); });
    return recs;
}
function asRecordRow(r){
    var pill=r.done
      ?'<span style="display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:99px;background:#ecfdf5;color:#059669;font-size:11px;font-weight:800;"><span class="material-icons" style="font-size:13px;">check_circle</span> Verified</span>'
      :'<span style="display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:99px;background:#fffbeb;color:#b45309;font-size:11px;font-weight:800;"><span class="material-icons" style="font-size:13px;">schedule</span> Pending</span>';
    var mono='font-family:monospace;word-break:break-all;';
    return '<div style="border:1px solid '+(r.done?'#d1fae5':'#e2e8f0')+';border-radius:12px;padding:12px 14px;margin-bottom:10px;background:'+(r.done?'#f6fefb':'#fff')+';">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;"><div style="font-size:11px;font-weight:800;color:var(--muted,#64748b);">'+esc(r.purpose)+'</div>'+pill+'</div>'
      +'<div style="display:grid;grid-template-columns:64px 1fr;gap:6px 10px;font-size:12px;align-items:center;">'
        +'<div style="color:#64748b;font-weight:700;">Type</div><div style="'+mono+'font-weight:700;">'+esc(r.type)+'</div>'
        +'<div style="color:#64748b;font-weight:700;">Name</div><div style="'+mono+'"><span onclick="asCopy(this,\''+esc(r.name).replace(/'/g,"\\'")+'\')" title="Copy" style="cursor:pointer;">'+esc(r.name)+' <span class="material-icons" style="font-size:13px;vertical-align:-2px;color:#94a3b8;">content_copy</span></span></div>'
        +'<div style="color:#64748b;font-weight:700;">Value</div><div style="'+mono+'"><span onclick="asCopy(this,\''+esc(r.value).replace(/'/g,"\\'")+'\')" title="Copy" style="cursor:pointer;">'+esc(r.value)+' <span class="material-icons" style="font-size:13px;vertical-align:-2px;color:#94a3b8;">content_copy</span></span></div>'
      +'</div></div>';
}
window.asCopy=function(el,val){ try{ navigator.clipboard.writeText(val); var ic=el.querySelector('.material-icons'); if(ic){ var o=ic.textContent; ic.textContent='check'; setTimeout(function(){ic.textContent=o;},1200);} }catch(e){} };

window.saveBranding = async function(btn){
    btn.disabled=true;
    var branding={ logo_url:val('fLogo'), favicon_url:val('fFav'), color_primary:val('fPrimary'), color_dark:val('fDark'), color_accent:val('fAccent'), support_email:val('fSupport') };
    var r=await api({action:'save_agency_branding', agency_name:val('fName'), branding:branding});
    btn.disabled=false;
    if(r&&r.success){ Swal.fire({icon:'success',title:'Saved',timer:1000,showConfirmButton:false}); }
    else Swal.fire('Error',(r&&r.message)||'Could not save.','error');
};
function val(id){ var e=document.getElementById(id); return e?e.value:''; }
window.uploadBrandAsset = async function(fieldId, input, prevId){
    var file = input.files && input.files[0]; if(!file) return;
    if(file.size > 3*1024*1024){ Swal.fire('Too large','Please use an image under 3 MB.','warning'); input.value=''; return; }
    var field = document.getElementById(fieldId);
    var prev = prevId ? document.getElementById(prevId) : null;
    var oldPh = field ? field.placeholder : '';
    if(field){ field.disabled=true; field.placeholder='Uploading…'; }
    try{
        var s = await api({action:'get_brand_upload_url', file_type:file.type});
        if(!s||!s.success||!s.upload_url) throw new Error((s&&s.message)||'Could not start upload.');
        var put = await fetch(s.upload_url,{method:'PUT',headers:{'Content-Type':file.type,'x-upsert':'true'},body:file});
        if(!put.ok) throw new Error('Upload failed ('+put.status+').');
        if(field){ field.value=s.public_url; }
        if(prev){ prev.src=s.public_url; prev.style.display='block'; }
        Swal.fire({icon:'success',title:'Uploaded',text:'Click “Save branding” to apply.',timer:1400,showConfirmButton:false});
    }catch(e){
        Swal.fire('Upload error', e.message||'Could not upload the image.','error');
    }finally{
        if(field){ field.disabled=false; field.placeholder=oldPh; }
        input.value='';
    }
};
window.addDomain = async function(btn){
    var host=(val('fHost')||'').trim(); if(!host) return; btn.disabled=true;
    var r=await fetch('/api/whitelabel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'add_domain',token:token,host:host})}).then(x=>x.json());
    btn.disabled=false;
    if(!r||!r.success){ Swal.fire('Error',(r&&r.message)||'Could not connect.','error'); return; }
    DOMAIN={host:r.host,ssl_status:r.status,verification:r.verification,active:r.active}; CNAME=r.cname_target||CNAME; render();
    Swal.fire({icon:'success',title:'Domain connected',text:'Add the DNS record shown, then Check status.',timer:2200,showConfirmButton:false});
};
window.refreshDomain = async function(btn){
    btn.disabled=true;
    var r=await fetch('/api/whitelabel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'refresh_domain',token:token})}).then(x=>x.json());
    btn.disabled=false;
    if(!r||!r.success){ Swal.fire('Error',(r&&r.message)||'Error.','error'); return; }
    DOMAIN={host:r.host,ssl_status:r.status,verification:r.verification,active:r.active}; render();
    if(r.status==='active') Swal.fire({icon:'success',title:'Your domain is live! 🎉',timer:1800,showConfirmButton:false});
};
window.removeDomain = async function(){
    var c=await Swal.fire({icon:'warning',title:'Remove domain?',showCancelButton:true,confirmButtonText:'Remove',confirmButtonColor:'#dc2626'});
    if(!c.isConfirmed) return;
    await fetch('/api/whitelabel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'remove_domain',token:token})}).then(x=>x.json());
    DOMAIN=null; render();
};
