<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/js/pp-session.js?v=20260812b"></script>
    <script src="/js/brand-boot.js?v=20260812b"></script>
    <script src="/js/world-transition.js?v=20260812b"></script>
    <link rel="icon" href="/api/favicon" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency | PayProTec Partner Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root {
            --teal:#0d9488; --teal-dark:#0f766e; --teal-bg:#f0fdfa;
            --navy:#001e3c; --border:#e2e8f0; --surface:#f8fafc;
            --text:#0a1628; --secondary:#475569; --muted:#94a3b8;
            --green-bg:#dcfce7; --green-text:#166534; --amber-bg:#fef3c7; --amber-text:#92400e;
            --purple-bg:#ede9fe; --purple-text:#6d28d9;
            --shadow-sm:0 1px 3px rgba(0,0,0,0.06); --shadow-md:0 4px 16px rgba(0,0,0,0.07);
        }
        body { margin:0; font-family:'DM Sans',sans-serif; background:var(--surface); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; }
        .sidebar { position:fixed; top:0; left:0; width:240px; height:100vh; background:var(--navy); display:flex; flex-direction:column; z-index:100; box-shadow:4px 0 20px rgba(0,0,0,0.15); }
        .sidebar-header { padding:24px 20px 20px; border-bottom:1px solid rgba(255,255,255,0.08); }
        .sidebar-logo { height:28px; filter:brightness(0) invert(1); display:block; margin-bottom:16px; }
        .sidebar-partner { display:flex; align-items:center; gap:10px; }
        .sidebar-avatar { width:36px; height:36px; border-radius:50%; background:var(--teal); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; color:white; }
        .sidebar-name { font-size:13px; font-weight:700; color:white; }
        .sidebar-tag { font-size:10px; color:rgba(255,255,255,0.4); }
        .sidebar-nav { flex:1; padding:16px 12px; display:flex; flex-direction:column; gap:4px; }
        .nav-item { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; font-size:13px; font-weight:600; color:rgba(255,255,255,0.6); text-decoration:none; cursor:pointer; border:none; background:none; width:100%; font-family:inherit; }
        .nav-item:hover { background:rgba(255,255,255,0.08); color:white; }
        .nav-item.active { background:var(--teal); color:white; }
        .nav-item .material-icons { font-size:20px; }
        .nav-divider { height:1px; background:rgba(255,255,255,0.08); margin:8px 0; }
        .main { margin-left:240px; min-height:100vh; }
        .topbar { background:white; padding:16px 28px; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
        .content { padding:24px 28px; max-width:1150px; }
        .crumb { font-size:12px; color:var(--muted); margin-bottom:4px; }
        .crumb a { color:var(--teal); text-decoration:none; font-weight:700; }
        .hero { background:linear-gradient(135deg,var(--navy),#00355f); color:white; border-radius:20px; padding:24px 26px; margin-bottom:22px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
        .hero-left { display:flex; align-items:center; gap:16px; }
        .hero-icon { width:56px; height:56px; border-radius:15px; background:rgba(255,255,255,0.12); display:flex; align-items:center; justify-content:center; }
        .hero-icon .material-icons { font-size:30px; }
        .hero h2 { margin:0 0 4px; font-size:1.5rem; font-weight:800; }
        .rel { font-family:'DM Mono',monospace; font-size:12px; background:rgba(255,255,255,0.15); padding:2px 10px; border-radius:6px; font-weight:700; }
        .dstatus { font-size:12px; font-weight:700; display:inline-flex; align-items:center; gap:5px; margin-top:6px; color:rgba(255,255,255,0.75); }
        .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
        .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
        .kpi { background:white; border:1px solid var(--border); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow-sm); }
        .kpi-label { font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:8px; display:flex; align-items:center; gap:5px; }
        .kpi-value { font-size:1.7rem; font-weight:800; font-family:'DM Mono',monospace; line-height:1; }
        .section-label { font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:0.8px; margin:22px 0 12px; display:flex; align-items:center; justify-content:space-between; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
        .sa-card { background:white; border:1px solid var(--border); border-radius:14px; padding:16px; box-shadow:var(--shadow-sm); cursor:pointer; transition:box-shadow .2s, transform .1s; border-top:4px solid var(--teal); }
        .sa-card.client { border-top-color:#cbd5e1; }
        .sa-card:hover { box-shadow:var(--shadow-md); transform:translateY(-1px); }
        .sa-name { font-size:15px; font-weight:800; display:flex; align-items:center; gap:8px; }
        .sa-name .material-icons { font-size:18px; color:var(--teal); }
        .sa-stats { display:flex; gap:14px; margin-top:12px; }
        .sa-stat b { font-family:'DM Mono',monospace; font-size:15px; display:block; }
        .sa-stat span { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; }
        .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:9px; font-size:12px; font-weight:700; font-family:inherit; cursor:pointer; border:none; text-decoration:none; }
        .btn-teal { background:var(--teal); color:white; } .btn-teal:hover { background:var(--teal-dark); }
        .btn-outline { background:white; color:var(--secondary); border:1px solid var(--border); }
        .panel { background:white; border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-sm); padding:16px 18px; }
        .member-row { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid #f1f5f9; }
        .member-row:last-child { border-bottom:none; }
        .role-badge { font-size:10px; font-weight:800; padding:2px 9px; border-radius:99px; text-transform:uppercase; letter-spacing:0.4px; }
        .role-owner { background:var(--purple-bg); color:var(--purple-text); }
        .role-admin { background:#f1f5f9; color:#475569; }
        .role-sub { background:var(--amber-bg); color:var(--amber-text); }
        .empty { padding:40px; text-align:center; color:var(--muted); }
        .empty .material-icons { font-size:40px; opacity:0.3; display:block; margin:0 auto 8px; }
        @media (max-width:900px){ .kpi-grid{grid-template-columns:1fr 1fr;} }
        @media (max-width:768px){ .sidebar{transform:translateX(-100%);} .main{margin-left:0;} .content{padding:16px;} }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-header">
        <img src="/api/brand-logo" class="sidebar-logo">
        <div class="sidebar-partner">
            <div class="sidebar-avatar" id="sidebarAvatar">?</div>
            <div><div class="sidebar-name" id="sidebarName">Loading...</div><div class="sidebar-tag">Partner Portal</div></div>
        </div>
    </div>
    <nav class="sidebar-nav">
        <a class="nav-item active" href="#"><span class="material-icons">dashboard</span> Dashboard</a>
        <a class="nav-item" id="navAgencySettings" href="/partner/agency-settings"><span class="material-icons">settings</span> Agency Settings</a>
        <div class="nav-divider"></div>
        <button class="nav-item" onclick="handleLogout()"><span class="material-icons">logout</span> Sign Out</button>
    </nav>
    <div style="padding:16px;font-size:10px;color:rgba(255,255,255,0.25);text-align:center;" data-brand-replace>PayProTec Partner Portal v1.0</div>
</div>

<div class="main">
    <div class="topbar">
        <a href="/partner/home" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--teal);font-weight:700;font-size:13px;"><span class="material-icons" style="font-size:18px;">arrow_back</span> Back to Home</a>
        <div style="font-size:1.1rem;font-weight:800;">Dashboard</div>
    </div>
    <div class="content" id="content"><div style="color:var(--muted);padding:40px;">Loading agency…</div></div>
</div>

<script>
const token = localStorage.getItem('pp_partner_token');
if (!token) window.location.href = '/partner';
function ppClearPartner(){ ['pp_partner_token','pp_partner_id','pp_impersonating','pp_active_portal','pp_active_sub_account','pp_active_company'].forEach(function(k){localStorage.removeItem(k);}); }
const portalId = new URLSearchParams(location.search).get('portal') || localStorage.getItem('pp_active_portal') || '';

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);}); }
function initials(n){ return (String(n||'?').trim().split(/\s+/).map(function(w){return w[0];}).slice(0,2).join('')||'?').toUpperCase(); }

function domainLine(ag){
    if (!ag.agency_enabled) return '<span class="dstatus"><span class="dot" style="background:#cbd5e1;"></span> White-label off</span>';
    var d = ag.domain;
    if (d && d.ssl_status==='active') return '<span class="dstatus"><span class="dot" style="background:#22c55e;"></span> '+esc(d.host)+' · Live</span>';
    if (d) return '<span class="dstatus"><span class="dot" style="background:#f59e0b;"></span> '+esc(d.host)+' · setting up</span>';
    return '<span class="dstatus"><span class="dot" style="background:#f59e0b;"></span> No domain yet</span>';
}
window.enterSub = function(subId){ localStorage.setItem('pp_active_portal', portalId); localStorage.setItem('pp_active_sub_account', subId); location.href='/partner/sub-account?sub='+encodeURIComponent(subId); };

async function openCreateSub(){
    var comps = [];
    try { var r = await fetch('/api/whitelabel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'my_companies',token:token,portal_id:portalId})}).then(x=>x.json()); if(r&&r.success) comps=r.companies||[]; } catch(e){}
    var opts = comps.map(function(c){ return '<option value="'+esc(c.company_id)+'">'+esc(c.company_name)+'</option>'; }).join('');
    var html =
      '<div style="text-align:left;font-size:13px;">'
      +'<label style="font-weight:700;display:block;margin-bottom:6px;">CRM type</label>'
      +'<select id="scType" class="swal2-select" style="width:100%;margin:0 0 12px;" onchange="document.getElementById(\'scCompanyWrap\').style.display=this.value===\'company\'?\'block\':\'none\';document.getElementById(\'scNameWrap\').style.display=this.value===\'client\'?\'block\':\'none\';">'
      +'<option value="company">One of my companies</option><option value="client">New client (not a PayProTec partner)</option></select>'
      +'<div id="scCompanyWrap">'+(comps.length?'<label style="font-weight:700;display:block;margin-bottom:6px;">Company</label><select id="scCompany" class="swal2-select" style="width:100%;margin:0;">'+opts+'</select>':'<div style="color:#94a3b8;">All companies added, or none available. Use “New client”.</div>')+'</div>'
      +'<div id="scNameWrap" style="display:none;"><label style="font-weight:700;display:block;margin-bottom:6px;">Client name</label><input id="scName" class="swal2-input" style="width:100%;margin:0;" placeholder="e.g. Downtown Diner"></div></div>';
    var res = await Swal.fire({ title:'New CRM', html:html, showCancelButton:true, confirmButtonText:'Create', confirmButtonColor:'#0d9488', focusConfirm:false,
        preConfirm:function(){ var t=document.getElementById('scType').value; if(t==='company'){ var el=document.getElementById('scCompany'); if(!el||!el.value){Swal.showValidationMessage('No company available — use New client.');return false;} return {company_id:el.value}; } var nm=(document.getElementById('scName').value||'').trim(); if(!nm){Swal.showValidationMessage('Enter a client name.');return false;} return {name:nm}; } });
    if(!res.isConfirmed) return;
    var cr = await fetch('/api/whitelabel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({action:'create_sub_account',token:token,portal_id:portalId},res.value))}).then(x=>x.json());
    if(!cr||!cr.success){ Swal.fire('Error',(cr&&cr.message)||'Could not create.','error'); return; }
    load();
}

async function load(){
    if (!portalId){ document.getElementById('content').innerHTML='<div class="empty"><span class="material-icons">apartment</span>No agency selected. Go to <a href="/partner/home" style="color:var(--teal);font-weight:700;">Home</a>.</div>'; return; }
    var r;
    try { r = await fetch('/api/whitelabel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'get_agency_overview',token:token,portal_id:portalId})}).then(x=>x.json()); }
    catch(e){ r=null; }
    if (!r || !r.success){
        if (r && /session/i.test(r.message||'')){ ppClearPartner(); location.href='/partner'; return; }
        document.getElementById('content').innerHTML='<div class="empty"><span class="material-icons">error_outline</span>'+esc((r&&r.message)||'Could not load agency.')+'</div>'; return;
    }
    localStorage.setItem('pp_active_portal', portalId);
    localStorage.removeItem('pp_active_sub_account');
    var ag = r.agency, k = r.kpis;
    var title = ag.agency_name || ag.relationship_id || 'My Agency';
    document.getElementById('sidebarName').textContent = title;
    document.getElementById('sidebarAvatar').textContent = initials(title);

    var subCards = (r.sub_accounts||[]).map(function(s){
        return '<div class="sa-card '+(s.type==='client'?'client':'')+'" onclick="enterSub(\''+s.id+'\')">'
          +'<div class="sa-name"><span class="material-icons">'+(s.type==='company'?'business':'person')+'</span>'+esc(s.name)+'</div>'
          +'<div class="sa-stats">'
          +'<div class="sa-stat"><b>'+s.merchants.toLocaleString()+'</b><span>Merchants</span></div>'
          +'<div class="sa-stat"><b>'+s.partner_ids+'</b><span>Partner IDs</span></div>'
          +'<div class="sa-stat"><b>'+s.sub_agents+'</b><span>Sub-Agents</span></div>'
          +'</div></div>';
    }).join('') || '<div class="empty"><span class="material-icons">workspaces</span>No CRMs yet.'+(ag.can_manage?' Add your first below.':'')+'</div>';

    window._agencyCanManage = ag.can_manage;
    window._agencyName = ag.agency_name || '';

    document.getElementById('content').innerHTML =
      '<div class="crumb"><a href="/partner/home">Home</a> › Agency</div>'
      +'<div class="hero"><div class="hero-left"><div class="hero-icon"><span class="material-icons">apartment</span></div>'
      +'<div><h2>'+esc(title)+(ag.can_manage?' <span class="material-icons" title="Rename agency" onclick="renameAgency()" style="font-size:17px;cursor:pointer;opacity:0.7;vertical-align:middle;">edit</span>':'')+' <span class="rel">'+esc(ag.relationship_id||'')+'</span></h2>'+domainLine(ag)+'</div></div>'
      +(ag.can_manage?'<a class="btn btn-outline" style="background:rgba(255,255,255,0.12);color:white;border-color:rgba(255,255,255,0.25);" href="/partner/agency-settings?portal='+encodeURIComponent(portalId)+'"><span class="material-icons" style="font-size:16px;">settings</span> Agency Settings</a>':'')
      +'</div>'
      +'<div class="kpi-grid">'
      +'<div class="kpi"><div class="kpi-label"><span class="material-icons" style="font-size:13px;">workspaces</span> CRMs</div><div class="kpi-value">'+k.sub_accounts+'</div></div>'
      +'<div class="kpi"><div class="kpi-label"><span class="material-icons" style="font-size:13px;">storefront</span> Merchants</div><div class="kpi-value">'+k.merchants.toLocaleString()+'</div></div>'
      +'<div class="kpi"><div class="kpi-label"><span class="material-icons" style="font-size:13px;">badge</span> Partner IDs</div><div class="kpi-value">'+k.partner_ids+'</div></div>'
      +'<div class="kpi"><div class="kpi-label"><span class="material-icons" style="font-size:13px;">account_tree</span> Sub-Agents</div><div class="kpi-value">'+k.sub_agents+'</div></div>'
      +'</div>'
      +'<div class="section-label"><span>CRMs</span>'+(ag.can_manage?'<button class="btn btn-teal" onclick="openCreateSub()"><span class="material-icons" style="font-size:15px;">add</span> Add CRM</button>':'')+'</div>'
      +'<div class="grid">'+subCards+'</div>'
      +'<div class="section-label"><span>Agency Calendar</span><span style="font-size:11px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;">All bookings across every CRM</span></div>'
      +'<div class="panel" id="agCalPanel"><div style="color:var(--muted);font-size:13px;">Loading calendar…</div></div>'
      +'<div class="section-label"><span>Team &amp; Visibility</span></div>'
      +'<div class="panel" id="teamPanel"><div style="color:var(--muted);font-size:13px;">Loading team…</div></div>';
    loadTeam();
    loadAgencyCalendar();
}

// ── AGENCY CALENDAR — bookings mixed across all CRMs (HubSpot/Zoho-style) ──
var _AGCAL_FILTER='all';
async function loadAgencyCalendar(){
    var el=document.getElementById('agCalPanel'); if(!el) return;
    var r=null;
    try{ r=await fetch('/api/crm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'agency_calendar',token:token,portal_id:portalId})}).then(x=>x.json()); }catch(e){}
    if(!r||!r.success){ el.innerHTML='<div style="color:var(--muted);font-size:13px;">Could not load the agency calendar.</div>'; return; }
    window._AGCAL=(r.events||[]).filter(function(e){ return e.status!=='cancelled'; });
    window._AGSUBS=r.sub_accounts||[];
    renderAgencyCalendar();
}
function renderAgencyCalendar(){
    var el=document.getElementById('agCalPanel'); if(!el) return;
    var all=window._AGCAL||[]; var subs=window._AGSUBS||[];
    var now=Date.now();
    var events=all.filter(function(e){ return new Date(e.starts_at).getTime() >= now - 3600000; })
                  .filter(function(e){ return _AGCAL_FILTER==='all' || e.sub_account_id===_AGCAL_FILTER; })
                  .sort(function(a,b){ return new Date(a.starts_at)-new Date(b.starts_at); });
    var chips='<button onclick="agCalFilter(\'all\')" class="btn '+(_AGCAL_FILTER==='all'?'btn-teal':'btn-outline')+'" style="padding:5px 12px;font-size:11px;">All CRMs</button>'
      + subs.map(function(s){ return '<button onclick="agCalFilter(\''+s.id+'\')" class="btn '+(_AGCAL_FILTER===s.id?'btn-teal':'btn-outline')+'" style="padding:5px 12px;font-size:11px;">'+esc(s.name||'CRM')+'</button>'; }).join('');
    var body;
    if(!events.length){ body='<div style="color:var(--muted);font-size:13px;padding:14px 0;">No upcoming bookings across your CRMs.</div>'; }
    else {
        var lastDay=''; var parts=[];
        events.forEach(function(e){
            var d=new Date(e.starts_at); var day=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
            if(day!==lastDay){ parts.push('<div style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 6px;">'+esc(day)+'</div>'); lastDay=day; }
            parts.push('<div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #f1f5f9;">'
              +'<span style="width:10px;height:10px;border-radius:3px;background:'+esc(e.color||'#0d9488')+';flex-shrink:0;"></span>'
              +'<div style="width:70px;font-size:12px;font-weight:700;color:var(--secondary);flex-shrink:0;">'+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})+'</div>'
              +'<div style="flex:1;min-width:0;"><div style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(e.title||e.calendar_name||'Booking')+'</div>'
              +'<div style="font-size:11px;color:var(--muted);">'+esc(e.who||'')+(e.location?(' · '+esc(e.location)):'')+'</div></div>'
              +'<span style="font-size:10px;font-weight:800;color:#475569;background:#f1f5f9;border-radius:99px;padding:2px 9px;white-space:nowrap;">'+esc(e.crm_name||'')+'</span>'
              +'</div>');
        });
        body=parts.join('');
    }
    el.innerHTML='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;">'+chips+'</div>'+body;
}
window.agCalFilter=function(f){ _AGCAL_FILTER=f; renderAgencyCalendar(); };

// ── TEAM & RBAC (owners + agency admins) ──
var _team = null;
var PERM_LABELS = { team:'Manage team', agency_settings:'Agency settings & branding', sub_accounts:'Create / remove CRMs', contacts:'Contacts', opportunities:'Opportunities', conversations:'Conversations', calendars:'Calendars', forms:'Forms', reporting:'Reporting', crm_settings:'CRM settings' };
function roleLabel(r){ return r==='owner'?'Owner':r==='agency_admin'?'Agency Admin':r==='crm_admin'?'CRM Admin':r; }
function roleBadge(m){ var cls=m.role==='owner'?'role-owner':m.role==='agency_admin'?'role-admin':'role-sub'; return '<span class="role-badge '+cls+'">'+(m.role==='owner'&&m.is_primary?'★ ':'')+roleLabel(m.role)+'</span>'; }
function memScope(m){ if(m.role!=='crm_admin') return '<span style="font-size:11px;color:var(--muted);margin-left:8px;">all CRMs</span>'; var n=(m.sub_account_ids||[]).length; return '<span style="font-size:11px;color:var(--muted);margin-left:8px;">'+(n? n+' CRM'+(n>1?'s':''):'no CRMs yet')+'</span>'; }

async function loadTeam(){
    var r;
    try { r = await fetch('/api/whitelabel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'agency_team',token:token,portal_id:portalId})}).then(x=>x.json()); }
    catch(e){ r=null; }
    var el = document.getElementById('teamPanel'); if(!el) return;
    if (!r || !r.success){ el.innerHTML='<div style="color:#dc2626;font-size:13px;">Could not load team.</div>'; return; }
    _team = r;
    renderTeam();
}
function renderTeam(){
    var el = document.getElementById('teamPanel'); if(!el) return;
    var cm = _team.can_manage;
    var rows = (_team.members||[]).map(function(m){
        var canEdit = cm && (m.role!=='owner' || _team.is_owner);
        var actions = canEdit
            ? '<div style="display:flex;gap:10px;"><a href="#" onclick="openMember(\''+m.id+'\');return false;" style="color:var(--teal);font-weight:700;text-decoration:none;font-size:12px;">Edit</a><a href="#" onclick="revokeMember(\''+m.id+'\');return false;" style="color:#dc2626;font-weight:700;text-decoration:none;font-size:12px;">Remove</a></div>'
            : '';
        return '<div class="member-row"><div><div style="font-weight:700;font-size:13px;">'+esc(m.full_name||m.email||'—')+memScope(m)+'</div><div style="font-size:11px;color:var(--muted);">'+esc(m.email||'')+'</div></div><div style="display:flex;align-items:center;gap:12px;">'+roleBadge(m)+actions+'</div></div>';
    }).join('') || '<div style="color:var(--muted);font-size:13px;padding:8px 0;">No team members yet.</div>';

    var invites = (_team.invites||[]).length ? ('<div style="margin-top:14px;padding-top:12px;border-top:1px solid #f1f5f9;"><div style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:8px;">Pending invites</div>'
        + _team.invites.map(function(i){ return '<div class="member-row"><div><div style="font-weight:700;font-size:13px;">'+esc(i.email)+'</div><div style="font-size:11px;color:var(--muted);">Invited as '+roleLabel(i.role)+' · awaiting setup</div></div><div style="display:flex;gap:12px;align-items:center;">'+(i.token?'<a href="#" onclick="copyInvite(\''+i.token+'\');return false;" style="color:#0d9488;font-weight:700;text-decoration:none;font-size:12px;">Copy link</a>':'')+(cm?'<a href="#" onclick="revokeInvite(\''+i.id+'\');return false;" style="color:#dc2626;font-weight:700;text-decoration:none;font-size:12px;">Cancel</a>':'')+'</div></div>'; }).join('')
        + '</div>') : '';

    var addBtn = cm ? '<div style="margin-top:14px;padding-top:12px;border-top:1px solid #f1f5f9;"><button class="btn btn-teal" onclick="openMember()"><span class="material-icons" style="font-size:15px;">person_add</span> Add member</button></div>' : '';
    el.innerHTML = rows + invites + addBtn;
}
async function _teamApi(body){
    var r = await fetch('/api/whitelabel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({token:token,portal_id:portalId},body))}).then(x=>x.json());
    if(!r||!r.success){ Swal.fire('Error',(r&&r.message)||'Action failed.','error'); return null; }
    loadTeam();
    return r;
}
// Dynamic visibility inside the member modal.
window.mToggleSource = function(){ var v=(document.getElementById('mSource')||{}).value; var ex=document.getElementById('mExistingWrap'), iv=document.getElementById('mInviteWrap'); if(ex) ex.style.display=v==='existing'?'block':'none'; if(iv) iv.style.display=v==='invite'?'block':'none'; };
window.mOnRole = function(){ var r=(document.getElementById('mRole')||{}).value; var scope=document.getElementById('mCrmScope'); if(scope) scope.style.display=(r==='crm_admin')?'block':'none'; var ag=document.getElementById('mAgencyPerms'); if(ag) ag.style.display=(r==='crm_admin')?'none':'block'; var owner=(r==='owner'); document.querySelectorAll('.mPerm').forEach(function(x){ x.disabled=owner; if(owner) x.checked=true; }); };
window.openMember = async function(memberId){
    var m = memberId ? (_team.members||[]).find(function(x){return x.id===memberId;}) : null;
    var editing = !!m;
    var roles = (_team.assignable_roles||[]).slice();
    if (editing && !roles.includes(m.role)) roles.unshift(m.role);
    if (!roles.length){ Swal.fire('Not allowed','You cannot manage the team.','info'); return; }
    var curRole = editing ? m.role : (roles.indexOf('crm_admin')>=0?'crm_admin':roles[0]);
    var roleOpts = roles.map(function(r){return '<option value="'+r+'"'+(r===curRole?' selected':'')+'>'+roleLabel(r)+'</option>';}).join('');
    var lbl=function(t){return '<div style="font-size:11px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:0.4px;margin:12px 2px 6px;">'+t+'</div>';};

    var candOpts = (_team.candidates||[]).map(function(c){ return '<option value="'+esc(c.id)+'">'+esc(c.full_name||c.email||c.id)+'</option>'; }).join('');
    var defSource = candOpts ? 'existing' : 'invite';
    var sourceBlock = editing ? '' :
        lbl('How are you adding them?')
          +'<select id="mSource" class="swal2-select" onchange="mToggleSource()" style="width:100%;margin:0;">'
          +(candOpts?'<option value="existing">Choose from sub-partners</option>':'')
          +'<option value="invite">Invite by email (not yet a PayProTec partner)</option></select>'
          +'<div id="mExistingWrap"'+(defSource==='existing'?'':' style="display:none;"')+'>'
            +'<select id="mPerson" class="swal2-select" style="width:100%;margin:8px 0 0;">'+candOpts+'</select>'
            +'<div style="font-size:11px;color:var(--muted);margin:6px 2px 0;">Existing PayProTec sub-partners — they’re added instantly and sign in with their current login (no email sent).</div>'
          +'</div>'
          +'<div id="mInviteWrap"'+(defSource==='invite'?'':' style="display:none;"')+'>'
            +'<input id="mEmail" class="swal2-input" placeholder="name@company.com" style="width:100%;margin:8px 0 0;">'
            +'<div style="font-size:11px;color:var(--muted);margin:6px 2px 0;">For someone not in the PayProTec program yet — we’ll email them a setup link to create their account.</div>'
          +'</div>';

    var crmChecks = (_team.sub_accounts||[]).map(function(s){ var on=editing && (m.sub_account_ids||[]).indexOf(s.id)>=0; return '<label style="display:inline-flex;align-items:center;gap:5px;font-size:12px;margin:0 12px 6px 0;"><input type="checkbox" class="mCrm" value="'+esc(s.id)+'"'+(on?' checked':'')+'> '+esc(s.name)+'</label>'; }).join('') || '<span style="font-size:12px;color:var(--muted);">No CRMs yet.</span>';
    var permBox=function(area){ var checked; if(editing){ checked = (PERM_AGENCY.indexOf(area)>=0) ? (m.permissions&&m.permissions[area]===true) : !(m.permissions&&m.permissions[area]===false); } else { checked = PERM_AGENCY.indexOf(area)<0; } return '<label style="display:inline-flex;align-items:center;gap:5px;font-size:12px;margin:0 12px 6px 0;"><input type="checkbox" class="mPerm" data-key="'+area+'"'+(checked?' checked':'')+'> '+PERM_LABELS[area]+'</label>'; };
    var PERM_AGENCY=(_team.perm_areas&&_team.perm_areas.agency)||['team','agency_settings','sub_accounts'];
    var PERM_CRM=(_team.perm_areas&&_team.perm_areas.crm)||['contacts','opportunities','conversations','calendars','forms','reporting','crm_settings'];
    // permBox closure references PERM_AGENCY; ensure defined before use by re-declaring via hoist — define first:
    window.__PERM_AGENCY=PERM_AGENCY;
    var html='<div style="text-align:left;max-height:64vh;overflow:auto;padding:2px 4px;">'
      + sourceBlock
      + lbl('Role')+'<select id="mRole" class="swal2-select" onchange="mOnRole()" style="width:100%;margin:0;">'+roleOpts+'</select>'
      + '<div id="mCrmScope">'+lbl('Which CRMs can they access?')+crmChecks+'</div>'
      + '<div id="mAgencyPerms">'+lbl('Agency permissions')+PERM_AGENCY.map(permBox).join('')+'</div>'
      + lbl('CRM permissions')+PERM_CRM.map(permBox).join('')
      + '</div>';
    var res = await Swal.fire({ title: editing?'Edit member':'Add member', html:html, width:560, showCancelButton:true, confirmButtonText: editing?'Save':'Add', confirmButtonColor:'#0d9488', focusConfirm:false,
        didOpen:function(){ mToggleSource(); mOnRole(); },
        preConfirm:function(){
            var role=document.getElementById('mRole').value;
            var perms={}; document.querySelectorAll('.mPerm').forEach(function(x){ perms[x.getAttribute('data-key')]=x.checked; });
            var scope=Array.prototype.slice.call(document.querySelectorAll('.mCrm')).filter(function(x){return x.checked;}).map(function(x){return x.value;});
            if(role==='crm_admin' && !scope.length){ Swal.showValidationMessage('Pick at least one CRM for a CRM admin.'); return false; }
            if(editing) return {mode:'edit', role:role, permissions:perms, sub_account_ids:scope};
            var src=document.getElementById('mSource').value;
            if(src==='existing'){ var pid=(document.getElementById('mPerson')||{}).value; if(!pid){Swal.showValidationMessage('Pick a person.');return false;} return {mode:'grant', member_person_id:pid, role:role, permissions:perms, sub_account_ids:scope}; }
            var email=(document.getElementById('mEmail').value||'').trim(); if(!email){Swal.showValidationMessage('Enter an email.');return false;} return {mode:'invite', email:email, role:role, permissions:perms, sub_account_ids:scope};
        }});
    if(!res.isConfirmed) return;
    var v=res.value, out=null;
    if(v.mode==='edit') out=await _teamApi({action:'agency_update_member', member_id:memberId, role:v.role, permissions:v.permissions, sub_account_ids:v.sub_account_ids});
    else if(v.mode==='grant') out=await _teamApi({action:'agency_grant', member_person_id:v.member_person_id, role:v.role, permissions:v.permissions, sub_account_ids:v.sub_account_ids});
    else out=await _teamApi({action:'agency_invite', email:v.email, role:v.role, permissions:v.permissions, sub_account_ids:v.sub_account_ids});
    if(!out) return;
    if(out.added){
        // Existing PayProTec person added directly — no email is sent (or needed).
        Swal.fire({icon:'success',title:'Added to the team',text: out.message || 'They already have a login and can sign in now.'});
    } else if(out.invited){
        var link = out.accept_url || (location.origin + '/partner?invite=' + (v.email||''));
        if(out.email_sent){
            Swal.fire({icon:'success',title:'Invite email sent', html:'We emailed a setup link to <b>'+esc(v.email)+'</b>.<br><br><span style="font-size:12px;color:#64748b;">Setup link (share if needed):</span><br><input readonly value="'+esc(link)+'" onclick="this.select()" style="width:100%;margin-top:6px;padding:8px;border:1px solid #e2e8f0;border-radius:8px;font-size:12px;">'});
        } else {
            Swal.fire({icon:'warning',title:'Invite created — email not sent', html:'The setup email couldn’t be sent'+(out.email_error?' ('+esc(out.email_error)+')':'')+'. Share this link with <b>'+esc(v.email)+'</b> so they can set up their account:<br><input readonly value="'+esc(link)+'" onclick="this.select()" style="width:100%;margin-top:8px;padding:8px;border:1px solid #e2e8f0;border-radius:8px;font-size:12px;">'});
        }
    }
};
window.revokeMember = async function(memberId){
    var c = await Swal.fire({icon:'warning',title:'Remove member?',text:'They lose access to this agency.',showCancelButton:true,confirmButtonText:'Remove',confirmButtonColor:'#dc2626'});
    if(!c.isConfirmed) return;
    await _teamApi({action:'agency_revoke', member_id:memberId});
};
window.copyInvite = function(tokenStr){
    var link = location.origin + '/partner?invite=' + tokenStr;
    try { navigator.clipboard.writeText(link); } catch(e){}
    Swal.fire({icon:'success',title:'Setup link copied', html:'Send this to the person so they can set up their account:<br><input readonly value="'+esc(link)+'" onclick="this.select()" style="width:100%;margin-top:8px;padding:8px;border:1px solid #e2e8f0;border-radius:8px;font-size:12px;">'});
};
window.revokeInvite = async function(inviteId){
    var c = await Swal.fire({icon:'warning',title:'Cancel invite?',showCancelButton:true,confirmButtonText:'Cancel invite',confirmButtonColor:'#dc2626'});
    if(!c.isConfirmed) return;
    await _teamApi({action:'agency_revoke_invite', invite_id:inviteId});
};

window.renameAgency = async function(){
    var cur = (window._agencyName)||'';
    var res = await Swal.fire({ title:'Agency name', input:'text', inputValue:cur, inputPlaceholder:'e.g. Devvly Payments', showCancelButton:true, confirmButtonText:'Save', confirmButtonColor:'#0d9488' });
    if(!res.isConfirmed) return;
    var r = await fetch('/api/whitelabel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'set_agency_name',token:token,portal_id:portalId,agency_name:res.value||''})}).then(x=>x.json());
    if(r&&r.success){ Swal.fire({icon:'success',title:'Saved',timer:900,showConfirmButton:false}); load(); }
    else Swal.fire('Error',(r&&r.message)||'Could not save.','error');
};
function handleLogout(){ fetch('/api/partner-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout',token})}).finally(function(){ ppClearPartner(); location.href='/partner'; }); }
window.addEventListener('pp-context-change', function(){
    var p = localStorage.getItem('pp_active_portal') || '';
    var s = localStorage.getItem('pp_active_sub_account') || '';
    if (s) { location.href='/partner/sub-account?sub='+s; return; }
    if (p && p !== portalId) location.href='/partner/agency?portal='+p;
});
load();
</script>
