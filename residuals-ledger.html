<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residuals Ledger | PayProTec</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="css/pp-system.css">
    <script src="js/tz.js"></script>
    <script>(function(){const u=localStorage.getItem('pp_userid'),v=localStorage.getItem('pp_verified');if(!u||v!=='true')window.location.href='/?reason=denied';})();</script>
    <style>
        .rl-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px;}
        .rl-kpi{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:15px 16px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
        .rl-kpi .v{font-size:1.35rem;font-weight:800;font-family:'DM Mono',monospace;color:#0a1628;}
        .rl-kpi .l{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-top:3px;}
        .rl-search{width:100%;max-width:340px;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:9px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;margin-bottom:12px;}
        table.rl{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;}
        table.rl th{background:#f8fafc;padding:9px 12px;text-align:left;font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;}
        table.rl td{padding:9px 12px;border-bottom:1px solid #f1f5f9;font-size:13px;color:#334155;}
        table.rl td.num{text-align:right;font-family:'DM Mono',monospace;white-space:nowrap;}
        tr.prow{cursor:pointer;}
        tr.prow:hover{background:#f8fafc;}
        tr.idrow td{background:#fbfdff;font-size:12px;color:#475569;}
        tr.idrow .idstr{font-family:'DM Mono',monospace;font-size:11px;}
        .p49-badge{background:#eef2ff;color:#4338ca;font-size:9px;font-weight:800;border-radius:20px;padding:1px 6px;margin-left:5px;}
        .caret{font-size:16px;vertical-align:-4px;color:#94a3b8;transition:transform .15s;}
        tr.prow.open .caret{transform:rotate(90deg);}
        table.rl tfoot td{font-weight:800;color:#0a1628;background:#f1f5f9;}
    </style>
</head>
<body>
<div class="pp-container">
    <div class="pp-header">
        <div class="pp-header-left">
            <a href="/" class="pp-back-btn"><span class="material-icons" style="font-size:16px;">arrow_back</span> HOME</a>
            <h1 class="pp-header-title">Residuals Ledger</h1>
        </div>
        <div style="display:flex;gap:8px;">
            <button class="pp-btn pp-btn-secondary" onclick="exportLedger()"><span class="material-icons" style="font-size:16px;">download</span> Export CSV</button>
            <button class="pp-btn pp-btn-secondary" onclick="loadLedger()"><span class="material-icons" style="font-size:16px;">refresh</span></button>
        </div>
    </div>
    <div id="rl-note" style="font-size:12px;color:#64748b;margin-bottom:14px;"></div>
    <div id="rl-kpis" class="rl-kpis"></div>
    <input id="rl-search" class="rl-search" placeholder="Search partner or company…" oninput="renderTable()">
    <table class="rl">
        <thead><tr>
            <th>Partner</th><th style="text-align:right;">IDs</th><th style="text-align:right;">Merchants</th>
            <th style="text-align:right;">30D Volume</th><th style="text-align:right;">Net Residual</th>
            <th style="text-align:right;color:#004990;">PPT Residual</th><th style="text-align:right;color:#059669;">Agent Payout</th>
        </tr></thead>
        <tbody id="rl-body"><tr><td colspan="7" style="text-align:center;color:#94a3b8;padding:24px;">Loading…</td></tr></tbody>
        <tfoot id="rl-foot"></tfoot>
    </table>
</div>

<script src="js/notif-bell.js" defer></script>
<script>
    const AUTH = () => ({ 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (localStorage.getItem('pp_session_token') || '') });
    const fmt = n => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 }).format(n || 0);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    let _data = null;

    async function loadLedger() {
        const body = document.getElementById('rl-body');
        body.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#94a3b8;padding:24px;">Loading residuals across all IDs…</td></tr>';
        try {
            const res = await fetch('/api/scheduled-reports', { method: 'POST', headers: AUTH(), body: JSON.stringify({ action: 'residuals_ledger_all' }) });
            const r = await res.json();
            if (!r.success) throw new Error(r.message || 'Failed (need reports access)');
            _data = r.data;
            renderKpis(); renderTable();
        } catch (e) {
            body.innerHTML = `<tr><td colspan="7" style="text-align:center;color:#dc2626;padding:24px;">${esc(e.message)}</td></tr>`;
        }
    }

    function renderKpis() {
        const d = _data, t = d.totals || {};
        document.getElementById('rl-note').textContent = 'All partner residuals as of ' + (d.date || '') + '. Net = 30-day volume × 3%; Agent Payout = Net × the ID’s rev-share%; PPT = the remainder. Prime49 IDs default to 50%. Change a rev-share on the Partners dashboard and this recomputes on refresh.';
        const kpis = [
            ['Partners', (d.partners || []).length], ['Agent IDs', t.id_count || 0], ['Merchants', t.merchant_count || 0],
            ['30D Volume', fmt(t.volume_30d)], ['Net Residual', fmt(t.net_residual)],
            ['PPT Residual', fmt(t.ppt_residual)], ['Agent Payouts', fmt(t.agent_residual)]
        ];
        document.getElementById('rl-kpis').innerHTML = kpis.map(k =>
            `<div class="rl-kpi"><div class="v">${typeof k[1] === 'number' ? k[1].toLocaleString() : k[1]}</div><div class="l">${k[0]}</div></div>`).join('');
    }

    function renderTable() {
        if (!_data) return;
        const q = (document.getElementById('rl-search').value || '').trim().toLowerCase();
        let partners = _data.partners || [];
        if (q) partners = partners.filter(p => (p.partner_name || '').toLowerCase().includes(q) || (p.company || '').toLowerCase().includes(q));
        const body = document.getElementById('rl-body');
        if (!partners.length) { body.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#94a3b8;padding:24px;">No matching partners.</td></tr>'; }
        else {
            body.innerHTML = partners.map((p, i) => {
                const head = `<tr class="prow" onclick="toggleP(${i})" id="prow-${i}">
                    <td style="font-weight:700;color:#002d5a;"><span class="material-icons caret">chevron_right</span>${esc(p.partner_name)}${p.company && p.company !== '—' ? ` <span style="color:#94a3b8;font-weight:500;font-size:11px;">· ${esc(p.company)}</span>` : ''}</td>
                    <td class="num">${p.ids.length}</td>
                    <td class="num">${(p.merchant_count || 0).toLocaleString()}</td>
                    <td class="num">${fmt(p.volume_30d)}</td>
                    <td class="num">${fmt(p.net_residual)}</td>
                    <td class="num" style="color:#004990;">${fmt(p.ppt_residual)}</td>
                    <td class="num" style="color:#059669;font-weight:700;">${fmt(p.agent_residual)}</td>
                </tr>`;
                const idRows = p.ids.map(id => `<tr class="idrow" data-p="${i}" style="display:none;">
                    <td style="padding-left:34px;"><span class="idstr">${esc(id.id_string)}</span>${id.prime49 ? '<span class="p49-badge">P49</span>' : ''} <span style="color:#94a3b8;">· ${id.rev_share}%</span></td>
                    <td></td>
                    <td class="num">${(id.merchant_count || 0).toLocaleString()}</td>
                    <td class="num">${fmt(id.volume_30d)}</td>
                    <td class="num">${fmt(id.net_residual)}</td>
                    <td class="num" style="color:#004990;">${fmt(id.ppt_residual)}</td>
                    <td class="num" style="color:#059669;">${fmt(id.agent_residual)}</td>
                </tr>`).join('');
                return head + idRows;
            }).join('');
        }
        // Footer totals reflect the filtered set.
        const sum = (k) => partners.reduce((n, p) => n + (p[k] || 0), 0);
        const mc = partners.reduce((n, p) => n + (p.merchant_count || 0), 0);
        document.getElementById('rl-foot').innerHTML = partners.length ? `
            <tr><td>Total (${partners.length} partner${partners.length === 1 ? '' : 's'})</td>
            <td class="num">${partners.reduce((n, p) => n + p.ids.length, 0)}</td>
            <td class="num">${mc.toLocaleString()}</td>
            <td class="num">${fmt(sum('volume_30d'))}</td>
            <td class="num">${fmt(sum('net_residual'))}</td>
            <td class="num" style="color:#004990;">${fmt(sum('ppt_residual'))}</td>
            <td class="num" style="color:#059669;">${fmt(sum('agent_residual'))}</td></tr>` : '';
    }

    function toggleP(i) {
        const row = document.getElementById('prow-' + i);
        const open = row.classList.toggle('open');
        document.querySelectorAll('tr.idrow[data-p="' + i + '"]').forEach(r => { r.style.display = open ? '' : 'none'; });
    }

    function exportLedger() {
        if (!_data || !(_data.partners || []).length) return;
        const esc2 = v => { const s = (v == null ? '' : String(v)); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
        const header = ['Partner', 'Company', 'Agent ID', 'Prime49', 'Rev%', 'Merchants', '30D Volume', 'Net Residual', 'PPT Residual', 'Agent Payout'];
        const lines = [header.join(',')];
        (_data.partners || []).forEach(p => p.ids.forEach(id => {
            lines.push([p.partner_name, p.company, id.id_string, id.prime49 ? 'yes' : 'no', id.rev_share, id.merchant_count, id.volume_30d.toFixed(2), id.net_residual.toFixed(2), id.ppt_residual.toFixed(2), id.agent_residual.toFixed(2)].map(esc2).join(','));
        }));
        const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = 'residuals-ledger.csv'; a.click();
    }

    loadLedger();
</script>
</body>
</html>
