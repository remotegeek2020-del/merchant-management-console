<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading…</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#eef2f7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#0f172a;}
  .lp-card{width:100%;max-width:480px;background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.18);overflow:hidden;}
  .lp-img{line-height:0;}.lp-img img{width:100%;display:block;}
  .lp-body{padding:28px;}
  .lp-h{font-size:clamp(22px,5vw,30px);font-weight:800;line-height:1.2;margin-bottom:10px;}
  .lp-sub{font-size:15px;line-height:1.6;color:#475569;margin-bottom:20px;}
  .lp-sub p{margin:0 0 8px;}.lp-sub a{color:#004990;}
  .lp-field{width:100%;padding:13px 15px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:15px;margin-bottom:12px;font-family:inherit;}
  .lp-field:focus{outline:none;border-color:#004990;}
  .lp-btn{width:100%;padding:15px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;background:#004990;color:#fff;font-family:inherit;}
  .lp-btn:hover{filter:brightness(1.07);}
  .lp-msg{font-size:13px;color:#dc2626;margin-top:8px;min-height:16px;}
  .lp-foot{text-align:center;font-size:11px;color:#94a3b8;padding:14px;}
  .lp-thanks{text-align:center;padding:40px 24px;}
  .lp-thanks .ic{font-size:52px;}
  .lp-err{text-align:center;padding:60px 24px;color:#64748b;}
  iframe{width:100%;min-height:520px;border:none;}
</style>
</head>
<body>
<div id="root"><div class="lp-err">Loading…</div></div>
<script>
(function(){
  function qp(n){ try{ return new URLSearchParams(location.search).get(n)||''; }catch(e){ return ''; } }
  // slug from /p/<slug> path or ?slug=
  var m = location.pathname.match(/\/p\/([^\/?#]+)/);
  var slug = (m && m[1]) || qp('slug');
  var root = document.getElementById('root');
  // Referral capture: remember ?ref across the visit so it rides on the submit.
  var REF = qp('ref');
  try { if (REF) localStorage.setItem('ppx_ref', REF); else REF = localStorage.getItem('ppx_ref') || ''; } catch (e) {}
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);}); }
  function bodyHtml(b){ b=b==null?'':String(b); return /<[a-z][\s\S]*>/i.test(b)?b:esc(b).replace(/\n/g,'<br>'); }
  function ctx(){ return { ref:document.referrer.slice(0,300), url:location.href.slice(0,300), utm_source:qp('utm_source'), utm_medium:qp('utm_medium'), utm_campaign:qp('utm_campaign') }; }

  if(!slug){ root.innerHTML='<div class="lp-err">Page not found.</div>'; return; }

  fetch('/api/landing?action=get&slug='+encodeURIComponent(slug)).then(function(r){return r.json();}).then(function(d){
    if(!d.success || !d.page){ document.title='Not found'; root.innerHTML='<div class="lp-err">This page isn\'t available.</div>'; return; }
    render(d.page);
  }).catch(function(){ root.innerHTML='<div class="lp-err">Something went wrong.</div>'; });

  function render(p){
    document.title = p.title || p.headline || 'PayProTec';
    window.__lpPage = p;
    if (p.page_type === 'calculator'){ renderCalculator(p); return; }
    // Advanced (AI / custom-HTML) page: inject it full-width and wire its form.
    if (p.custom_html && p.custom_html.trim()){
      document.body.style.background = '#ffffff';
      document.body.style.display = 'block';
      document.body.style.padding = '0';
      root.style.width = '100%';
      root.innerHTML = p.custom_html;
      var form = root.querySelector('#lead-form') || root.querySelector('form');
      if (form){
        form.addEventListener('submit', function(e){
          e.preventDefault();
          var get = function(n){ var el = form.querySelector('[name="'+n+'"]'); return el ? String(el.value||'').trim() : ''; };
          var name=get('name'), email=get('email'), phone=get('phone');
          if(!email && !phone){ alert('Please enter your email or phone.'); return; }
          if(email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ alert('Please enter a valid email.'); return; }
          var sub = form.querySelector('[type=submit],button'); if(sub){ sub.disabled=true; }
          fetch('/api/landing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'submit',slug:slug,ref:REF,name:name,email:email,phone:phone,meta:ctx()})})
            .then(function(r){return r.json();}).then(function(d){
              if(d.success){ form.innerHTML='<div style="text-align:center;padding:24px;font-size:18px;font-weight:700;">✅ '+esc(p.thanks||'Thank you!')+'</div>'; }
              else { alert(d.message||'Something went wrong.'); if(sub) sub.disabled=false; }
            }).catch(function(){ alert('Network error — please try again.'); if(sub) sub.disabled=false; });
        });
      }
      return;
    }
    var t = p.theme || {};
    var accent = t.accent || '#004990', btnText = t.btnText || '#fff', radius = (t.radius!=null?t.radius:16);
    var bg = t.bg || '#fff', titleCol = t.title || '#0f172a', textCol = t.text || '#475569';
    var align = t.align==='center'?'center':'left';
    var maxw = t.width==='narrow'?400:t.width==='wide'?560:480;
    var btnCss = t.btnStyle==='outline'?('background:transparent;color:'+accent+';border:2px solid '+accent+';')
      : t.btnStyle==='pill'?('background:'+accent+';color:'+btnText+';border-radius:999px;')
      : ('background:'+accent+';color:'+btnText+';');
    document.body.style.background = (t.overlay==='light') ? '#f8fafc' : '#0b1220';

    var cc = p.contact || {};
    var formInner;
    if(cc.mode==='ghl_form' && cc.ghl_form_id){
      formInner = '<iframe src="https://api.leadconnectorhq.com/widget/form/'+esc(cc.ghl_form_id)+'"></iframe>';
    } else {
      var fields='';
      if(cc.name) fields+='<input class="lp-field" id="lp-name" placeholder="Your name'+(req(cc,'name')?' *':'')+'">';
      if(cc.email!==false) fields+='<input class="lp-field" id="lp-email" type="email" placeholder="Email'+(req(cc,'email')?' *':'')+'">';
      if(cc.phone) fields+='<input class="lp-field" id="lp-phone" placeholder="Phone'+(req(cc,'phone')?' *':'')+'">';
      if(!fields) fields='<input class="lp-field" id="lp-email" type="email" placeholder="Email *">';
      formInner = fields + '<button class="lp-btn" style="'+btnCss+';border-radius:'+radius+'px;" onclick="__lpSubmit()">'+esc(p.cta_label||'Get started')+'</button><div class="lp-msg" id="lp-msg"></div>';
    }

    var img = p.image_url ? '<div class="lp-img"><img src="'+esc(p.image_url)+'" alt=""></div>' : '';
    root.innerHTML =
      '<div class="lp-card" style="background:'+bg+';border-radius:'+radius+'px;max-width:'+maxw+'px;">' + img +
      '<div class="lp-body" style="text-align:'+align+';">' +
        (p.headline?'<div class="lp-h" style="color:'+titleCol+';">'+esc(p.headline)+'</div>':'') +
        (p.subtext?'<div class="lp-sub" style="color:'+textCol+';">'+bodyHtml(p.subtext)+'</div>':'') +
        '<div id="lp-form">'+formInner+'</div>' +
      '</div>' +
      '<div class="lp-foot">Powered by PayProTec</div></div>';

    window.__lpPage = p;
  }
  function req(cc,f){ return cc.required && cc.required.indexOf(f)!==-1; }

  function money(n){ return '$'+Math.round(n).toLocaleString(); }
  function renderCalculator(p){
    var t=p.theme||{}, accent=t.accent||'#004990', btnText=t.btnText||'#fff', radius=(t.radius!=null?t.radius:16);
    var bg=t.bg||'#fff', titleCol=t.title||'#0f172a', textCol=t.text||'#475569';
    document.body.style.background=(t.overlay==='light')?'#f8fafc':'#0b1220';
    var target=(p.calc&&p.calc.target_rate)||2.3;
    root.innerHTML=
      '<div class="lp-card" style="background:'+bg+';border-radius:'+radius+'px;max-width:520px;">'+
      '<div class="lp-body">'+
        '<div class="lp-h" style="color:'+titleCol+';">'+esc(p.headline||'How much could you save on processing?')+'</div>'+
        (p.subtext?'<div class="lp-sub" style="color:'+textCol+';">'+bodyHtml(p.subtext)+'</div>':'')+
        '<label style="font-size:12px;font-weight:700;color:'+textCol+';">Monthly card volume ($)</label>'+
        '<input class="lp-field" id="calc-vol" type="number" inputmode="numeric" placeholder="e.g. 50000">'+
        '<label style="font-size:12px;font-weight:700;color:'+textCol+';">Your current effective rate (%)</label>'+
        '<input class="lp-field" id="calc-rate" type="number" step="0.01" placeholder="e.g. 3.2">'+
        '<button class="lp-btn" style="background:'+accent+';color:'+btnText+';border-radius:'+radius+'px;" onclick="__calc()">Calculate my savings</button>'+
        '<div id="calc-out" style="display:none;margin-top:18px;"></div>'+
      '</div>'+
      '<div class="lp-foot">Estimate only — a specialist will confirm your exact savings.</div></div>';
    window.__calcCfg={ target:target, accent:accent, btnText:btnText, radius:radius, textCol:textCol, contact:p.contact||{} };
  }
  window.__calc=function(){
    var cfg=window.__calcCfg; var vol=parseFloat(document.getElementById('calc-vol').value)||0; var rate=parseFloat(document.getElementById('calc-rate').value)||0;
    if(vol<=0||rate<=0){ alert('Enter your monthly volume and current rate.'); return; }
    var cur=vol*rate/100, ours=vol*cfg.target/100, save=Math.max(0,cur-ours), yr=save*12;
    var cc=cfg.contact; var fields='';
    if(cc.name) fields+='<input class="lp-field" id="calc-name" placeholder="Your name">';
    if(cc.email!==false) fields+='<input class="lp-field" id="calc-email" type="email" placeholder="Email">';
    if(cc.phone) fields+='<input class="lp-field" id="calc-phone" placeholder="Phone">';
    if(!fields) fields='<input class="lp-field" id="calc-email" type="email" placeholder="Email">';
    var out=document.getElementById('calc-out');
    out.style.display='block';
    out.innerHTML='<div style="text-align:center;padding:16px;border-radius:12px;background:'+(cfg.textCol?'#f0fdf4':'#f0fdf4')+';border:1px solid #bbf7d0;margin-bottom:16px;">'+
      '<div style="font-size:13px;color:#166534;font-weight:700;">Estimated savings</div>'+
      '<div style="font-size:34px;font-weight:800;color:#15803d;">'+money(save)+'<span style="font-size:15px;">/mo</span></div>'+
      '<div style="font-size:13px;color:#166534;">about '+money(yr)+' per year</div></div>'+
      '<div style="font-weight:700;margin-bottom:8px;">Get your detailed breakdown:</div>'+fields+
      '<button class="lp-btn" style="background:'+cfg.accent+';color:'+cfg.btnText+';border-radius:'+cfg.radius+'px;" onclick="__calcSubmit()">Send me the report</button>'+
      '<div class="lp-msg" id="calc-msg"></div>';
    out.scrollIntoView({behavior:'smooth',block:'nearest'});
    window.__calcData={ vol:vol, rate:rate, save:Math.round(save), annual:Math.round(yr) };
  };
  window.__calcSubmit=function(){
    var g=function(id){ var el=document.getElementById(id); return el?el.value.trim():''; };
    var name=g('calc-name'), email=g('calc-email'), phone=g('calc-phone'); var msg=document.getElementById('calc-msg');
    if(!email && !phone){ msg.textContent='Please enter your email or phone.'; return; }
    if(email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg.textContent='Please enter a valid email.'; return; }
    var meta=ctx(); var d=window.__calcData||{}; meta.calc_volume=d.vol; meta.calc_rate=d.rate; meta.calc_savings=d.save;
    var btn=document.querySelector('#calc-out .lp-btn'); if(btn){ btn.disabled=true; btn.textContent='Sending…'; }
    fetch('/api/landing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'submit',slug:slug,ref:REF,name:name,email:email,phone:phone,meta:meta})})
      .then(function(r){return r.json();}).then(function(d2){
        if(d2.success){ document.getElementById('calc-out').innerHTML='<div style="text-align:center;padding:30px;"><div style="font-size:44px;">✅</div><div style="font-weight:800;font-size:18px;margin-top:8px;">'+esc((window.__lpPage&&window.__lpPage.thanks)||'Thanks! Your report is on the way.')+'</div></div>'; }
        else { msg.textContent=d2.message||'Something went wrong.'; if(btn){ btn.disabled=false; btn.textContent='Send me the report'; } }
      }).catch(function(){ msg.textContent='Network error — try again.'; if(btn) btn.disabled=false; });
  };

  window.__lpSubmit = function(){
    var p = window.__lpPage; var cc = p.contact||{};
    var g=function(id){ var el=document.getElementById(id); return el?el.value.trim():''; };
    var name=g('lp-name'), email=g('lp-email'), phone=g('lp-phone');
    var msg=document.getElementById('lp-msg');
    var rq=cc.required||[];
    if(rq.indexOf('name')!==-1 && !name){ msg.textContent='Please enter your name.'; return; }
    if(rq.indexOf('phone')!==-1 && !phone){ msg.textContent='Please enter your phone.'; return; }
    if((rq.indexOf('email')!==-1 || (!phone)) && !email){ msg.textContent='Please enter your email.'; return; }
    if(email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg.textContent='Please enter a valid email.'; return; }
    var btn=document.querySelector('.lp-btn'); if(btn){ btn.disabled=true; btn.textContent='Sending…'; }
    fetch('/api/landing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'submit',slug:slug,ref:REF,name:name,email:email,phone:phone,meta:ctx()})})
      .then(function(r){return r.json();}).then(function(d){
        if(d.success){ document.getElementById('lp-form').innerHTML=''; root.querySelector('.lp-body').innerHTML='<div class="lp-thanks"><div class="ic">✅</div><div style="font-weight:800;font-size:20px;margin-top:10px;">'+esc(p.thanks||'Thank you!')+'</div></div>'; }
        else { msg.textContent=d.message||'Something went wrong.'; if(btn){ btn.disabled=false; btn.textContent=p.cta_label||'Get started'; } }
      }).catch(function(){ msg.textContent='Network error — please try again.'; if(btn){ btn.disabled=false; } });
  };
})();
</script>
</body>
</html>
